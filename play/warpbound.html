/* =====================================================================

   SFX.play(name,{x|sx,v,k,...})  one-shot. x = world x (panned through the camera), sx = screen x
   SFX.hold(name,p)               keeps a looping sound going this frame (engine, beam, rumble…)
   SFX.endFrame()                 once a frame: loops nobody held fade out (so pausing silences them)
   SFX.setVolume(0..1)            the Options volume

const SFX=(function(){
  const AC=window.AudioContext||window.webkitAudioContext;

  const rnd=(a,b)=>a+Math.random()*(b-a);

  /* ---------- building blocks (they work on any audio context, so sounds can be rendered offline too) ---------- */
  function bufs(c){
    let B=BUFS.get(c); if(B) return B;
    const n=Math.floor(c.sampleRate*1.6), w=c.createBuffer(1,n,c.sampleRate), b=c.createBuffer(1,n,c.sampleRate);
    const dw=w.getChannelData(0), db=b.getChannelData(0); let l=0;
    for(let i=0;i<n;i++){ const r=Math.random()*2-1; dw[i]=r; l=(l+0.02*r)/1.02; db[i]=l*3.5; }
    B={w,b}; BUFS.set(c,B); return B;
  }
  function env(g,t,a,d,v,hold){
    const p=g.gain; a=Math.max(0.001,Math.min(a,d*0.9));
    p.setValueAtTime(0,t); p.linearRampToValueAtTime(v,t+a);
    if(hold) p.setValueAtTime(v,Math.min(t+a+hold,t+d-0.01));
    p.exponentialRampToValueAtTime(0.0006,t+d); p.linearRampToValueAtTime(0,t+d+0.02);
  }
  function filt(c,n,fl,t,d){
    const f=c.createBiquadFilter(); f.type=fl[0]; f.frequency.setValueAtTime(fl[1],t);
    if(fl[3]) f.frequency.exponentialRampToValueAtTime(fl[3],t+(fl[4]||d));
    f.Q.value=fl[2]||0.8; n.connect(f); return f;
  }
  /* o: w wave · f→f2 pitch (sd sweep time, lin) · d length · a attack · hold · v volume · vib [rate,depth] · fl [type,f,Q,f2] */
  function tone(X,o){
    const c=X.c, t=X.t+(o.at||0), d=o.d||0.1, k=X.k||1, stop=t+d+0.05;
    const os=c.createOscillator(); os.type=o.w||'sine';
    os.frequency.setValueAtTime(o.f*k,t);
    if(o.f2){ const e=t+(o.sd||d); if(o.lin) os.frequency.linearRampToValueAtTime(o.f2*k,e); else os.frequency.exponentialRampToValueAtTime(o.f2*k,e); }
    if(o.det) os.detune.value=o.det;

    let n=os; if(o.fl) n=filt(c,n,o.fl,t,d);
    const g=c.createGain(); env(g,t,o.a||0.003,d,o.v||0.2,o.hold); n.connect(g); g.connect(X.out);
    os.start(t); os.stop(stop);
  }

  function noise(X,o){

    const s=c.createBufferSource(); s.buffer=o.brown?B.b:B.w; s.loop=true; if(o.rate) s.playbackRate.value=o.rate;
    let n=s; if(o.fl) n=filt(c,n,o.fl,t,d);
    const g=c.createGain(); env(g,t,o.a||0.002,d,o.v||0.2,o.hold); n.connect(g); g.connect(X.out);
    s.start(t,Math.random()*1.2); s.stop(t+d+0.05);
  }

    alert:X=>{ for(let i=0;i<2;i++) tone(X,{w:'square',at:i*0.13,f:540,d:0.08,v:0.03,fl:['lowpass',1500,0.7]}); return 0.24; },
    enrage:X=>{ tone(X,{w:'sawtooth',f:90,f2:140,d:0.4,v:0.05,fl:['lowpass',700,2]}); noise(X,{d:0.35,v:0.04,fl:['bandpass',500,1]}); return 0.42; },
    dive:X=>{ tone(X,{f:1650,f2:480,d:0.42,v:0.025}); return 0.44; },
    spawnIn:X=>{ tone(X,{f:1500,f2:500,d:0.2,v:0.03}); noise(X,{d:0.15,v:0.03,fl:['bandpass',3000,1,900]}); return 0.22; },
    retreat:X=>{ noise(X,{d:0.4,a:0.1,v:0.05,fl:['bandpass',600,1,2400]}); return 0.42; },
    jetLand:X=>{ noise(X,{d:0.8,a:0.05,v:0.12,fl:['lowpass',2500,0.7,400]}); tone(X,{w:'sawtooth',f:300,f2:90,d:0.8,v:0.04,fl:['lowpass',1200,0.7]}); thud(X,110,0.2,0.12,0.6); return 0.85; }
  };
  /* per-sound loudness trims, so the quiet-by-nature ones still carry */
  const TRIM={flap:4,rattle:3,ratchet:2.5,batSwing:2.5,swing:1.7,flyerWind:2,crumble:2,retreat:2.5,regrow:1.5,hogBristle:1.5,waveCard:1.5,laserCharge:1.8,shardTick:1.3,travelOpen:1.3};
  /* the least time between two plays of the same sound */
  const GAP={step:0.07,shardTick:0.12,beamHit:0.07,beamImmune:0.22,blip:0.055,uiMove:0.03,fuse:0.08,repairSpark:0.05,mobHurt:0.05,hit:0.04,
             bounce:0.03,eShot:0.04,dive:0.15,spawnIn:0.06,gloop:0.2,crumble:0.15,crumbleFall:0.08,crumbleBack:0.1,hogStomp:0.1,fizzle:0.1,melt:0.08,freeze:0.08,steam:0.12,reveal:0.08};

  /* ---------- loops: sounds that run as long as someone holds them each frame ---------- */
  function osc(c,w,f){ const o=c.createOscillator(); o.type=w; o.frequency.value=f; o.start(); return o; }
  function src(c,brown){ const s=c.createBufferSource(); s.buffer=brown?bufs(c).b:bufs(c).w; s.loop=true; s.start(0,Math.random()); return s; }
  function bq(c,type,f,q){ const b=c.createBiquadFilter(); b.type=type; b.frequency.value=f; b.Q.value=q||0.8; return b; }
  function gn(c,v){ const g=c.createGain(); g.gain.value=v; return g; }
  function lfo(c,rate,depth,param){ const l=osc(c,'sine',rate), g=gn(c,depth); l.connect(g); g.connect(param); return l; }
  const LOOPS={
    engine:(c,o)=>{ const f=bq(c,'lowpass',320,0.9), n=src(c,true), a=osc(c,'sawtooth',55), b=osc(c,'sawtooth',82.5), fo=bq(c,'lowpass',260,1.2);
      n.connect(f); f.connect(gn(c,0.9)).connect(o); a.connect(fo); b.connect(fo); fo.connect(gn(c,0.3)).connect(o);
      return {lvl:0.09,nodes:[n,a,b],set:(p,t)=>{ const s=p.s||0; a.frequency.setTargetAtTime(55+18*s,t,0.08); b.frequency.setTargetAtTime(82.5+27*s,t,0.08); f.frequency.setTargetAtTime(320+520*s,t,0.08); }}; },
    beam_normal:(c,o)=>{ const f=bq(c,'lowpass',1400,5), a=osc(c,'sawtooth',196), b=osc(c,'square',293.7), l=lfo(c,7,450,f.frequency);
      a.connect(f); b.connect(gn(c,0.5)).connect(f); f.connect(o); return {lvl:0.045,nodes:[a,b,l]}; },
    beam_ice:(c,o)=>{ const g=gn(c,0.5), a=osc(c,'sine',1046.5), b=osc(c,'sine',1568), l=lfo(c,11,0.35,g.gain), n=src(c), h=bq(c,'highpass',6500,0.7);
      a.connect(g); b.connect(gn(c,0.6)).connect(g); g.connect(o); n.connect(h); h.connect(gn(c,0.25)).connect(o); return {lvl:0.06,nodes:[a,b,l,n]}; },
    beam_fire:(c,o)=>{ const n=src(c), f=bq(c,'bandpass',800,0.7), l=lfo(c,19,300,f.frequency), a=osc(c,'sawtooth',98), fl=bq(c,'lowpass',500,1);
      n.connect(f); f.connect(gn(c,1.4)).connect(o); a.connect(fl); fl.connect(gn(c,0.5)).connect(o); return {lvl:0.08,nodes:[n,l,a]}; },
    rumble:(c,o)=>{ const n=src(c,true), f=bq(c,'lowpass',240,0.8), s=osc(c,'sine',48);
      n.connect(f); f.connect(o); s.connect(gn(c,0.35)).connect(o); return {lvl:0.16,nodes:[n,s]}; },
    sink:(c,o)=>{ const n=src(c,true), f=bq(c,'lowpass',380,1.5), g=gn(c,0.6), l=lfo(c,5,0.45,g.gain);
      n.connect(f); f.connect(g); g.connect(o); return {lvl:0.35,nodes:[n,l]}; },
    roll:(c,o)=>{ const n=src(c), f=bq(c,'bandpass',900,3), g=gn(c,0.5), l=lfo(c,16,0.45,g.gain);
      n.connect(f); f.connect(g); g.connect(o); return {lvl:0.2,nodes:[n,l]}; }
  };
  function makeLoop(name){
    const mk=LOOPS[name]; if(!mk) return null;
    const g=ac.createGain(); g.gain.value=0; g.connect(master);
    try{ const L=mk(ac,g); L.g=g; L.idle=0; return L; }catch(e){ console.error(e); g.disconnect(); return null; }
  }
  function killLoop(L){ for(const n of L.nodes||[]) try{ n.stop(); }catch(e){} try{ L.g.disconnect(); }catch(e){} }

  /* ---------- the outside ---------- */
  function init(){
    if(ac) return true; if(!AC) return false;
    try{ ac=new AC(); }catch(e){ ac=null; return false; }
    comp=ac.createDynamicsCompressor();
    comp.threshold.value=-16; comp.knee.value=14; comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.2;
    master=ac.createGain(); master.gain.value=vol*0.9;
    master.connect(comp); comp.connect(ac.destination);
    bufs(ac);
    return true;
  }
  function unlock(){ if(!init()) return; if(ac.state==='suspended'&&!document.hidden) ac.resume().catch(()=>{}); }
  for(const ev of ['pointerdown','keydown','touchstart']) addEventListener(ev,unlock,{capture:true,passive:true});
  document.addEventListener('visibilitychange',()=>{ if(!ac) return; if(document.hidden) ac.suspend().catch(()=>{}); else ac.resume().catch(()=>{}); });
  function screenX(p){
    if(p.sx!==undefined) return p.sx;
    if(p.x===undefined) return undefined;
    try{ return cam?p.x*cam.z+cam.ox:p.x; }catch(e){ return p.x; }
  }
  function play(name,p){
    p=p||{};
    if(!ac||vol<=0||ac.state!=='running') return false;
    const r=R[name]; if(!r) return false;
    const now=ac.currentTime, key=name+(p.id||''), gap=p.gap!==undefined?p.gap:(GAP[name]||0.025);
    if(now-(last[key]||-9)<gap) return false;
    if(voices>=MAXV) return false;
    last[key]=now;
    const out=ac.createGain(); out.gain.value=(p.v===undefined?1:p.v)*(TRIM[name]||1);
    let node=out; const sx=screenX(p);
    if(sx!==undefined&&ac.createStereoPanner){ const pn=ac.createStereoPanner(); pn.pan.value=Math.max(-0.65,Math.min(0.65,(sx/VIEW_W-0.5)*1.3)); out.connect(pn); node=pn; }
    node.connect(master);
    const X={c:ac,out,t:now+0.004,k:(p.k||1)*(p.rk?1+(Math.random()*2-1)*p.rk:1)};
    let len=0.3; try{ len=r(X,p)||0.3; }catch(e){ console.error(e); }
    voices++;
    setTimeout(()=>{ try{ out.disconnect(); if(node!==out) node.disconnect(); }catch(e){} voices--; },len*1000+300);
    if(SFX.log) SFX.log.push(name);
    return true;
  }
  function hold(name,p){ if(SFX.log&&!loops[name]&&!held[name]) SFX.log.push('~'+name); if(!ac||ac.state!=='running') return; held[name]=p||{}; }
  function endFrame(){
    if(!ac) { held={}; return; }
    const now=ac.currentTime;
    for(const n of Object.keys(forced)){ if(now<forced[n].until){ if(!held[n]) held[n]=forced[n].p; } else delete forced[n]; }
    for(const name of Object.keys(held)){
      let L=loops[name]; if(!L&&vol>0) L=loops[name]=makeLoop(name);
      if(!L) continue;
      const p=held[name]; if(L.set) L.set(p,now);
      L.g.gain.setTargetAtTime(L.lvl*(p.v===undefined?1:p.v),now,0.03); L.idle=0;
    }
    for(const name of Object.keys(loops)){
      if(held[name]) continue;
      const L=loops[name]; if(L.idle===0) L.g.gain.setTargetAtTime(0,now,0.06);
      if(++L.idle>40){ killLoop(L); delete loops[name]; }
    }
    held={};
  }
  /* plays a loop for a few seconds on its own (the editor's sound test) */
  function preview(name,sec,p){ unlock(); if(!ac||!LOOPS[name]) return false; forced[name]={until:ac.currentTime+(sec||1.5),p:p||{}}; return true; }
  function setVolume(v){ vol=Math.max(0,Math.min(1,v)); if(master) master.gain.setTargetAtTime(vol*0.9,ac.currentTime,0.02); }
  /* renders one sound into a buffer (used to check levels in tests) */
  function render(name,p,sr){
    const len=2, c=new OfflineAudioContext(2,Math.floor((sr||44100)*len),sr||44100);
    const out=c.createGain(); out.gain.value=TRIM[name]||1; out.connect(c.destination);
    const X={c,out,t:0.01,k:1}; const L=R[name](X,p||{});
    return c.startRendering().then(b=>({len:L,b}));
  }
  function renderLoop(name,p){
    const c=new OfflineAudioContext(2,44100,44100), g=c.createGain(); g.connect(c.destination);
    const L=LOOPS[name](c,g); g.gain.value=L.lvl*((p&&p.v)||1); if(L.set) L.set(p||{},0);
    return c.startRendering().then(b=>({b}));
  }
  return {play,hold,endFrame,setVolume,unlock,render,preview,renderLoop,names:Object.keys(R),loopNames:Object.keys(LOOPS),
          get volume(){ return vol; }, get ready(){ return !!ac&&ac.state==='running'; }, log:null, _ctx:()=>ac};
})();

/* ---------- exits: tiles of one exit char that touch form one exit ----------
   room.exits = { "x,y": {to:"R4", at:"x,y", open:"boss"|"enemies"|"always"} }
   keyed by the exit's top-left tile; `at` is a tile of the arrival exit in `to`. */
const EXIT_CH='<>Ag';
const exitChar=c=>c==='G'?'g':c;
/* the grid with hidden exits/gates filled in, so an exit behind a breakable wall is still one exit with a link */
function withHiddenExits(g,hid){
  let out=null;
  for(const k in hid){
    if(!EXIT_CH.includes(exitChar(hid[k]))) continue;
    const [x,y]=k.split(',').map(Number);
    if(!g[y]||g[y][x]===undefined||EXIT_CH.includes(exitChar(g[y][x]))) continue;
    if(!out) out=g.map(row=>typeof row==='string'?row.split(''):row.slice());
    out[y][x]=hid[k];
  }
  return out||g;
}
const exitGrid=r=>withHiddenExits(r.grid,r.under||{});
function wallOf(tiles,w,h){
  if(tiles.every(t=>t[0]===0)) return 'left';
  if(tiles.every(t=>t[0]===w-1)) return 'right';
  if(tiles.every(t=>t[1]===0)) return 'top';
  if(tiles.every(t=>t[1]===h-1)) return 'bottom';
  return 'inner';
}
function exitGroups(g){
  const seen={}, out=[];
  for(let y=0;y<g.length;y++) for(let x=0;x<g[y].length;x++){
    const c=exitChar(g[y][x]);
    if(!EXIT_CH.includes(c)||seen[x+','+y]) continue;
    const tiles=[], st=[[x,y]]; seen[x+','+y]=1;
    while(st.length){
      const [cx,cy]=st.pop(); tiles.push([cx,cy]);
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=cx+dx, ny=cy+dy, k=nx+','+ny;
        if(ny<0||ny>=g.length||nx<0||nx>=g[ny].length||seen[k]||exitChar(g[ny][nx])!==c) continue;
        seen[k]=1; st.push([nx,ny]);
      }
    }
    tiles.sort((a,b)=>a[1]-b[1]||a[0]-b[0]);
    out.push({ch:c,tiles,key:tiles[0][0]+','+tiles[0][1],wall:wallOf(tiles,g[0].length,g.length)});
  }
  return out;
}
function linkOf(r,grp){
  if(r.exits){ for(const t of grp.tiles){ const l=r.exits[t[0]+','+t[1]]; if(l) return l; } return null; }
  const l=r.links&&r.links[grp.ch];                      // pre-v08 rooms: one link per exit symbol
  return l?{to:l[0],spawn:l[1],open:grp.ch==='g'?'boss':undefined}:null;
}
/* where the player stands when arriving through the exit that contains tile `at` */
function arrivalSpot(at){
  const [ax,ay]=at.split(',').map(Number);
  const groups=exitGroups(withHiddenExits(grid,hidden));
  let grp=groups.find(g=>g.tiles.some(t=>t[0]===ax&&t[1]===ay));
  if(!grp){
    let bd=1e9;
    for(const g of groups) for(const t of g.tiles){ const d=Math.abs(t[0]-ax)+Math.abs(t[1]-ay); if(d<bd){ bd=d; grp=g; } }
    if(!grp||bd>4) return null;
  }
  const tiles=grp.tiles.slice().sort((a,b)=>b[1]-a[1]);  // lowest tile first
  const inX=grp.wall==='right'?-1:grp.wall==='left'?1:(tiles[0][0]<VW/2?1:-1);
  const dirs=grp.wall==='bottom'?[[0,-1],[inX,0],[-inX,0]]
            :grp.wall==='top'?[[0,1],[inX,0],[-inX,0]]
            :[[inX,0],[-inX,0],[0,-1],[0,1]];
  for(const [dx,dy] of dirs) for(const [tx,ty] of tiles){
    const nx=tx+dx, ny=ty+dy;
    if(ny<0||ny>=grid.length||nx<0||nx>=grid[ny].length) continue;
    const c=grid[ny][nx];
    if(blocksPlayer(c)||EXIT_CH.includes(exitChar(c))||c==='~'||c==='^') continue;
    const px=nx*TILE+(TILE-P.w)/2, py=ny*TILE+TILE-P.h;
    if(boxHits(px,py,P.w,P.h)) continue;
    return {x:px,y:py,up:dy<0,face:dx||P.face};
  }
  return null;
}

/* ---------- layer doors: a sphere with enough layers opens them ---------- */
/* touching layer-door tiles form one door; it needs the most layers any of its tiles asks for (room.lneed) */
function ldoorGroups(g,need){
  const seen={}, out=[];
  for(let y=0;y<g.length;y++) for(let x=0;x<g[y].length;x++){
    if(g[y][x]!=='J'||seen[x+','+y]) continue;
    const tiles=[], st=[[x,y]]; seen[x+','+y]=1;
    while(st.length){
      const [cx,cy]=st.pop(); tiles.push([cx,cy]);
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=cx+dx, ny=cy+dy, k=nx+','+ny;
        if(seen[k]||!g[ny]||g[ny][nx]!=='J') continue;
        seen[k]=1; st.push([nx,ny]);
      }
    }
    tiles.sort((a,b)=>a[1]-b[1]||a[0]-b[0]);
    const n=Math.max(1,...tiles.map(t=>(need||{})[t[0]+','+t[1]]|0));
    out.push({tiles,key:tiles[0][0]+','+tiles[0][1],need:n,mid:tiles[Math.floor((tiles.length-1)/2)],flash:0});
  }

const blocksSphere=ch=> ch==='#'||ch==='L'||ch==='D'||ch==='g'||ch==='B'||ch==='I'||ch==='O'||ch==='K'||ch==='E'||ch==='J';

const boxHits=(x,y,w,h)=>tileHits(x,y,w,h)||(planks.length>0&&!!miniHits(x,y,w,h));   // solid tiles and mini walls
function tileHits(x,y,w,h){
  const x1=x+w-1, y1=y+h-1;
  for(let px=x;;px=Math.min(px+8,x1)){
    for(let py=y;;py=Math.min(py+8,y1)){
      if(blocksPlayer(tileAt(px,py))) return true;
      if(py>=y1) break;
    }
    if(px>=x1) break;
  }
  return false;
}
/* lava and floor spikes only hurt inside part of their tile */
function hazardHit(x,y,w,h,chars){
  const tx0=Math.floor(x/TILE), tx1=Math.floor((x+w-1)/TILE);
  const ty0=Math.floor(y/TILE), ty1=Math.floor((y+h-1)/TILE);
  for(let ty=ty0;ty<=ty1;ty++) for(let tx=tx0;tx<=tx1;tx++){
    const ch=grid[ty]&&grid[ty][tx];
    if(!ch||!chars.includes(ch)) continue;
    let hx=tx*TILE, hy=ty*TILE, hw=TILE, hh=TILE;
    if(ch==='~'||ch==='V'){ hy+=10; hh-=10; }
    if(ch==='^'){ hx+=4; hw-=8; hy+=16; hh=16; }
    if(x<hx+hw&&x+w>hx&&y<hy+hh&&y+h>hy) return true;
  }
  return false;
}
function platformUnder(x,y,w,h){

    if(s.state!=='landed') continue;
    if(x<s.x+s.w&&x+w>s.x&&y+h>s.y&&y+h<s.y+s.h+14&&P.vy>=0) return s;

}

/* ---------- sword ---------- */
const toWorld=(x,y)=>[(x-cam.ox)/cam.z,(y-cam.oy)/cam.z];
const toScreen=(x,y)=>[x*cam.z+cam.ox,y*cam.z+cam.oy];
function aimVector(snap){
  const [wx,wy]=toWorld(M.x,M.y);
  let ax=wx-(P.x+P.w/2), ay=wy-(P.y+P.h/2);
  if(ax===0&&ay===0){ ax=P.face; ay=0; }
  const m=Math.hypot(ax,ay)||1; ax/=m; ay/=m;
  if(snap){
    const a=Math.round(Math.atan2(ay,ax)/(Math.PI/4))*(Math.PI/4);
    ax=Math.cos(a); ay=Math.sin(a);
  }
  return [ax,ay];
}
/* the sword is a thrust: straight out along one of the 8 directions (toward the cursor). It only touches what lies on
   that line — a lane SW.width to each side, SW.reach long — never the neighbouring directions */
function swing(){
  if(SW.cd>0) return;
  const [ax,ay]=aimVector(true);
  tutNote('swings');
  if(Math.abs(ax)>0.01) P.face=ax>0?1:-1;
  SW.ax=ax; SW.ay=ay; SW.t=SW.dur; SW.cd=SW.cool; SW.hits=new Set(); SW.tiles=new Set();
  slashFx.push({ax,ay,ext:0,t:0,live:true,elem:SW.elem,seed:Math.random()*6});
  SFX.play('swing',{e:SW.elem,x:P.x+P.w/2,rk:0.06});
}
/* how far the blade is out, 0..1: it shoots out, holds for a moment, then pulls back */
function thrustExt(){
  const k=Math.min(1,Math.max(0,1-SW.t/SW.dur));
  if(k<0.3){ const q=k/0.3; return 1-(1-q)*(1-q); }
  return k<0.62?1:Math.max(0,1-(k-0.62)/0.38);
}
const thrustLive=()=>SW.t>0&&1-SW.t/SW.dur<0.62;             // it only cuts on the way out and while held
const SW_UP=4;                                               // the thrust starts this far above his middle
/* does the segment (ax,ay)-(bx,by) pass through the box? */
function segBox(ax,ay,bx,by,x,y,w,h){
  let t0=0, t1=1; const dx=bx-ax, dy=by-ay;
  for(const [p,q] of [[-dx,ax-x],[dx,x+w-ax],[-dy,ay-y],[dy,y+h-ay]]){
    if(Math.abs(p)<1e-9){ if(q<0) return false; continue; }
    const r=q/p;
    if(p<0){ if(r>t1) return false; if(r>t0) t0=r; } else { if(r<t0) return false; if(r<t1) t1=r; }
  }
  return true;
}
/* shortest distance from that segment to the box (0 if it goes through it) */
function segBoxDist(ax,ay,bx,by,x,y,w,h){
  if(segBox(ax,ay,bx,by,x,y,w,h)) return 0;
  const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy||1e-9;
  const toBox=(px,py)=>Math.hypot(Math.max(x-px,0,px-x-w),Math.max(y-py,0,py-y-h));
  const toSeg=(px,py)=>{ const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2)); return Math.hypot(px-ax-dx*t,py-ay-dy*t); };
  return Math.min(toBox(ax,ay),toBox(bx,by),toSeg(x,y),toSeg(x+w,y),toSeg(x,y+h),toSeg(x+w,y+h));
}
function stepSword(dt){
  if(SW.cd>0) SW.cd-=dt;
  if(SW.t<=0) return;
  SW.t-=dt;
  const cx=P.x+P.w/2, cy=P.y+P.h/2-SW_UP, dx=SW.ax, dy=SW.ay, L=SW.reach*thrustExt(), hw=SW.width;   // from chest height, where the hand is
  const tipX=cx+dx*L, tipY=cy+dy*L;
  if(SW.elem!=='none'&&Math.random()<0.8){
    const r=L*(0.4+Math.random()*0.6), o=(Math.random()-0.5)*hw;
    parts.push({x:cx+dx*r-dy*o,y:cy+dy*r+dx*o,vx:(Math.random()-0.5)*40,vy:SW.elem==='fire'?-60:20,
                life:0.35,max:0.35,col:SW.elem==='fire'?(Math.random()<.5?'#f08a2a':'#f5c04a'):'#dff3ff',s:2+Math.random()*2,g:0});
  }
  if(!thrustLive()) return;
  const lane=(x,y,w,h,pad)=>segBoxDist(cx,cy,tipX,tipY,x,y,w,h)<=(pad===undefined?hw:pad);   // within SW.width of the blade's line
  for(const m of mobs){
    if(!m.alive||SW.hits.has(m)||!lane(m.x,m.y,m.w,m.h)) continue;
    SW.hits.add(m);                                  // one hit per thrust
    if(damageMob(m,SW.dmg,'sword',Math.sign(SW.ax)||P.face)==='blocked'){ P.vx=-(Math.sign(SW.ax)||P.face)*170; P.kb=0.12; }   // clang: knocked back
    else SFX.play('hit',{e:SW.elem,x:m.x+m.w/2});
  }
  for(let i=shards.length-1;i>=0;i--){               // parry incoming projectiles
    if(lane(shards[i].x-3,shards[i].y-3,6,6)){ SFX.play('parry',{x:shards[i].x}); shards.splice(i,1); }
  }
  if(SW.elem==='none') return;
  const rr=SW.reach+TILE;
  for(let ty=Math.floor((cy-rr)/TILE);ty<=Math.floor((cy+rr)/TILE);ty++)
  for(let tx=Math.floor((cx-rr)/TILE);tx<=Math.floor((cx+rr)/TILE);tx++){
    const ch=grid[ty]&&grid[ty][tx], k=tx+','+ty;
    if(!ch||SW.tiles.has(k)) continue;
    const to=SW.elem==='ice'?({'~':'O','W':'I'})[ch]:({'I':'W'})[ch];
    const immune=SW.elem==='ice'?ch==='V':ch==='K';
    if(!to&&!immune) continue;
    if(!lane(tx*TILE,ty*TILE,TILE,TILE,3)) continue;                              // only tiles the blade actually reaches
    if(to==='I'&&P.x<tx*TILE+TILE&&P.x+P.w>tx*TILE&&P.y<ty*TILE+TILE&&P.y+P.h>ty*TILE) continue;  // don't freeze yourself in
    SW.tiles.add(k);
    if(immune){ burst(tx*TILE+16,ty*TILE+8,SW.elem==='ice'?'#c9ced4':'#9fd8ff',8,70,0.5,-60); SFX.play('fizzle',{x:tx*TILE+16}); continue; }   // too hot / too cold: just fizzles
    elementHit(tx,ty,ch,to);
  }
}
/* fire/ice sword turning one tile into another */
function elementHit(tx,ty,from,to){
  if(to==='W') reveal(tx,ty,'W'); else grid[ty][tx]=to;   // melted ice shows whatever was frozen inside
  const x=tx*TILE+16, y=ty*TILE+16;
  SFX.play(to==='O'?'steam':to==='I'?'freeze':'melt',{x});
  if(to==='O'){ burst(x,y-8,'#c9ced4',14,90,0.9,-120); burst(x,y,'#9fd8ff',8,120,0.4,0); }
  if(to==='I'){ burst(x,y,'#dff3ff',12,110,0.5,0); }
  if(to==='W'){ burst(x,y-6,'#c9ced4',10,80,0.8,-110); burst(x,y,'#f08a2a',8,120,0.35,0); }
}
function cycleSword(){
  const own=['none'].concat(G.swords.fire?['fire']:[],G.swords.ice?['ice']:[]);
  if(own.length<2) return;

/* ---------- TPS ---------- */
function throwTPS(){
  if(tps&&tps.stuck&&!tps.frozen&&!warp){ endTPS('break',undefined,'cancel'); return; }      // throwing again pulls a stuck sticky sphere back
  if(!G.hasTPS||tps||recharge>0||warp) return;
  if(noTPS()){ if(clock-noTpsT>1.2){ noTpsT=clock; toast('Challenge room — your sphere doesn’t work here','#a58aff'); SFX.play('deny'); } return; }
  const [ax,ay]=aimVector(true);
  tutNote('throws'); PA.throwT=0.22; PA.throwA=[ax,ay]; if(Math.abs(ax)>0.01) P.face=ax>0?1:-1;
  tps={x:P.x+P.w/2,y:P.y+P.h/2,vx:ax*T.throwSpeed,vy:ay*T.throwSpeed,kind:G.sphereKind,
       r:7,layers:maxLayers(G.sphereKind),inSand:false,cap:null,scale:1,stuck:null,frozen:false,spin:0};
  SFX.play('throw',{kind:tps.kind,x:tps.x});

/* sphere colours: gold for the normal one, green for the sticky wheel, red for the bomb.
   `ring` is the stronger shade of the same colour that its layer rings are drawn in */
const SPH={normal:{c:'#f2c230',ring:'#c47a00',lite:'#fff0b8'},sticky:{c:'#6fcf5a',ring:'#22d94a',lite:'#bfe8a8'},bomb:{c:'#e0352f',ring:'#7a0c10',lite:'#ffb9b2'}};
const SPHERE_COL={normal:SPH.normal.c,sticky:SPH.sticky.c,bomb:SPH.bomb.c};
const sphCol=k=>(SPH[k]||SPH.normal).c;
/* the most layers each sphere type can reach in this game: its start plus every upgrade tile placed in any room */
let capCache=null;
function layerCap(kind){
  if(!capCache){
    const n={U:0,n:0,d:0,M:0};
    for(const r of Object.values(ROOMS)){
      for(const row of r.grid) for(const c of row) if(n[c]!==undefined) n[c]++;
      for(const c of Object.values(r.under||{})) if(n[c]!==undefined) n[c]++;
    }
    capCache={normal:(n.M?3:1)+n.U,sticky:1+n.n,bomb:1+n.d};
  }
  return Math.max(capCache[kind]||1,maxLayers(kind));
}
/* layers show as rings inside the sphere (it never grows): one more ring per layer, and at the maximum they fill it */
function drawLayerRings(x,y,R,layers,cap,col){
  if(layers<=1||R<1.5) return;
  const M=Math.max(cap,layers), slots=Math.min(M-1,6);
  const n=layers>=M?slots:Math.max(1,Math.min(slots-1,Math.round((layers-1)/(M-1)*slots)));
  const band=R/slots;
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=Math.max(0.8,band*0.62);
  for(let j=1;j<=n;j++){
    const rr=R-band*(j-0.5);
    ctx.beginPath();
    if(rr<band*0.6){ ctx.arc(x,y,band*0.56,0,7); ctx.fill(); } else { ctx.arc(x,y,rr,0,7); ctx.stroke(); }
  }
}
/* every sphere type has its own layers: the normal one grows with Matryoshka and layer +1 tiles,
   the sticky wheel and the bomb start at 1 and grow only with their own +1 tiles */
function maxLayers(kind){
  if(kind==='sticky') return 1+(G.stickyUps|0);
  if(kind==='bomb') return 1+(G.bombUps|0);
  return (G.hasMatry?3:1)+(G.layerUps|0);
}
function cancelTPS(){ if(tps&&!tps.frozen&&!warp) endTPS('break',undefined,'cancel'); }
/* the sphere broke by hitting something: a bomb out of layers goes off right there (if that's switched on) */
function breakTPS(col){
  if(tps&&tps.kind==='bomb'&&T.bombOnBreak){ detonate(); return; }
  endTPS('break',col);
}
/* col: particle colour on break; null = no puff */
function endTPS(kind,col,snd){
  if(!tps) return;
  if(kind==='break'&&col!==null) burst(tps.x,tps.y,col||sphCol(tps.kind),8,110,0.3,0);
  if(snd) SFX.play(snd,{x:tps.x});
  else if(kind==='break'&&col!==null) SFX.play(tps.kind==='sticky'?'splat':'shatter',{x:tps.x,kind:tps.kind});
  recharge = kind==='teleport' ? T.rechargeTeleport : T.rechargeBreak;

}
/* where the player lands. Centred on the sphere if there's room. Otherwise you need two empty tiles on top of each other,
   one of them the sphere's own tile (the other directly above or below it): you're fitted into that column, as close
   to the sphere as it allows. A sphere stuck to a surface can also push you out along that surface. */
function teleportDest(){
  const nx=tps.x-P.w/2, ny=tps.y-P.h/2;
  if(!boxHits(nx,ny,P.w,P.h)) return [nx,ny];
  const tx=Math.floor(tps.x/TILE), ty=Math.floor(tps.y/TILE), free=(x,y)=>!blocksPlayer(tileAt(x*TILE+TILE/2,y*TILE+TILE/2));
  let best=null, bd=Infinity;
  if(free(tx,ty)) for(const oy of [-1,1]){                    // the second empty tile: above, or below
    if(!free(tx,ty+oy)) continue;
    const top=Math.min(ty,ty+oy)*TILE, y=Math.max(top,Math.min(top+2*TILE-P.h,ny));
    for(const x of [nx,Math.max(tx*TILE,Math.min(tx*TILE+TILE-P.w,nx))]){     // where the sphere is, else inside its column
      if(boxHits(x,y,P.w,P.h)) continue;
      const d=Math.hypot(x-nx,y-ny); if(d<bd){ bd=d; best=[x,y]; }
      break;
    }
  }
  if(best) return best;
  if(tps.stuck) for(let d=2;d<=P.h;d+=2){ const x=nx+tps.stuck.nx*d, y=ny+tps.stuck.ny*d; if(!boxHits(x,y,P.w,P.h)) return [x,y]; }
  return null;
}
/* teleport takes a moment: you dissolve toward the sphere, then re-form where it was */
function teleport(){
  if(!tps||warp) return;
  if(tps.kind==='bomb'){ detonate(); return; }               // the bomb sphere blows up instead (even inside an absorber)
  if(tps.cap||tps.frozen) return;                             // no escaping an absorber
  if(tps.x<0||tps.x>VW*TILE||tps.y<0||tps.y>VH*TILE) return;
  const d=teleportDest();
  if(!d){ burst(tps.x,tps.y,'#6b7076',6,60,0.3,0); SFX.play('warpFail',{x:tps.x,gap:0.25}); return; }
  tps.frozen=true;
  warp={t:0,dur:Math.max(0.06,T.warpTime),x0:P.x,y0:P.y,x1:d[0],y1:d[1],moved:false,sx:tps.x,sy:tps.y};
  P.vx=0; P.vy=0; P.inv=Math.max(P.inv,warp.dur);
  SFX.play('warpOut',{x:P.x+P.w/2});

}
function detonate(){

  burst(x,y,'#fff1b8',16,320,0.35,0); burst(x,y,'#f5c04a',22,280,0.55,200); burst(x,y,'#f08a2a',18,200,0.7,300); burst(x,y,'#3a3f45',16,110,1.1,-50);
  for(let ty=Math.floor((y-R)/TILE);ty<=Math.floor((y+R)/TILE);ty++)
  for(let tx=Math.floor((x-R)/TILE);tx<=Math.floor((x+R)/TILE);tx++){
    const c=grid[ty]&&grid[ty][tx]; if(!c) continue;
    const qx=Math.max(tx*TILE,Math.min(x,tx*TILE+TILE)), qy=Math.max(ty*TILE,Math.min(y,ty*TILE+TILE));
    if(Math.hypot(qx-x,qy-y)>R) continue;
    if(c==='E'){ broke=true; G.broken[roomId+':'+tx+','+ty]=true; reveal(tx,ty,'.'); burst(tx*TILE+16,ty*TILE+16,'#48413a',12,180,0.9,700); burst(tx*TILE+16,ty*TILE+16,'#f08a2a',6,120,0.4,0); }

    if(!m.alive) continue;
    const cx=m.x+m.w/2, cy=m.y+m.h/2;
    if(Math.hypot(cx-x,cy-y)>=R+Math.max(m.w,m.h)/2) continue;
    if(m.t==='slugger'){ sluggerBlast(m); continue; }        // a bomb only ever knocks his guard down
    damageMob(m,3,'bomb',Math.sign(cx-x)||1);
  }
  if(broke) SFX.play('rubble',{x});
  endTPS('break',null);
}
function cycleSphere(){
  const own=['normal'].concat(G.spheres.sticky?['sticky']:[],G.spheres.bomb?['bomb']:[]);
  if(own.length<2) return;
  G.sphereKind=own[(own.indexOf(G.sphereKind)+1)%own.length];
  SFX.play('sphereSwap',{kind:G.sphereKind});
  toast('Sphere: '+G.sphereKind+' ×'+maxLayers(G.sphereKind),sphCol(G.sphereKind));
}
/* sticky sphere: glue it to whatever it hit */
function stickTo(x,y,nx,ny,plank){
  tps.x=x; tps.y=y; tps.vx=tps.vy=0; tps.stuck={nx,ny,plank:plank||null,sense:1,moving:false};
  SFX.play('stick',{x});
  burst(x-nx*tps.r,y-ny*tps.r,'#6fcf5a',8,90,0.35,0);
}
function stickToTile(nx,ny){
  const hx=blocksSphere(tileAt(nx,tps.y)), hy=blocksSphere(tileAt(tps.x,ny));
  const prefWall=hx&&!hy?true:hy&&!hx?false:Math.abs(tps.vx)>=Math.abs(tps.vy);
  for(const wall of [prefWall,!prefWall]){
    if(wall){
      const sg=Math.sign(tps.vx); if(!sg) continue;
      const c=Math.floor(nx/TILE), face=sg>0?c*TILE:(c+1)*TILE, x=face-sg*(tps.r+0.5);
      if(blocksSphere(tileAt(face+sg*2,tps.y))&&!blocksSphere(tileAt(x,tps.y))){ stickTo(x,tps.y,-sg,0); return true; }
    } else {
      const sg=Math.sign(tps.vy); if(!sg) continue;
      const c=Math.floor(ny/TILE), face=sg>0?c*TILE:(c+1)*TILE, y=face-sg*(tps.r+0.5);
      if(blocksSphere(tileAt(tps.x,face+sg*2))&&!blocksSphere(tileAt(tps.x,y))){ stickTo(tps.x,y,0,-sg); return true; }
    }

}
/* the sticky wheel rolls along whatever it's stuck to, in any direction: hold right mouse + WASD (or the arrow keys).
   At an inside corner it climbs onto the new surface; at an outside corner it wraps round the edge and keeps going. */
/* the sticky wheel out on a surface can get hurt: enemies (and their shots), spikes and falling spikes cost it a layer,
   lava burns it at once. A short blink after each hit so it can roll clear. Returns true if it broke. */
function stickyHazards(dt){
  if(tps.hurt>0) tps.hurt-=dt;
  const r=tps.r, x=tps.x, y=tps.y;
  if(hazardHit(x-r,y-r,2*r,2*r,'~V')){ burst(x,y,'#f08a2a',12,150,0.4,-80); SFX.play('burn',{x}); endTPS('break',null); return true; }
  const over=(bx,by,bw,bh)=>x+r>bx&&x-r<bx+bw&&y+r>by&&y-r<by+bh;
  let hit=null;
  if(hazardHit(x-r+1,y-r+1,2*r-2,2*r-2,'^')) hit='#c9ced4';
  for(const s of spikes){
    if((s.state==='hung'||s.state==='falling')&&over(s.x,s.y,s.w,s.h)){ if(s.state==='hung') s.state='falling'; hit='#9aa0a6'; }
  }
  for(let i=shards.length-1;i>=0;i--){ const s=shards[i]; if(s&&Math.hypot(s.x-x,s.y-y)<r+3){ shards.splice(i,1); hit='#e8e4dc'; } }
  for(const m of mobs){
    if(!m.alive||(m.t==='flyer'&&m.state==='stunned')||!over(m.x,m.y,m.w,m.h)) continue;
    if(m.t==='eater'){ m.fed=0.4; SFX.play('gulp',{x,low:1}); endTPS('break',null); return true; }          // the eater swallows it, as in flight
    hit='#d84a2f'; if(m.t==='guard') m.block=0.3;
  }
  if(boss&&boss.hp>0&&over(boss.x,boss.y,boss.w,boss.h)) hit='#d84a2f';
  if(!hit||tps.hurt>0) return false;
  tps.layers--; tps.hurt=0.6; SFX.play('stickyHurt',{x});
  burst(x,y,hit,8,140,0.3,0); burst(x,y,'#6fcf5a',6,90,0.35,100);
  if(tps.layers<=0){ endTPS('break'); return true; }
  return false;
}
function stepStuck(dt){
  const st=tps.stuck;
  if(!st.plank&&!blocksSphere(tileAt(tps.x-st.nx*(tps.r+2),tps.y-st.ny*(tps.r+2)))){ endTPS('break'); return; }  // its surface is gone
  if(stickyHazards(dt)) return;
  const steer=M.aiming;
  const ix=((keys.ArrowRight||(steer&&keys.KeyD))?1:0)-((keys.ArrowLeft||(steer&&keys.KeyA))?1:0);
  const iy=((keys.ArrowDown||(steer&&keys.KeyS))?1:0)-((keys.ArrowUp||(steer&&keys.KeyW))?1:0);
  if(!ix&&!iy){ st.moving=false; return; }
  const a=ix*(-st.ny)+iy*st.nx;                            // input along the surface
  if(Math.abs(a)>0.3) st.sense=Math.sign(a);
  else if(!st.moving) return;                               // pushing straight into the surface: nothing to roll along
  st.moving=true; SFX.hold('roll');
  if(st.plank){
    const p=st.plank, tx=-st.ny, ty=st.nx, step=T.stickySpeed*dt*st.sense;
    const ddx=p.x2-p.x1, ddy=p.y2-p.y1, len2=ddx*ddx+ddy*ddy, off=tps.r+p.th+0.5;
    const bx=tps.x-st.nx*off+tx*step, by=tps.y-st.ny*off+ty*step;
    const u=Math.max(0,Math.min(1,((bx-p.x1)*ddx+(by-p.y1)*ddy)/len2));
    const nx=p.x1+ddx*u+st.nx*off, ny=p.y1+ddy*u+st.ny*off;
    if(!blocksSphere(tileAt(nx,ny))){ tps.spin+=Math.hypot(nx-tps.x,ny-tps.y)/tps.r*st.sense; tps.x=nx; tps.y=ny; }
    return;
  }
  const r=tps.r;
  let dist=T.stickySpeed*dt, guard=0;
  while(dist>0.01&&guard++<24){
    const len=Math.min(2,dist); dist-=len;
    const mx=-st.ny*st.sense, my=st.nx*st.sense;          // travel direction
    const nx=tps.x+mx*len, ny=tps.y+my*len;
    if(tileAt(nx+mx*r,ny+my*r)==='J'&&tryLdoor(Math.floor((nx+mx*r)/TILE),Math.floor((ny+my*r)/TILE))) return;   // rolled into a layer door
    if(blocksSphere(tileAt(nx+mx*r,ny+my*r))){             // inside corner: climb onto what's ahead
      const ox=st.nx, oy=st.ny;
      if(mx>0) tps.x=Math.floor((nx+mx*r)/TILE)*TILE-r-0.5;
      if(mx<0) tps.x=(Math.floor((nx+mx*r)/TILE)+1)*TILE+r+0.5;
      if(my>0) tps.y=Math.floor((ny+my*r)/TILE)*TILE-r-0.5;
      if(my<0) tps.y=(Math.floor((ny+my*r)/TILE)+1)*TILE+r+0.5;
      st.nx=-mx; st.ny=-my;
      st.sense=Math.sign(-st.ny*ox+st.nx*oy)||1;             // keep rolling away from the old surface
      burst(tps.x+mx*r,tps.y+my*r,'#6fcf5a',3,50,0.25,0);
      continue;
    }
    if(!blocksSphere(tileAt(nx-st.nx*(r+2),ny-st.ny*(r+2)))){   // outside corner: wrap round the edge
      const b=[Math.floor((tps.x-st.nx*(r+2))/TILE),Math.floor((tps.y-st.ny*(r+2))/TILE)];   // the tile we're rolling on
      const cx=mx>0?(b[0]+1)*TILE:mx<0?b[0]*TILE:(st.nx>0?(b[0]+1)*TILE:b[0]*TILE);
      const cy=my>0?(b[1]+1)*TILE:my<0?b[1]*TILE:(st.ny>0?(b[1]+1)*TILE:b[1]*TILE);
      const px=cx+mx*(r+0.5)-st.nx*(r+0.5), py=cy+my*(r+0.5)-st.ny*(r+0.5);
      if(blocksSphere(tileAt(px,py))||!blocksSphere(tileAt(px-mx*(r+2),py-my*(r+2)))) break;   // no room to get round
      const ox=st.nx, oy=st.ny;
      tps.x=px; tps.y=py; st.nx=mx; st.ny=my;
      st.sense=Math.sign(-st.ny*(-ox)+st.nx*(-oy))||1;        // carry on down the new face
      tps.spin+=Math.PI/2*Math.sign(ox*my-oy*mx);
      continue;
    }
    tps.spin+=len/r*Math.sign(st.nx*my-st.ny*mx);
    tps.x=nx; tps.y=ny;
  }
}
function stepTPS(dt){
  if(recharge>0) recharge-=dt;
  if(!tps) return;
  if(tps.kind==='bomb'&&!tps.frozen){ const fb=Math.floor(clock*8); if(fb!==tps.fb){ tps.fb=fb; if(fb%2===0) SFX.play('fuse',{x:tps.x}); } }   // the fuse ticks
  if(tps.frozen) return;                     // held in place while you teleport to it
  if(tps.cap){ stepCapture(dt); return; }
  if(caps.length&&capTouch()) return;
  if(tps.onBat){                              // stuck to the Slugger's bat: it goes where the bat goes
    const m=tps.onBat; if(!m.alive){ tps.onBat=null; endTPS('break'); return; }
    const [bx,by]=batTip(m,0.88); tps.x=bx; tps.y=by; tps.spin+=dt*14; return;
  }
  if(tps.stuck){ stepStuck(dt); return; }
  if(tps.batCd>0) tps.batCd-=dt;
  tps.vy+=T.tpsGravity*dt;

  if(tps.kind==='sticky') tps.spin+=Math.hypot(tps.vx,tps.vy)*dt/tps.r*(tps.vx>=0?1:-1);
  const steps=4;
  for(let i=0;i<steps;i++){
    const nx=tps.x+tps.vx*dt/steps, ny=tps.y+tps.vy*dt/steps;
    const ch=tileAt(nx,ny);
    const ph=plankHit(nx,ny);
    if(ph){
      if(tps.kind==='sticky'){ const o=tps.r+ph.p.th+0.5; stickTo(ph.qx+ph.ex*o,ph.qy+ph.ey*o,ph.ex,ph.ey,ph.p); return; }
      tps.vx-=2*ph.vn*ph.ex; tps.vy-=2*ph.vn*ph.ey;
      burst(ph.qx,ph.qy,'#c9a36b',5,90,0.25,0);
      tps.layers--;
      if(tps.layers<=0){ breakTPS(); return; }
      SFX.play('bounce',{x:ph.qx,kind:tps.kind,wood:1,n:tps.layers,m:maxLayers(tps.kind)});
      continue;
    }

    if(ch==='~'||ch==='V'){                // lava burns it
      tps.x=nx; tps.y=ny;
      burst(nx,ny,'#f08a2a',12,150,0.4,-80);
      SFX.play('burn',{x:nx});
      breakTPS(null); return;
    }
    if(ch==='S'){
      if(!tps.inSand){
        tps.inSand=true;
        tps.layers--;
        if(tps.layers<=0){ breakTPS(); return; }
        SFX.play('sandPass',{x:nx,n:tps.layers,m:maxLayers(tps.kind)});
      }
      tps.x=nx; tps.y=ny; continue;
    }
    tps.inSand=false;

    if(blocksSphere(ch)){
      if(ch==='J'&&tryLdoor(Math.floor(nx/TILE),Math.floor(ny/TILE))) return;
      if(tps.kind==='sticky'&&stickToTile(nx,ny)) return;
      tps.layers--;
      if(tps.layers<=0){ breakTPS(); return; }
      SFX.play('bounce',{x:nx,kind:tps.kind,n:tps.layers,m:maxLayers(tps.kind)});
      const hx=blocksSphere(tileAt(nx,tps.y)), hy=blocksSphere(tileAt(tps.x,ny));
      if(hx) tps.vx*=-1;
      if(hy) tps.vy*=-1;
      if(!hx&&!hy){ tps.vx*=-1; tps.vy*=-1; }
      continue;
    }
    tps.x=nx; tps.y=ny;
  }

  if(tps.x<-20||tps.x>VW*TILE+20||tps.y<-20||tps.y>VH*TILE+20){ endTPS('break',null); return; }

  for(const s of spikes){
    if(s.state==='hung'&&tps.x>s.x-6&&tps.x<s.x+s.w+6&&tps.y>s.y-6&&tps.y<s.y+s.h+6){
      s.state='falling'; breakTPS(); return;
    }
  }
  for(const m of mobs){                    // absorber field grabs the sphere
    if(m.t!=='absorber'||!m.alive) continue;
    const dx=tps.x-m.cx, dy=tps.y-m.cy, d=Math.hypot(dx,dy);
    if(d<T.absorbRadius){
      const cross=dx*tps.vy-dy*tps.vx;
      tps.cap={m,t:0,dur:0.8,a:Math.atan2(dy,dx),d0:d,spin:cross>=0?1:-1}; SFX.play('absorb',{x:m.cx});
      return;
    }
  }
  for(const m of mobs) if(m.t==='slugger'&&m.alive&&sluggerSphere(m)) return;   // he gets his bat to it first
  if(tps.batted&&tps.x>P.x-4&&tps.x<P.x+P.w+4&&tps.y>P.y-4&&tps.y<P.y+P.h+4&&!warp){   // his return comes back to your hand
    burst(tps.x,tps.y,SPHERE_COL[tps.kind],8,90,0.3,0); SFX.play('cancel',{x:tps.x}); endTPS('break',null); recharge=0; return;
  }
  for(const m of mobs){                    // direct hits
    if(!m.alive||m.t==='absorber'||m.t==='slugger') continue;   // a dazed Slugger lets it fly straight past
    const r=tps.r;
    if(tps.x>m.x-r&&tps.x<m.x+m.w+r&&tps.y>m.y-r&&tps.y<m.y+m.h+r){
      if(m.t==='eater'){ m.fed=0.4; SFX.play('gulp',{x:tps.x,low:1}); endTPS('break',null); return; }   // the eater swallows it
      if(m.t==='guard'&&m.guard){ deflect(m); continue; }                  // bounces off his guard like a wall, no layer lost
      damageMob(m,T.tpsDamage,'tps',Math.sign(tps.vx)||1);
      burst(tps.x,tps.y,'#e8e4dc',8,170,0.25,0);
      breakTPS(); return;
    }
  }
}
/* the sphere glances off the guardian: reflected away from his body, pushed clear of it */
function deflect(m){
  const qx=Math.max(m.x,Math.min(tps.x,m.x+m.w)), qy=Math.max(m.y,Math.min(tps.y,m.y+m.h));
  let ex=tps.x-qx, ey=tps.y-qy, d=Math.hypot(ex,ey);
  if(d<1e-6){ const sp=Math.hypot(tps.vx,tps.vy)||1; ex=-tps.vx/sp; ey=-tps.vy/sp; d=1; }
  ex/=d; ey/=d;
  const vn=tps.vx*ex+tps.vy*ey;
  if(vn<0){ tps.vx-=2*vn*ex; tps.vy-=2*vn*ey; }
  if(d<tps.r+0.5||(tps.x>m.x&&tps.x<m.x+m.w&&tps.y>m.y&&tps.y<m.y+m.h)){ tps.x=qx+ex*(tps.r+1); tps.y=qy+ey*(tps.r+1); }
  m.block=0.3;
  burst(tps.x,tps.y,'#dff3ff',8,160,0.25,0);
  SFX.play('deflect',{x:tps.x});
}
/* sphere spirals into the absorber, shrinking, then vanishes */
function stepCapture(dt){
  const c=tps.cap, m=c.m;
  if(!m.alive){                            // killed mid-pull: sphere flies free
    const ta=c.a+c.spin*Math.PI/2;
    tps.vx=Math.cos(ta)*240; tps.vy=Math.sin(ta)*240;
    tps.cap=null; tps.scale=1;
    return;
  }
  c.t+=dt;
  const k=Math.min(1,c.t/c.dur), e=k*k;
  c.a+=c.spin*dt*(3+16*k);
  const d=c.d0*(1-e);
  tps.x=m.cx+Math.cos(c.a)*d; tps.y=m.cy+Math.sin(c.a)*d;
  tps.scale=1-0.85*e;
  m.pull=k;
  parts.push({x:tps.x,y:tps.y,vx:0,vy:0,life:0.3,max:0.3,
              col:sphCol(tps.kind),s:1+5*tps.scale,g:0});
  if(k>=1){
    m.gulp=0.45;
    burst(m.cx,m.cy,'#b89cff',14,120,0.45,0);
    SFX.play('gulp',{x:m.cx});
    endTPS('break',null);
  }
}

/* ---------- planks: a floor piece rotated in 22.5° steps around its tile centre ----------
   A mini wall is the same piece made solid: nothing passes through it from any side (you can't jump up through it),
   you can stand on it, and walk up it while it's no steeper than 45°. */
function makePlank(tx,ty,idx,solid){
  const a=idx*Math.PI/8, c=Math.cos(a), sn=Math.sin(a);
  const L=16/Math.max(Math.abs(c),Math.abs(sn));        // reaches the tile edges at any angle
  const cx=tx*TILE+16, cy=ty*TILE+16;
  const x1=cx-c*L, y1=cy-sn*L, x2=cx+c*L, y2=cy+sn*L;
  return {tx,ty,idx,a,c,s:sn,cx,cy,L,x1,y1,x2,y2,th:solid?4:3,solid:!!solid,
          minX:Math.min(x1,x2),maxX:Math.max(x1,x2),minY:Math.min(y1,y2),maxY:Math.max(y1,y2),
          walk:!solid&&Math.abs(sn)<0.75};                // planks: up to 45° you can stand on it; steeper acts as a wall
}
/* the mini wall this box touches, if any */
function miniHits(x,y,w,h){
  for(const p of planks){
    if(!p.solid||x>=p.maxX+p.th||x+w<=p.minX-p.th||y>=p.maxY+p.th||y+h<=p.minY-p.th) continue;
    if(segBoxDist(p.x1,p.y1,p.x2,p.y2,x,y,w,h)<p.th) return p;
  }
  return null;
}
const plankTop=(p,x)=>p.cy+(x-p.cx)*p.s/p.c-p.th/Math.abs(p.c);
/* landing on (or walking along) a walkable plank; one-way — you can jump up through it */
function plankGround(x,w,prevBottom,newBottom,vy,stick){
  if(vy<0) return null;
  let best=null;
  for(const p of planks){
    if(!p.walk||x>=p.maxX||x+w<=p.minX) continue;
    const fx=Math.max(p.minX,Math.min(p.maxX,x+w/2)), top=plankTop(p,fx);
    if(prevBottom<=top+(stick?14:6)&&newBottom>=top-(stick?14:0)&&(!best||top<best)) best=top;
  }
  return best;
}
function plankWalls(){
  for(const p of planks){
    if(p.walk||p.solid||P.y+P.h<=p.minY||P.y>=p.maxY) continue;
    const yc=Math.max(p.minY,Math.min(p.maxY,P.y+P.h/2));
    const xl=Math.abs(p.s)>0.999?p.cx:p.cx+(yc-p.cy)*p.c/p.s, half=p.th/Math.abs(p.s);
    if(P.x<xl+half&&P.x+P.w>xl-half){
      P.x= P.x+P.w/2<xl ? xl-half-P.w : xl+half;
      P.vx=0;
    }
  }
}
/* sphere vs planks: the plank it's touching and which way that plank faces */
function plankHit(nx,ny){
  for(const p of planks){
    const dx=p.x2-p.x1, dy=p.y2-p.y1;
    let t=((nx-p.x1)*dx+(ny-p.y1)*dy)/(dx*dx+dy*dy); t=Math.max(0,Math.min(1,t));
    const qx=p.x1+dx*t, qy=p.y1+dy*t;
    let ex=nx-qx, ey=ny-qy, d=Math.hypot(ex,ey);
    if(d>=tps.r+p.th) continue;
    if(d<1e-6){ ex=-p.s; ey=p.c; if(ex*tps.vx+ey*tps.vy>0){ ex=-ex; ey=-ey; } d=1; }
    ex/=d; ey/=d;
    const vn=tps.vx*ex+tps.vy*ey;
    if(vn>=0) continue;
    return {p,ex,ey,qx,qy,vn};
  }
  return null;
}

/* ---------- breakable floor ---------- */
function stepCrumble(dt){
  for(const k of Object.keys(crumble)){
    const c=crumble[k];
    if(c.state==='shake'){
      c.t-=dt;
      if(c.t<=0){
        SFX.play('crumbleFall',{x:c.x*TILE+16});
        if(hidden[k]){ reveal(c.x,c.y,'.'); delete crumble[k]; burst(c.x*TILE+16,c.y*TILE+10,'#8a7a64',14,110,0.8,600); continue; }
        grid[c.y][c.x]='_'; c.state='gone'; c.rt=T.crumbleRespawn;
        burst(c.x*TILE+16,c.y*TILE+10,'#8a7a64',14,110,0.8,600);
        burst(c.x*TILE+16,c.y*TILE+16,'#6a5a48',8,70,0.6,500);
      }
    } else if(c.state==='gone'){
      if(T.crumbleRespawn<=0) continue;                    // 0 = gone for good (until the room reloads)
      c.rt-=dt;
      const bx=c.x*TILE, by=c.y*TILE;
      if(c.rt<=0&&!(P.x<bx+TILE&&P.x+P.w>bx&&P.y<by+TILE&&P.y+P.h>by)){ grid[c.y][c.x]='B'; c.state='back'; c.t=0.3; SFX.play('crumbleBack',{x:bx+16,v:0.7}); }
    } else if(c.state==='back'){ c.t-=dt; if(c.t<=0) delete crumble[k]; }
  }
}

/* ---------- player ---------- */
function stepPlayer(dt){
  if(warp){
    warp.t+=dt; P.vx=0; P.vy=0;
    if(!warp.moved){
      const cx=P.x+P.w/2, cy=P.y+P.h/2;
      for(let i=0;i<3;i++){                                    // you stream toward the sphere
        const a=0.6+Math.random()*0.8;
        parts.push({x:P.x+Math.random()*P.w,y:P.y+Math.random()*P.h,vx:(warp.sx-cx)*a*4,vy:(warp.sy-cy)*a*4,
                    life:0.22,max:0.22,col:i%2?'#9fd8ff':'#e8e4dc',s:2+Math.random()*1.5,g:0});
      }
      if(warp.t>=warp.dur/2){
        P.x=warp.x1; P.y=warp.y1; warp.moved=true; P.sink=0; P.ground=false;
        burst(P.x+P.w/2,P.y+P.h/2,'#9fd8ff',18,170,0.45,0);
        burst(P.x+P.w/2,P.y+P.h/2,'#ffffff',8,90,0.3,0);
        SFX.play('warpIn',{x:P.x+P.w/2});
        endTPS('teleport');
      }
    }
    if(warp.t>=warp.dur) warp=null;
    if(P.inv>0) P.inv-=dt;
    return;
  }
  const steering=!!(tps&&tps.stuck&&M.aiming);                 // hands on the sphere: the player holds still
  const acc = steering?0:(keys.KeyD?1:(keys.KeyA?-1:0));
  if(acc) P.face=acc;
  const cx0=P.x+P.w/2;
  const inSand = tileAt(cx0,P.y+P.h-2)==='Q' && !platformUnder(P.x,P.y,P.w,P.h);
  const wet = tileAt(cx0,P.y+P.h*0.6)==='W', headWet = tileAt(cx0,P.y+6)==='W';
  if(wet&&!P.wet&&P.vy>200){ burst(cx0,P.y+P.h*0.6,'#9fd8ff',12,140,0.5,500); SFX.play('splash',{x:cx0}); }   // splash
  P.wet=wet;
  const feet=[P.x+1,cx0,P.x+P.w-1].map(x=>tileAt(x,P.y+P.h+1));
  const onIce = P.ground && !P.onPlank && feet.some(c=>c==='I'||c==='K') && !feet.some(c=>c!=='I'&&c!=='K'&&blocksPlayer(c));
  P.onIce=onIce; P.inSand=inSand;                          // remembered for his pose
  let spd = inSand? T.runSpeed*0.45 : T.runSpeed;
  if(wet) spd*=0.7;
  if(onIce) spd*=1.15;
  const grip = onIce? 2.4 : wet? 8 : (P.ground?22:18);
  if(P.kb>0) P.kb-=dt;                                   // knocked back: no steering
  else P.vx += (acc*spd-P.vx)*Math.min(1,dt*grip);
  if(acc) tutNote('moved',Math.abs(P.vx*dt));

  P.coyote = P.ground? 0.1 : Math.max(0,P.coyote-dt);
  P.buffer = Math.max(0,P.buffer-dt);
  if(wet){                                               // swim: every press is a stroke; at the surface you can jump out
    if(P.buffer>0){ P.vy = headWet? -T.jumpVel*0.42 : -T.jumpVel*0.85; P.buffer=0; P.ground=false; SFX.play('swim',{x:cx0}); }
  } else if(P.buffer>0 && P.coyote>0 && !inSand){ P.vy=-T.jumpVel; P.buffer=0; P.coyote=0; P.ground=false; tutNote('jumps'); SFX.play('jump',{x:cx0}); }
  if(P.vy<0 && !keys.Space && P.kb<=0 && !wet) P.vy += T.gravity*1.6*dt;

  P.vy += T.gravity*(wet?0.28:1)*dt;
  const maxFall=wet?110:900;
  if(P.vy>maxFall) P.vy=wet?Math.max(maxFall,P.vy-2400*dt):maxFall;

  let nx=P.x+P.vx*dt, up=0;
  if(boxHits(nx,P.y,P.w,P.h)){
    const mw=P.ground&&!tileHits(nx,P.y,P.w,P.h)&&miniHits(nx,P.y,P.w,P.h);
    if(mw&&Math.abs(mw.s)<0.75)                            // a mini wall tilted 45° or less: walk up it
      for(let k=1;k<=8;k++) if(!boxHits(nx,P.y-k,P.w,P.h)){ up=k; break; }
    if(up){ P.x=nx; P.y-=up; }
    else {
      while(!boxHits(P.x+Math.sign(P.vx),P.y,P.w,P.h) && Math.abs(P.x-nx)>0.5) P.x+=Math.sign(P.vx);
      P.vx=0;
    }
  } else P.x=nx;
  plankWalls();

  const wasGround=P.ground, wasPlank=P.onPlank;
  P.ground=false; P.onPlank=false;
  const prevBottom=P.y+P.h, vyPre=P.vy;
  let ny=P.y+P.vy*dt;
  if(boxHits(P.x,ny,P.w,P.h)){
    while(!boxHits(P.x,P.y+Math.sign(P.vy),P.w,P.h) && Math.abs(P.y-ny)>0.5) P.y+=Math.sign(P.vy);
    if(P.vy>0) P.ground=true;
    P.vy=0;
  } else {
    const plat=platformUnder(P.x,ny,P.w,P.h);
    const ptop=plankGround(P.x,P.w,prevBottom,ny+P.h,P.vy,wasGround&&wasPlank);
    if(ptop!==null&&(!plat||ptop<plat.y)&&!boxHits(P.x,ptop-P.h,P.w,P.h)){ P.y=ptop-P.h; P.vy=0; P.ground=true; P.onPlank=true; }
    else if(plat){ P.y=plat.y-P.h; P.vy=0; P.ground=true; }
    else P.y=ny;
  }
  if(wasGround&&!P.ground&&P.vy>=0&&P.vy<260&&planks.length)      // walking down a mini-wall slope: stay on it
    for(let k=1;k<=7;k++) if(miniHits(P.x,P.y+k,P.w,P.h)){ P.y+=k-1; P.vy=0; P.ground=true; break; }   // (snaps the last few pixels)

  // footsteps and landings: what you hear depends on what's under your feet
  if(P.ground){
    const surf=P.onPlank||(planks.length&&miniHits(P.x,P.y+3,P.w,P.h))?'wood':inSand?'sand':feet.some(c=>c==='I'||c==='K')?'ice':feet.includes('B')?'gravel':'stone';
    if(!wasGround&&vyPre>260){ SFX.play('land',{h:Math.min(1,(vyPre-260)/600),s:surf,x:cx0}); P.stepD=0; }
    else if(!wet&&Math.abs(P.vx)>40){ P.stepD=(P.stepD||0)+Math.abs(P.vx)*dt; if(P.stepD>(inSand?46:38)){ P.stepD=0; SFX.play('step',{s:surf,x:cx0,rk:0.08}); } }
  }
  // standing on breakable floor starts it crumbling
  if(P.ground&&!P.onPlank){
    for(const x of [P.x+1,P.x+P.w/2,P.x+P.w-1]){
      const tx=Math.floor(x/TILE), ty=Math.floor((P.y+P.h+1)/TILE), k=tx+','+ty;
      if(grid[ty]&&grid[ty][tx]==='B'&&!crumble[k]){ crumble[k]={x:tx,y:ty,state:'shake',t:T.crumbleTime}; SFX.play('crumble',{x:tx*TILE+16}); }
    }
  }

  // hazards
  if(hazardHit(P.x,P.y,P.w,P.h,'~V')){ SFX.play('sizzle',{x:P.x+P.w/2}); hurt(true); return; }
  if(P.inv<=0&&hazardHit(P.x,P.y,P.w,P.h,'^')){ hurt(false,P.vx*0.3,-460); }

  if(inSand){ P.sink+=dt; P.vy=Math.min(P.vy,70); SFX.hold('sink',{v:0.25+0.75*Math.min(1,P.sink/2.6)}); if(Math.random()<dt*2.5) SFX.play('gloop',{x:P.x+P.w/2}); if(P.sink>2.6){ hurt(true); return; } }
  else P.sink=Math.max(0,P.sink-dt*2);

  if(P.inv>0) P.inv-=dt;
  if(P.y>VH*TILE+80){ hurt(true); return; }

  const cx=P.x+P.w/2, cy=P.y+P.h/2;
  if(exitCd>0) exitCd-=dt;
  const ex=exitAt[Math.floor(cx/TILE)+','+Math.floor(cy/TILE)];
  if(ex&&exitCd<=0&&tileAt(cx,cy)!=='g'&&EXIT_CH.includes(exitChar(tileAt(cx,cy)))&&travel(ex.link)) return;
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];
    if(Math.abs(p.x+8-cx)<24&&Math.abs(p.y+8-cy)<28){
      if(p.k==='heart'&&P.hp>=G.maxHp) continue;          // full health: leave it for later
      SFX.play('pickup',{kind:p.k==='reward'?'layer':p.k,x:p.x+8,id:p.k});
      if(p.k==='tps') G.hasTPS=true;
      if(p.k==='matry'){ G.hasMatry=true; toast('Matryoshka — the sphere now bounces off walls instead of breaking',SPH.normal.c); }
      if(p.k==='reward') G.gotReward=true;
      if(p.k==='jetpart'){ G.jetParts=(G.jetParts|0)+1; G.taken[p.tk]=true; const nd=jetNeed(), hv=jetHave(); toast('Jet part '+hv+' / '+nd+(hv>=nd?' — head back to your jet':''),'#e0c04a'); }
      if(p.k==='hpup'){ G.maxHp++; P.hp=G.maxHp; G.taken[p.tk]=true; toast('Max health +1','#e05a6a'); }
      if(p.k==='heart'){ P.hp=Math.min(G.maxHp,P.hp+1); }
      if(p.k==='layer'){ G.layerUps++; G.taken[p.tk]=true; toast('Sphere +1 layer ('+maxLayers('normal')+')',SPH.normal.c); }
      if(p.k==='slayer'){ G.stickyUps++; G.taken[p.tk]=true; toast('Sticky wheel +1 layer ('+maxLayers('sticky')+')'+(G.spheres.sticky?'':' — for when you find it'),'#6fcf5a'); }
      if(p.k==='blayer'){ G.bombUps++; G.taken[p.tk]=true; toast('Bomb sphere +1 layer ('+maxLayers('bomb')+')'+(G.spheres.bomb?'':' — for when you find it'),SPH.bomb.c); }
      if(p.k==='sticky'||p.k==='bomb'){
        G.spheres[p.k]=true; G.sphereKind=p.k;
        toast(p.k==='sticky'?'Sticky wheel! It sticks and rolls round corners — hold right mouse + WASD. E switches spheres'
                            :'Bomb sphere! Press teleport to blow it up. E switches spheres',sphCol(p.k));
      }
      if(p.k==='fire'||p.k==='ice'){
        G.swords[p.k]=true; SW.elem=p.k;
        toast((p.k==='fire'?'Fire':'Ice')+' sword! Press Q to switch',p.k==='fire'?'#f08a2a':'#9fd8ff');
      }
      if(p.k!=='key') burst(p.x+8,p.y+8,({hpup:'#e05a6a',heart:'#e05a6a',layer:SPH.normal.c,slayer:'#6fcf5a',blayer:SPH.bomb.c,fire:'#f08a2a',ice:'#9fd8ff',sticky:'#6fcf5a',bomb:SPH.bomb.c,tps:SPH.normal.c,matry:SPH.normal.ring,jetpart:'#e0c04a'})[p.k]||'#e8e4dc',12,120,0.4,0);
      if(p.k==='key'){
        if(p.owner===roomId) openDoor(p.id,p.x+8,p.y+8);
        else {                                            // this key opens a door in another room
          G.opened[p.owner+':'+p.id]=true; SFX.play('doorFar');
          burst(p.x+8,p.y+8,doorCol(p.id),16,140,0.5,0);
          toast('A door opened in '+String((ROOMS[p.owner]&&ROOMS[p.owner].name)||p.owner).replace(/<[^>]+>/g,''),doorCol(p.id));
        }
      }
      pickups.splice(i,1);
      progText();
    }
  }
}
function hurt(fatal,kx,ky){
  if(dying>0) return;
  if(P.inv>0&&!fatal) return;
  P.hp-=1; P.inv=1.1;
  if(kx!==undefined){ P.vx=kx; P.vy=ky; P.kb=0.22; P.ground=false; }
  if(P.hp<=0||fatal) die(); else SFX.play('hurt',{x:P.x+P.w/2});
}
/* death only starts a short pop here; the room restarts at the top of a later frame, so no enemy/shot loop
   ever sees the room swapped out from under it (that used to freeze the game) */
function die(){
  dying=DIE_T; P.hp=0; P.vx=P.vy=0; SFX.play('die',{x:P.x+P.w/2});
  const cx=P.x+P.w/2, cy=P.y+P.h/2;
  burst(cx,cy,'#e8e4dc',22,240,0.6,300); burst(cx,cy,'#e05a6a',14,180,0.5,200);
  shake=Math.max(shake,0.25);
}
const DIE_T=0.6;
function stepDying(dt){
  dying-=dt; stepParts(dt);
  if(dying<=0){ dying=0; P.hp=G.maxHp; load(roomId,'restart'); }
}

/* ---------- doors ---------- */
function openDoor(id,kx,ky){
  const d=(room.doors||[]).find(d=>d.id===id); if(!d) return;
  G.opened[roomId+':'+id]=true;
  const col=doorCol(id);
  let sx=0, sy=0;
  for(const [tx,ty] of d.tiles){
    if(grid[ty]&&grid[ty][tx]==='D') reveal(tx,ty,'.',true);
    else if(hidden[tx+','+ty]==='D') delete hidden[tx+','+ty];   // opened while still hidden: nothing there later
    delete doorAt[tx+','+ty]; delete keyholeAt[tx+','+ty];
    sx+=tx; sy+=ty;
    burst(tx*TILE+16,ty*TILE+16,col,6,90,0.5,200);
  }
  const n=d.tiles.length||1;
  SFX.play('doorOpen',{x:sx/n*TILE+16});
  doorFx.push({tiles:d.tiles.map(t=>t.slice()),col,t:0});
  linkFx.push({x1:kx,y1:ky,x2:sx/n*TILE+16,y2:sy/n*TILE+16,col,t:0});
  burst(kx,ky,col,12,120,0.4,0);
}

/* ---------- spikes / mobs / boss ---------- */
function stepSpikes(dt){
  for(const s of spikes){
    if(s.state!=='falling') continue;
    if(!s.snd){ s.snd=1; SFX.play('spikeCrack',{x:s.x+s.w/2}); }
    s.vy+=T.gravity*dt; s.y+=s.vy*dt;
    if(boss&&boss.hp>0&&s.x<boss.x+boss.w&&s.x+s.w>boss.x&&s.y+s.h>boss.y&&s.y<boss.y+boss.h){
      boss.hp--; boss.flash=0.4; boss.state='stun'; boss.t=1.1; s.state='gone'; boss.shake=0.35;
      SFX.play(boss.hp<=0?'hogDie':'hogHit',{x:boss.x+boss.w/2});
      burst(boss.x+boss.w/2,boss.y+6,'#d8c3a0',10,160,0.5,500);
      if(boss.hp<=0){
        G.bossDead[roomId]=true; boss.dieT=1.6;
        burst(boss.x+boss.w/2,boss.y+boss.h/2,'#4a3526',26,260,0.9,700);
        burst(boss.x+boss.w/2,boss.y+boss.h/2,'#d8c3a0',14,200,0.8,600);
        toast('The Hedgehog is down','#e0c04a');
      }
      continue;
    }
    for(const m of mobs){                   // a falling spike crushes any enemy it lands on
      if(m.alive&&s.x<m.x+m.w&&s.x+s.w>m.x&&s.y+s.h>m.y&&s.y<m.y+m.h&&damageMob(m,99,'spike',0)==='blocked'){
        s.state='gone'; burst(s.x+s.w/2,s.y+s.h,'#9aa0a6',10,140,0.5,500); SFX.play('spikeBreak',{x:s.x+s.w/2});   // shatters on his guard
      }
    }
    const below=tileAt(s.x+s.w/2,s.y+s.h+1);
    if(below==='V'&&s.y+s.h>Math.floor((s.y+s.h)/TILE)*TILE+8){ s.state='gone'; burst(s.x+s.w/2,s.y+s.h,'#c9ced4',14,90,0.8,-120); SFX.play('fizzle',{x:s.x+s.w/2}); continue; }
    if(blocksPlayer(below)||below==='Q'||below==='~'){
      s.state='landed'; s.vy=0; s.y=Math.floor((s.y+s.h)/TILE)*TILE-s.h+10; SFX.play(below==='Q'?'land':'spikeLand',{x:s.x+s.w/2,s:'sand',h:0.6});
    }
    if(s.y>VH*TILE) s.state='gone';
  }
}
const touches=m=>P.x<m.x+m.w&&P.x+P.w>m.x&&P.y<m.y+m.h&&P.y+P.h>m.y;
/* guardian: plods toward you behind his shield; walking into him gets you shield-bashed */
function stepGuard(m,dt){
  const SPEED=m.guard?34:62, pcx=P.x+P.w/2, mcx=m.x+m.w/2, dx=pcx-mcx;
  if(m.block>0) m.block-=dt;
  m.st-=dt;
  if(m.state==='stagger'){ m.vx*=Math.pow(0.02,dt); if(m.st<=0) m.state='walk'; }
  else {
    const level=Math.abs((P.y+P.h)-(m.y+m.h))<48;
    if(level&&Math.abs(dx)<280&&Math.abs(dx)>6) m.face=dx>0?1:-1;
    m.vx=m.face*SPEED;
    const ahead=m.face>0?m.x+m.w+2:m.x-2;
    const wall=blocksPlayer(tileAt(ahead,m.y+m.h-6))||blocksPlayer(tileAt(ahead,m.y+6))||miniHits(ahead-1,m.y,2,m.h-2);
    const floor=tileAt(ahead,m.y+m.h+4), feet=tileAt(ahead,m.y+m.h-4);
    const ledge=m.onGround&&!(blocksPlayer(floor)||floor==='Q'||miniHits(ahead-1,m.y+m.h,2,8));
    const hazard=feet==='~'||feet==='V'||feet==='^'||floor==='~'||floor==='V';
    if(wall||ledge||hazard){ m.face*=-1; m.vx=0; }
  }
  m.vy=Math.min(900,m.vy+T.gravity*dt);
  const nx=m.x+m.vx*dt;
  if(!boxHits(nx,m.y,m.w,m.h)) m.x=nx; else m.vx=0;
  const ny=m.y+m.vy*dt;
  m.onGround=false;
  if(m.vy>0&&feetSolid(m.x,ny+m.h,m.w)){ m.y=Math.floor((ny+m.h)/TILE)*TILE-m.h; m.vy=0; m.onGround=true; }
  else if(m.vy>0&&miniLand(m,ny)) m.onGround=true;
  else if(m.vy<0&&boxHits(m.x,ny,m.w,m.h)) m.vy=0;
  else m.y=ny;
  if(P.inv<=0&&touches(m)){ SFX.play('bash',{x:m.x+m.w/2}); hurt(false,(Math.sign(dx)||m.face)*380,-260); m.block=0.3; }
  if(hazardHit(m.x,m.y,m.w,m.h,'~V')) killMob(m);
  if(m.y>VH*TILE+40) m.alive=false;
}

/* ---------- the Slugger: a big brawler with a bat ----------
   He bats your sphere straight back at you, catches the sticky wheel on his bat and shakes it off, and swings at you if you
   get close. A bomb blast knocks his guard down for a few seconds (it never hurts him, and does nothing while he's already
   dazed); only then does your sword land. Keep your distance and he serves balls at you — the sword knocks them away. */
const SLG={speed:52,rage:72,reach:60,wind:0.5,windRage:0.34,swing:0.16,recover:0.55,stun:3.4,shake:1.25,serve:3.4,hp:8,batLen:58};
const SLG_REST=-2.25, SLG_BACK=-2.85, SLG_END=0.85;   // bat angles, facing forward = 0: resting over the shoulder, cocked back, follow-through
function slgSet(m,state,d){ m.state=state; m.st=d; m.dur=d; }
const slgDazed=m=>m.state==='stunned'||m.state==='getup'||m.state==='down';
function batPivot(m){ return [m.x+m.w/2+m.face*14, m.y+34]; }
function batTip(m,along){ const [px,py]=batPivot(m), a=m.batA, L=SLG.batLen*(along||1); return [px+m.face*Math.cos(a)*L, py+Math.sin(a)*L]; }
/* the sphere came near him: returns true if he dealt with it */
function sluggerSphere(m){
  if(!tps||tps.stuck||tps.cap||tps.frozen||tps.onBat||slgDazed(m)||tps.batCd>0) return false;
  const [px,py]=batPivot(m), dx=tps.x-px, dy=tps.y-py;
  const body=tps.x>m.x-tps.r&&tps.x<m.x+m.w+tps.r&&tps.y>m.y-tps.r&&tps.y<m.y+m.h+tps.r;
  if(Math.hypot(dx,dy)>SLG.batLen+14&&!body) return false;
  m.face=tps.x>=m.x+m.w/2?1:-1;
  const a0=m.batA, aim=Math.atan2(tps.y-py,Math.abs(tps.x-px));
  slgSet(m,'bat',0.26); m.batFrom=a0<-1?a0:SLG_BACK; m.batTo=Math.max(-1.2,Math.min(1.2,aim))+0.35; m.swingHit=true;
  SFX.play('batSwing',{x:m.x+m.w/2});
  const hx=tps.x, hy=tps.y;
  if(tps.kind==='bomb'){ m.batA=m.batTo; detonate(); return true; }            // the bat sets it off in his face
  if(tps.kind==='sticky'){                                                      // it sticks to the bat; he shakes it off
    tps.onBat=m; tps.vx=tps.vy=0; slgSet(m,'shake',SLG.shake); m.batA=-1.3; SFX.play('stick',{x:hx}); SFX.play('rattle',{x:hx});
    burst(hx,hy,'#6fcf5a',10,120,0.35,0);
    return true;
  }
  const tx=P.x+P.w/2-hx, ty=P.y+P.h/2-hy, d=Math.hypot(tx,ty)||1, sp=Math.max(620,Math.min(900,Math.hypot(tps.vx,tps.vy)*1.3));
  tps.vx=tx/d*sp; tps.vy=ty/d*sp-30; tps.batted=true; tps.batCd=0.4;            // straight back at you
  burst(hx,hy,'#fff1b8',12,240,0.25,0); burst(hx,hy,'#b07a44',6,140,0.3,300); shake=Math.max(shake,0.12);
  m.crack={x:hx,y:hy,t:0}; SFX.play('batHit',{x:hx});
  return true;
}
function sluggerBlast(m){
  if(m.state==='down') return;
  if(slgDazed(m)){ if(clock-(m.saidDazed||-9)>1.5){ m.saidDazed=clock; toast('He’s already dazed — a bomb does nothing to him now','#9aa0a6'); } return; }
  if(tps&&tps.onBat===m) tps.onBat=null;
  slgSet(m,'stunned',SLG.stun); m.vx=0; m.flash=0.3; m.served=true; SFX.play('slugDaze',{x:m.x+m.w/2});
  const cx=m.x+m.w/2, cy=m.y+m.h/2;

function stepSlugger(m,dt){
  const pcx=P.x+P.w/2, mcx=m.x+m.w/2, dx=pcx-mcx, adx=Math.abs(dx), rage=m.hp<=m.maxhp/2;
  const level=P.y+P.h>m.y-12&&P.y<m.y+m.h+12;
  if(m.block>0) m.block-=dt;
  if(m.crack){ m.crack.t+=dt; if(m.crack.t>0.25) m.crack=null; }
  m.st-=dt;
  const k=m.dur>0?Math.min(1,Math.max(0,1-m.st/m.dur)):1, ease=q=>q*q*(3-2*q);

      if(m.st<=0){                                                              // back on his feet: shoves you off him

        burst(mcx,m.y+m.h-4,'#9aa0a6',14,200,0.5,300); shake=Math.max(shake,0.15);
      } break;
    case 'getup': m.vx=0; m.batA=SLG_REST; if(m.st<=0){ slgSet(m,'walk',0); m.serveT=SLG.serve*0.6; } break;
    case 'shake': m.vx=0; m.batA=-1.3+Math.sin(clock*38)*0.4;
      if(m.st<=0){
        if(tps&&tps.onBat===m){ const [bx,by]=batTip(m,0.9); tps.onBat=null; burst(bx,by,'#6fcf5a',16,240,0.5,400); SFX.play('splat',{x:bx}); endTPS('break',null); }

    case 'bat': m.vx=0;

      if(m.st<=0) slgSet(m,'walk',0); break;

      if(m.st<=0){ slgSet(m,'swing',SLG.swing); m.swingHit=false; SFX.play('batSwing',{x:mcx}); } break;
    case 'swing': { m.vx=0; m.batA=SLG_BACK+(SLG_END-SLG_BACK)*k;
      const reach=m.w/2+SLG.reach, x0=m.face>0?mcx:mcx-reach;

      if(m.st<=0) slgSet(m,'recover',SLG.recover); break; }
    case 'recover': m.vx=0; m.batA=SLG_END+(SLG_REST-SLG_END)*ease(k); if(m.st<=0) slgSet(m,'walk',0); break;
    case 'serve': m.vx=0;                                                       // tosses a ball up and bats it at you
      m.batA=k<0.6?SLG_REST+(SLG_BACK-SLG_REST)*ease(k/0.6):SLG_BACK+(0.3-SLG_BACK)*ease((k-0.6)/0.4);

        const [bx,by]=batTip(m,0.7), tx=pcx-bx, ty=P.y+P.h/2-by, d=Math.hypot(tx,ty)||1, v=rage?470:390;
        shards.push({x:bx,y:by,vx:tx/d*v,vy:ty/d*v-50,hostile:true,src:'serve'}); burst(bx,by,'#fff1b8',6,120,0.2,0); SFX.play('batHit',{x:bx,soft:1});
      }
      if(m.st<=0) slgSet(m,'walk',0); break;
    default:                                                                    // idle / walk: comes for you
      m.batA=SLG_REST+Math.sin(clock*2)*0.05;
      if(m.state==='idle'){ m.vx=0; if(adx<520||m.st<=0) slgSet(m,'walk',0); break; }
      if(adx>4) m.face=dx>0?1:-1;
      if(level&&adx<m.w/2+SLG.reach-6&&dying<=0){ slgSet(m,'windup',rage?SLG.windRage:SLG.wind); m.vx=0; SFX.play('grunt',{x:mcx,f:95}); break; }

      m.vx=adx>30?m.face*(rage?SLG.rage:SLG.speed):0;
      const ahead=m.face>0?m.x+m.w+2:m.x-2;
      const wall=blocksPlayer(tileAt(ahead,m.y+m.h-6))||blocksPlayer(tileAt(ahead,m.y+m.h/2))||miniHits(ahead-1,m.y,2,m.h-2);
      const floor=tileAt(ahead,m.y+m.h+4), feet=tileAt(ahead,m.y+m.h-4);
      if(wall||(m.onGround&&!(blocksPlayer(floor)||floor==='Q'||miniHits(ahead-1,m.y+m.h,2,8)))||feet==='~'||feet==='V'||feet==='^'||floor==='~'||floor==='V') m.vx=0;
  }
  m.vy=Math.min(900,m.vy+T.gravity*dt);
  const nx=m.x+m.vx*dt;
  if(!boxHits(nx,m.y,m.w,m.h)) m.x=nx; else m.vx=0;
  const ny=m.y+m.vy*dt;

  if(m.vy>0&&feetSolid(m.x,ny+m.h,m.w)){ m.y=Math.floor((ny+m.h)/TILE)*TILE-m.h; m.vy=0; m.onGround=true; }
  else if(m.vy>0&&miniLand(m,ny)) m.onGround=true;
  else if(m.vy<0&&boxHits(m.x,ny,m.w,m.h)) m.vy=0;
  else m.y=ny;
  if(P.inv<=0&&!slgDazed(m)&&touches(m)) hurt(false,(Math.sign(dx)||m.face)*420,-280);      // bumping into him hurts too

}

/* flying enemy: drifts around its perch, lobs rocks at you; the sphere or a turret shot knocks it down for a few seconds */

    m.x+=(tx-m.w/2-m.x)*Math.min(1,dt*1.5); m.y+=(ty-m.h/2-m.y)*Math.min(1,dt*3);

    }

        shards.push({x:cx,y:cy+6,vx:dx/d*v,vy:dy/d*v-70,hostile:true,src:'flyer'}); SFX.play('flyerShot',{x:cx});

    if(m.vy>0&&feetSolid(m.x,ny+m.h,m.w)){ m.y=Math.floor((ny+m.h)/TILE)*TILE-m.h; m.vy=0; }

/* an enemy coming down onto a mini wall stands on it */
function miniLand(m,ny){

function feetSolid(x,y,w){

function stepBrute(m,dt){

  m.vy=Math.min(900,m.vy+T.gravity*dt);
  const nx=m.x+m.vx*dt;
  if(!boxHits(nx,m.y,m.w,m.h)) m.x=nx; else if(m.state==='walk'){ m.face*=-1; m.vx=0; } else m.vx=0;
  const ny=m.y+m.vy*dt;
  m.onGround=false;
  if(m.vy>0&&feetSolid(m.x,ny+m.h,m.w)){ m.y=Math.floor((ny+m.h)/TILE)*TILE-m.h; m.vy=0; m.onGround=true; }
  else if(m.vy>0&&miniLand(m,ny)) m.onGround=true;
  else if(m.vy<0&&boxHits(m.x,ny,m.w,m.h)) m.vy=0;
  else m.y=ny;
  if(hazardHit(m.x,m.y,m.w,m.h,'~V')) killMob(m);
  if(m.y>VH*TILE+40) m.alive=false;
}
function stepMobs(dt){
  for(const m of mobs){
    if(!m.alive) continue;
    if(m.flash>0) m.flash-=dt;
    if(m.t==='turret'){
      m.cd-=dt;
      if(m.cd<=0){
        m.cd=1.5;
        const dx=(P.x+P.w/2)-(m.x+m.w/2), dy=(P.y+P.h/2)-(m.y+m.h/2), d=Math.hypot(dx,dy)||1;
        shards.push({x:m.x+m.w/2,y:m.y+m.h/2,vx:dx/d*300,vy:dy/d*300,hostile:true,src:'turret'}); SFX.play('turretShot',{x:m.x+m.w/2});
      }
    }
    if(m.t==='eater'){
      if(m.stun>0) m.stun-=dt;
      else if(m.fed>0) m.fed-=dt;
      else {
        m.x+=m.vx*dt;
        if(m.x<TILE){ m.x=TILE; m.vx*=-1; }
        if(m.x>VW*TILE-TILE-m.w){ m.x=VW*TILE-TILE-m.w; m.vx*=-1; }
        if(blocksPlayer(tileAt(m.x+(m.vx>0?m.w+2:-2),m.y+m.h/2))||(planks.length>0&&miniHits(m.vx>0?m.x+m.w:m.x-3,m.y,3,m.h-2))) m.vx*=-1;
      }
    }
    if(m.t==='absorber'){
      m.cy=m.baseY+Math.sin(clock*2+m.ph)*4;
      m.x=m.cx-13; m.y=m.cy-13;
      if(m.gulp>0) m.gulp-=dt;
      if(!(tps&&tps.cap&&tps.cap.m===m)) m.pull=Math.max(0,m.pull-dt*3);
    }
    if(m.t==='brute'){ stepBrute(m,dt); continue; }      // only its punch hurts
    if(m.t==='guard'){ stepGuard(m,dt); continue; }
    if(m.t==='slugger'){ stepSlugger(m,dt); continue; }
    if(m.t==='flyer'){ stepFlyer(m,dt); if(m.state==='stunned') continue; }
    if(P.inv<=0&&touches(m)) hurt(false);
  }
  for(let i=shards.length-1;i>=0;i--){
    const s=shards[i]; if(!s) continue;
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=200*dt;
    let dead = s.x<0||s.x>VW*TILE||s.y>VH*TILE||blocksPlayer(tileAt(s.x,s.y))||(planks.length>0&&!!miniHits(s.x-2,s.y-2,4,4));
    for(const m of mobs){                     // turret shots kill the eater and knock flyers down
      if(!m.alive||!(s.x>m.x&&s.x<m.x+m.w&&s.y>m.y&&s.y<m.y+m.h)) continue;
      if(m.t==='eater'&&s.src!=='flyer'){ damageMob(m,99,'shot',0); dead=true; }
      if(m.t==='flyer'&&s.src==='turret'){ damageMob(m,1,'shot',0); burst(s.x,s.y,'#e8e4dc',8,120,0.3,0); dead=true; }
    }
    if(P.inv<=0&&s.x>P.x&&s.x<P.x+P.w&&s.y>P.y&&s.y<P.y+P.h){ hurt(false); dead=true; }
    if(dead){ if(s.x>=0&&s.x<=VW*TILE&&s.y<=VH*TILE) SFX.play('shardTick',{x:s.x,v:0.7}); shards.splice(i,1); }
  }
}
function spikeStopX(){
  const hung=spikes.filter(s=>s.state==='hung');
  const pool=hung.length?hung:spikes;
  if(!pool.length) return boss.x;
  let best=null, bd=Infinity;
  for(const s of pool){
    const cx=s.x+s.w/2;
    if(Math.abs(cx-(boss.x+boss.w/2))<6) continue;
    const d=Math.abs(cx-(P.x+P.w/2));
    if(d<bd){ bd=d; best=s; }
  }
  if(!best) best=pool[0];
  boss.target=best;
  return best.x+best.w/2-boss.w/2;
}
function stepBoss(dt){
  if(!boss) return;
  if(boss.hp<=0){ if(boss.dieT>0) boss.dieT-=dt; if(boss.flash>0) boss.flash-=dt; return; }
  if(boss.flash>0) boss.flash-=dt;
  if(boss.shake>0) boss.shake-=dt;
  if(boss.recoil>0) boss.recoil=Math.max(0,boss.recoil-dt);
  boss.t-=dt;
  if(boss.state==='dash') boss.face=Math.sign(boss.targetX-boss.x)||boss.face||-1;
  else if(boss.state!=='stun') boss.face=(P.x+P.w/2<boss.x+boss.w/2)?-1:1;
  const sand = tileAt(boss.x+boss.w/2,boss.y+boss.h+2)==='Q';
  if(!spikes.some(s=>s.state==='hung')){
    boss.regrow=(boss.regrow||0)+dt;
    if(boss.regrow>2.5){
      for(const s of spikes){ s.state='hung'; s.y=s.homeY; s.vy=0; s.snd=0; }
      SFX.play('regrow');
      boss.regrow=0;
    }
  } else boss.regrow=0;

  if(boss.state==='idle'&&boss.t<=0){ boss.state='shoot'; boss.t=0.35; boss.shots=3; SFX.play('hogBristle',{x:boss.x+boss.w/2}); }
  else if(boss.state==='shoot'&&boss.t<=0){
    const dx=(P.x-boss.x), dy=(P.y-boss.y), m=Math.hypot(dx,dy)||1;
    shards.push({x:boss.x+boss.w/2,y:boss.y+10,vx:dx/m*300,vy:dy/m*300-60,hostile:true,src:'boss'});
    boss.shots--; boss.t=0.35; boss.recoil=0.15; SFX.play('hogSpine',{x:boss.x+boss.w/2});
    if(boss.shots<=0){ boss.state='dash'; boss.t=3.5; boss.targetX=spikeStopX(); }
  }
  else if(boss.state==='dash'){
    const sp=300*(sand?0.4:1);
    const step=sp*dt, gap=boss.targetX-boss.x;
    if(Math.abs(gap)<=step||boss.t<=0){
      boss.x=boss.targetX; boss.state='idle'; boss.t=1.5; SFX.play('hogThud',{x:boss.x+boss.w/2});
      burst(boss.x+boss.w/2,boss.y+boss.h,sand?'#8a7348':'#6b7076',8,90,0.4,300);
    } else {
      boss.x+=Math.sign(gap)*step;
      SFX.hold('rumble',{v:sand?0.65:1}); boss.stompT=(boss.stompT||0)-dt; if(boss.stompT<=0){ boss.stompT=sand?0.22:0.15; SFX.play('hogStomp',{x:boss.x+boss.w/2}); }
      if(Math.random()<(sand?0.5:0.35)) parts.push({x:boss.x+boss.w/2-boss.face*18,y:boss.y+boss.h-2,vx:-boss.face*(40+Math.random()*60),vy:-40-Math.random()*50,
        life:0.4,max:0.4,col:sand?'#8a7348':'#5a6169',s:2+Math.random()*3,g:200});
    }
  }
  else if(boss.state==='stun'&&boss.t<=0){ boss.state='idle'; boss.t=1.0; }

  boss.x=Math.max(TILE,Math.min(boss.x,VW*TILE-TILE-boss.w));
  boss.vy+=T.gravity*dt; boss.y+=boss.vy*dt;
  if(blocksPlayer(tileAt(boss.x+boss.w/2,boss.y+boss.h+1))||tileAt(boss.x+boss.w/2,boss.y+boss.h+1)==='Q'){
    boss.y=Math.floor((boss.y+boss.h)/TILE)*TILE-boss.h; boss.vy=0;
  }
  if(P.inv<=0&&P.x<boss.x+boss.w&&P.x+P.w>boss.x&&P.y<boss.y+boss.h&&P.y+P.h>boss.y) hurt(false);
}

/* ---------- shared tile art (used by the editor too) — everything animates off `clock` ---------- */
/* per-tile random in [0,1) so neighbouring tiles don't pulse in lockstep */
function hash(x,y){
  let h=(x*374761393+y*668265263)|0;
  h=Math.imul(h^(h>>>13),1274126177);
  return ((h^(h>>>16))>>>0)/4294967296;
}
const wave=(speed,phase)=>0.5+0.5*Math.sin(clock*speed+phase);

const WALL='#2a2f34', shadeCache={};
function shade(hex,amt){                                     // lighter (amt>0) or darker (amt<0) version of a colour
  const k=hex+amt; if(shadeCache[k]) return shadeCache[k];
  const n=parseInt(hex.slice(1),16), f=v=>Math.max(0,Math.min(255,Math.round(amt>0?v+(255-v)*amt:v*(1+amt))));
  return shadeCache[k]='rgb('+f(n>>16&255)+','+f(n>>8&255)+','+f(n&255)+')';
}
function drawWall(px,py,above,h,col,band){
  const c=col&&/^#[0-9a-f]{6}$/i.test(col)?col:WALL, def=c===WALL;
  ctx.fillStyle=c; ctx.fillRect(px,py,TILE,TILE);

  if(h<0.5) ctx.fillRect(px+4,py+14,11,1); else ctx.fillRect(px+15,py+22,12,1);
  if(band!==false){ ctx.fillStyle=def?'#343a40':shade(c,0.09); ctx.fillRect(px,py,TILE,3); }
  if(above!=='#'){                                           // exposed ledge: light glint travels along it
    const w=wave(1.4,-(px*0.018+py*0.01));
    ctx.fillStyle='rgba(232,228,220,'+(0.04+0.16*w*w*w)+')'; ctx.fillRect(px,py,TILE,2);
  }
  if(h>0.78){                                                // occasional mineral sparkle
    const s=(clock*0.3+h*9)%1;

}

function drawPickup(kind,cx,cy,seed){

function drawReward(kind,cx,cy,seed){

function drawBrute(m){

/* ---------- map: rooms placed on a grid by following their exit links ---------- */
const DIRV={left:[-1,0],right:[1,0],top:[0,-1],bottom:[0,1]};
const footOf=id=>(ROOMS[id]&&ROOMS[id].size==='big')?[2,2]:[1,1];
function mapLayout(force){
  if(layoutCache&&!force) return layoutCache;
  const pos={}, occ={}, edges=[];
  const free=(x,y,w,h)=>{ for(let a=0;a<w;a++) for(let b=0;b<h;b++) if(occ[(x+a)+','+(y+b)]) return false; return true; };
  const place=(id,x,y)=>{ const [w,h]=footOf(id); pos[id]=[x,y]; for(let a=0;a<w;a++) for(let b=0;b<h;b++) occ[(x+a)+','+(y+b)]=id; };
  const cellIn=(f,n)=>Math.max(0,Math.min(n-1,Math.floor(f*n)));
  for(const root of ORDER){
    if(pos[root]||!ROOMS[root]) continue;
    const [rw,rh]=footOf(root);
    if(!Object.keys(pos).length) place(root,0,0);
    else {                                                  // a group of rooms not linked to the rest: park it below
      let minX=Infinity, maxY=-Infinity;
      for(const id in pos){ minX=Math.min(minX,pos[id][0]); maxY=Math.max(maxY,pos[id][1]+footOf(id)[1]-1); }
      let x=minX; const y=maxY+2; while(!free(x,y,rw,rh)) x++;
      place(root,x,y);
    }
    const q=[root];
    while(q.length){
      const id=q.shift(), r=ROOMS[id], gw=r.grid[0].length, gh=r.grid.length, [aw,ah]=footOf(id), [x0,y0]=pos[id];
      for(const g of exitGroups(exitGrid(r))){
        const l=linkOf(r,g); if(!l||!l.to||!ROOMS[l.to]) continue;
        const mx=g.tiles.reduce((a,t)=>a+t[0],0)/g.tiles.length, my=g.tiles.reduce((a,t)=>a+t[1],0)/g.tiles.length;
        const secret=g.tiles.every(([tx,ty])=>!EXIT_CH.includes(exitChar(r.grid[ty][tx])));   // hidden exit: not a spoiler on the map
        edges.push({a:id,b:l.to,ax:mx,ay:my,at:l.at,secret});
        if(pos[l.to]) continue;
        const B=ROOMS[l.to], bgw=B.grid[0].length, bgh=B.grid.length, [bw,bh]=footOf(l.to);
        let [atx,aty]=l.at?l.at.split(',').map(Number):[bgw/2,bgh/2];
        let w=g.wall; if(w==='inner') w=mx<gw/2?'left':'right';
        let bx,by;                                          // line the two exits up
        if(w==='left'||w==='right'){ by=y0+cellIn((my+0.5)/gh,ah)-cellIn((aty+0.5)/bgh,bh); bx=w==='right'?x0+aw:x0-bw; }
        else { bx=x0+cellIn((mx+0.5)/gw,aw)-cellIn((atx+0.5)/bgw,bw); by=w==='bottom'?y0+ah:y0-bh; }
        const [dx,dy]=DIRV[w], pp=dx?[0,my<gh/2?-1:1]:[mx<gw/2?-1:1,0];
        const tries=[[0,0],[pp[0],pp[1]],[-pp[0],-pp[1]],[dx,dy],[dx+pp[0],dy+pp[1]],[dx-pp[0],dy-pp[1]]];
        let spot=tries.map(([a,b])=>[bx+a,by+b]).find(([x,y])=>free(x,y,bw,bh));
        for(let rad=2;!spot&&rad<16;rad++) for(let a=-rad;a<=rad&&!spot;a++) for(let b=-rad;b<=rad&&!spot;b++){
          const x=bx+dx*rad+a, y=by+dy*rad+b; if(free(x,y,bw,bh)) spot=[x,y]; }
        place(l.to,spot[0],spot[1]); q.push(l.to);
      }
    }
  }
  return layoutCache={pos,edges};
}
/* draws the map into any 2D context; returns the room rectangles (the editor uses them for clicks) */
function drawMap(g,box,o){

    if(ROOMS[id].challenge){ g.fillStyle='#a58aff'; g.beginPath(); g.moveTo(x+4,y+1.5); g.lineTo(x+6.5,y+4); g.lineTo(x+4,y+6.5); g.lineTo(x+1.5,y+4); g.closePath(); g.fill(); }
    if(o.labels&&w>=o.cw*0.9){ g.fillStyle=cur?'#e8e4dc':'#9aa0a6'; g.font=o.labelFont||'9px system-ui'; g.textAlign='center';
                  g.fillText(id,x+w/2,y+h/2+3); g.textAlign='left'; }
    if(cur&&o.player){ g.fillStyle='#fff'; g.fillRect(x+o.player[0]*w-1.5,y+o.player[1]*h-1.5,3,3); }

/* the Hedgehog: breathing, blinking, spines bristle before he fires, recoil per shot, running legs and dust

function drawBoss(b){

    const tx=ex+Math.cos(a)*L, ty=ey+Math.sin(a)*L, nx=-Math.sin(a)*4, ny=Math.cos(a)*4;

  ctx.beginPath(); ctx.arc(27+(stun||dying?0:Math.sin(clock*9)*0.7),-16.5,2.6,0,7); ctx.fill();   // twitching nose

    ctx.strokeStyle='#1a1d21'; ctx.lineWidth=1.6; ctx.beginPath();
