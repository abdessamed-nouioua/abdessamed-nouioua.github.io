    ctx.fillStyle='#e8e4dc'; ctx.beginPath(); ctx.ellipse(11.5,-21.5,3.6,blink?0.6:3.6,0,0,7); ctx.fill();
    if(!blink){ ctx.fillStyle='#1a1d21'; ctx.beginPath(); ctx.arc(12.6,-21.3,1.9,0,7); ctx.fill(); }
    if(dash||wind){ ctx.strokeStyle='#3a2a1e'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(7,-27.5); ctx.lineTo(15.5,-25); ctx.stroke(); }   // angry brow
  }
  ctx.restore();
  if(stun) for(let i=0;i<3;i++){
    const a=clock*5+i*2.09; ctx.fillStyle='#e0c04a';
    ctx.fillRect(cx+f*8+Math.cos(a)*13-1.5,b.y-2+Math.sin(a)*4-1.5,3,3);
  }
  if(!dying) for(let i=0;i<3;i++){                              // health
    ctx.fillStyle=i<b.hp?'#d84a2f':'#3a3f45'; ctx.fillRect(cx-23+i*16,b.y-16,14,5);
  }
}
/* the thrown sphere: blue (red with extra layers), green goo for sticky, dark with a blinking light for bomb */
function drawSphereBody(t){
  const r=Math.max(0.5,t.r*t.scale*(t.frozen?1+0.25*Math.sin(clock*40):1));        // the same size however many layers it has
  const cap=t.cap||layerCap(t.kind);
  if(t.kind==='sticky'){                                       // sticky wheel: gooey tyre, spokes that turn as it rolls
    const R=r+1.5;
    ctx.save(); ctx.translate(t.x,t.y);
    if(t.hurt>0){ if(Math.floor(t.hurt*16)%2===0) ctx.globalAlpha*=0.35;              // blinks after a hit
      ctx.strokeStyle='rgba(216,74,47,'+Math.min(1,t.hurt*2)+')'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,R+3,0,7); ctx.stroke(); }
    if(t.stuck){ ctx.fillStyle='rgba(111,207,90,.55)'; ctx.beginPath(); ctx.ellipse(-t.stuck.nx*R,-t.stuck.ny*R,t.stuck.nx?2.5:R*0.8,t.stuck.nx?R*0.8:2.5,0,0,7); ctx.fill(); }
    ctx.rotate(t.spin||0);
    ctx.fillStyle='#2f6a28'; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill();
    ctx.fillStyle=SPH.sticky.c;
    for(let i=0;i<8;i++){ const a=i*Math.PI/4; ctx.save(); ctx.rotate(a); ctx.fillRect(R-2.5,-1.6,3.2,3.2); ctx.restore(); }   // sticky treads
    ctx.fillStyle='#1c3a1c'; ctx.beginPath(); ctx.arc(0,0,R-2.8,0,7); ctx.fill();
    drawLayerRings(0,0,R-3.1,t.layers,cap,SPH.sticky.ring);                             // layers: rings inside the wheel
    ctx.strokeStyle=SPH.sticky.lite; ctx.lineWidth=1.1; ctx.beginPath();
    for(let i=0;i<4;i++){ const a=i*Math.PI/2; ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*(R-3),Math.sin(a)*(R-3)); } ctx.stroke();
    ctx.fillStyle='#e8e4dc'; ctx.beginPath(); ctx.arc(0,0,1.6,0,7); ctx.fill();
    ctx.restore();
  } else if(t.kind==='bomb'){                                  // bomb: red, with a fuse that spits sparks
    const blink=Math.floor(clock*8)%2===0;
    ctx.fillStyle=blink?'#e2573c':SPH.bomb.c; ctx.beginPath(); ctx.arc(t.x,t.y,r,0,7); ctx.fill();
    drawLayerRings(t.x,t.y,r-1,t.layers,cap,SPH.bomb.ring);
    ctx.strokeStyle='#4a1410'; ctx.lineWidth=1.4*t.scale; ctx.beginPath(); ctx.arc(t.x,t.y,r,0,7); ctx.stroke();
    ctx.strokeStyle='#9aa0a6'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(t.x+r*0.6,t.y-r*0.8); ctx.lineTo(t.x+r*1.0,t.y-r*1.45); ctx.stroke();
    ctx.fillStyle=Math.random()<0.5?'#f5c04a':'#fff1b8'; ctx.fillRect(t.x+r*1.0-1.5,t.y-r*1.45-1.5,3,3);    // fuse spark
  } else {                                                     // normal: gold
    ctx.fillStyle=SPH.normal.c; ctx.beginPath(); ctx.arc(t.x,t.y,r,0,7); ctx.fill();
    drawLayerRings(t.x,t.y,r-1,t.layers,cap,SPH.normal.ring);
    ctx.strokeStyle=SPH.normal.lite; ctx.lineWidth=1.5*t.scale; ctx.beginPath(); ctx.arc(t.x,t.y,r,0,7); ctx.stroke();
  }
}
/* ---------- the player: a little adventurer built from joints, posed every frame ----------
   Head, tunic, two arms, two legs, a scarf in the colour of the sphere he's carrying, and the sword on his back until he
   draws it. Poses: standing (breathing, blinking), running, jumping and falling, landing, swimming, sliding on ice,
   being knocked back, aiming and throwing the sphere, steering the sticky wheel, and the 8-way slash. */
const PA={ph:0,land:0,jump:0,blink:2.5,throwT:0,throwA:[1,0],wasGround:true,vyPrev:0,scarf:[],sx:0,sy:0};
function resetPlayerAnim(){ PA.scarf=[]; PA.land=0; PA.jump=0; PA.throwT=0; PA.wasGround=true; }
/* two-bone limb: where the knee/elbow goes for a hand/foot at (x1,y1); bend = +1/-1 picks which side it folds to */
function ik(x0,y0,x1,y1,a,b,bend){
  let dx=x1-x0, dy=y1-y0, d=Math.hypot(dx,dy)||0.001; const m=a+b-0.05;
  if(d>m){ x1=x0+dx/d*m; y1=y0+dy/d*m; dx=x1-x0; dy=y1-y0; d=m; }
  const c=Math.max(-1,Math.min(1,(a*a+d*d-b*b)/(2*a*d))), ang=Math.atan2(dy,dx)+bend*Math.acos(c);
  return [x0+Math.cos(ang)*a,y0+Math.sin(ang)*a,x1,y1];
}
function scarfCol(){
  if(!G.hasTPS) return '#8a9096';
  return sphCol(G.sphereKind);
}
/* joints for this frame, in "feet at (0,0), facing +x" space */
function playerPose(){
  const sp=Math.min(1,Math.abs(P.vx)/Math.max(1,T.runSpeed)), air=!P.ground, t=clock;
  const slash=SW.t>0, aiming=M.aiming&&G.hasTPS&&!noTPS()&&!warp, steering=!!(tps&&tps.stuck&&M.aiming);
  const loc=(ax,ay)=>[ax*P.face,ay];                         // a world direction seen from his facing side
  let lean=0, bob=0;
  let feet=[[-3,0],[3.5,0]], hands=[[-4.5,-19],[4,-18.5]], kneeB=[-1,-1], elbowB=[1,1];
  if(P.kb>0){                                                // knocked back: thrown off his feet
    lean=-0.38; feet=[[3,-3],[8,-6]]; hands=[[-7,-37],[5,-39]]; elbowB=[-1,-1];
  } else if(P.wet){                                          // swimming: flutter kick, arms paddling
    lean=0.3+0.25*sp; const q=t*7;
    feet=[[-5+Math.sin(q)*3,-2-Math.cos(q)*2],[-2-Math.sin(q)*3,-1+Math.cos(q)*2]];
    hands=[[6+Math.cos(q*0.6)*5,-25+Math.sin(q*0.6)*4],[7-Math.cos(q*0.6)*5,-26-Math.sin(q*0.6)*4]];
  } else if(air){                                            // rising: knee up, arms back; falling: legs down, arms up
    const q=Math.max(0,Math.min(1,(P.vy+420)/700));          // 0 = shooting up, 1 = falling fast
    lean=0.1-0.16*q;
    feet=[[-5+2*q,-2-1.5*q],[4.5-1.5*q,-9+6*q]];
    hands=[[-7-1*q,-22-13*q],[6+2*q,-24-12*q]]; elbowB=[1,-1];
  } else if(sp>0.08){                                        // running: legs cycle with the ground covered, arms counter-swing
    lean=0.17*sp; bob=-Math.abs(Math.cos(PA.ph))*1.7*sp;
    for(let i=0;i<2;i++){
      const th=PA.ph+i*Math.PI;
      feet[i]=[Math.cos(th)*8*sp+(i?1.2:-1.2)*(1-sp),-Math.max(0,-Math.sin(th))*6.5*sp];
      hands[i]=[-Math.cos(th)*6.5*sp+(i?3:-3)*(1-sp),-20.5-Math.abs(Math.cos(th))*2.5*sp];
    }
  } else {                                                   // standing: breathing, weight settling
    bob=Math.sin(t*2.2)*0.5;
    hands=[[-4.5,-19+Math.sin(t*2.2+0.6)*0.5],[4,-18.5+Math.sin(t*2.2+0.3)*0.5]];
  }
  if(P.kb<=0&&!air&&!P.wet){
    if(P.onIce&&sp>0.15&&!(keys.KeyA||keys.KeyD)){            // skidding on ice: feet apart, arms out for balance
      const back=Math.sign(P.vx*P.face)||1;
      lean=-0.14*back; bob=1.2; feet=[[-6.5,0],[7.5,0]]; hands=[[-9,-27+Math.sin(t*14)*1.5],[9,-28-Math.sin(t*14)*1.5]];
    }
    if(P.inSand&&P.sink>0.2){                                 // sinking in quicksand: arms up, struggling
      hands=[[-6,-36+Math.sin(t*11)*2.5],[6,-37-Math.sin(t*11)*2.5]]; elbowB=[-1,-1]; lean+=Math.sin(t*6)*0.06;
    }
  }
  if(slash&&!air&&!P.wet&&P.kb<=0){                           // thrusting on the ground: he lunges into it
    const dx=SW.ax*P.face, e=thrustExt(); lean+=0.22*dx*e; bob+=1.8*e;
    if(sp<0.3) feet=[[-5.5-2.5*dx*e,0],[5.5+3.5*dx*e,0]];
  }
  const hipY=-17+bob, ux=Math.sin(lean), uy=-Math.cos(lean);  // spine direction
  const hip=[0+ux*0,hipY], sh=[hip[0]+ux*14,hip[1]+uy*14], head=[sh[0]+ux*7.5+1,sh[1]+uy*7.5];
  let sword=null, held=false;
  if(steering){ hands=[[sh[0]+9,sh[1]+5],[sh[0]+10,sh[1]+2]]; elbowB=[1,1]; }
  else if(slash){                                            // thrust: the sword arm drives straight out, the off hand goes back
    const [dx,dy]=loc(SW.ax,SW.ay), e=thrustExt();
    const oy=-(P.h/2+SW_UP)-sh[1];                             // the hand travels along the thrust's own line
    hands[1]=[dx*(2+11.5*e),sh[1]+oy+dy*(2+11.5*e)]; hands[0]=[sh[0]-5-dx*4*e,sh[1]+9-dy*3*e];
    sword=[dx,dy]; elbowB=[1,dy<-0.3?-1:1];
  } else if(PA.throwT>0){                                    // arm snapped out after the throw
    const [dx,dy]=loc(PA.throwA[0],PA.throwA[1]); hands[1]=[sh[0]+dx*13.5,sh[1]+1+dy*13.5];
  } else if(aiming){                                         // holds the sphere out along the aim
    const [ax,ay]=aimVector(true), [dx,dy]=loc(ax,ay), w=Math.sin(t*9)*0.4;
    hands[1]=[sh[0]+dx*11.5,sh[1]+1+dy*11.5+w]; held=!tps&&recharge<=0;
  }
  const legs=[], arms=[];
  for(let i=0;i<2;i++){
    legs.push(ik(hip[0]+(i?2:-2),hip[1],feet[i][0],feet[i][1],8.6,8.6,kneeB[i]));
    arms.push(ik(sh[0]+(i?1.5:-1.5),sh[1]+1.5,hands[i][0],hands[i][1],7,7,elbowB[i]));
  }
  return {hip,sh,head,legs,arms,lean,sword,held,slash};
}
/* timers that drive the poses, and the scarf trailing behind him */
function animPlayer(dt){
  PA.ph+=P.vx*P.face*dt*0.068;                               // strides follow the ground actually covered
  if(P.ground&&!PA.wasGround&&PA.vyPrev>260){ PA.land=0.14; burst(P.x+P.w/2,P.y+P.h,'#6b7076',5,70,0.25,200); }
  if(!P.ground&&PA.wasGround&&P.vy<-200) PA.jump=0.14;
  PA.wasGround=P.ground; PA.vyPrev=P.vy;
  for(const k of ['land','jump','throwT']) if(PA[k]>0) PA[k]=Math.max(0,PA[k]-dt);
  PA.blink-=dt; if(PA.blink<-0.12) PA.blink=1.8+Math.random()*3;
  for(let i=slashFx.length-1;i>=0;i--){                      // thrust streaks: the live one follows the blade, then fades
    const f=slashFx[i];
    if(f.live){ if(thrustLive()) f.ext=thrustExt(); else f.live=false; }
    else { f.t+=dt; if(f.t>0.12) slashFx.splice(i,1); }
  }
  const ax=P.x+P.w/2-P.face*2, ay=P.y+P.h-32;                 // scarf: a little chain pinned at the neck
  const S=PA.scarf, N=6, L=3.6;
  if(S.length!==N||Math.hypot(S[0][0]-ax,S[0][1]-ay)>60){ S.length=0; for(let i=0;i<N;i++) S.push([ax-P.face*i*L,ay+i*0.6]); }
  S[0][0]=ax; S[0][1]=ay;
  for(let i=1;i<N;i++){
    const q=S[i], pr=S[i-1];
    q[0]+=(-P.vx*0.5-P.face*26+Math.sin(clock*7+i*1.1)*16)*dt; q[1]+=(26-P.vy*0.25+Math.cos(clock*6+i)*10)*dt;
    const dx=q[0]-pr[0], dy=q[1]-pr[1], d=Math.hypot(dx,dy)||0.001;
    q[0]=pr[0]+dx/d*L; q[1]=pr[1]+dy/d*L;
  }
}
function drawSwordBlade(len,elem,alpha){
  const col=({none:'#e8e4dc',fire:'#f5a04a',ice:'#bfe6ff'})[elem]||'#e8e4dc';
  ctx.globalAlpha*=alpha===undefined?1:alpha;
  ctx.fillStyle='#5a4632'; ctx.fillRect(-3,-1.3,4.5,2.6);                             // grip
  ctx.fillStyle='#c9a36b'; ctx.fillRect(1,-3.2,1.8,6.4);                                // guard
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(2.8,-1.6); ctx.lineTo(len-4,-1.3); ctx.lineTo(len,0); ctx.lineTo(len-4,1.3); ctx.lineTo(2.8,1.6); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fillRect(4,-0.4,len-9,0.8);                // fuller
}
function drawPlayerBody(alpha){
  const f=P.face||1, fx=P.x+P.w/2, fy=P.y+P.h, p=playerPose();
  const ql=PA.land/0.14, qj=PA.jump/0.14, sx=1+0.13*ql-0.08*qj, sy=1-0.17*ql+0.1*qj;      // squash on landing, stretch on take-off
  const a0=ctx.globalAlpha; ctx.globalAlpha=a0*alpha;
  const sc=scarfCol(), S=PA.scarf;
  if(S.length){                                                // scarf first: it's behind him
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=sc;
    for(let i=1;i<S.length;i++){ ctx.lineWidth=4.2-i*0.55; ctx.beginPath(); ctx.moveTo(S[i-1][0],S[i-1][1]); ctx.lineTo(S[i][0],S[i][1]); ctx.stroke(); }
  }
  ctx.save(); ctx.translate(fx,fy); ctx.scale(f*sx,sy); ctx.lineCap='round'; ctx.lineJoin='round';
  const limb=(x0,y0,x1,y1,x2,y2,w,c1,c2)=>{ ctx.strokeStyle=c1; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    ctx.strokeStyle=c2||c1; ctx.lineWidth=w-0.6; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); };
  const leg=(i,c,boot)=>{ const L=p.legs[i], hx=p.hip[0]+(i?2:-2);
    limb(hx,p.hip[1],L[0],L[1],L[2],L[3]-1.2,4.6,c,c);
    ctx.fillStyle=boot; ctx.beginPath(); ctx.ellipse(L[2]+1.4,L[3]-1.4,3.4,1.9,0,0,7); ctx.fill(); };
  const arm=(i,c,hand)=>{ const A=p.arms[i], sx0=p.sh[0]+(i?1.5:-1.5);
    limb(sx0,p.sh[1]+1.5,A[0],A[1],A[2],A[3],3.6,c,c);
    ctx.fillStyle=hand; ctx.beginPath(); ctx.arc(A[2],A[3],1.9,0,7); ctx.fill(); };
  if(!p.slash){                                                // sword sheathed across his back
    ctx.save(); ctx.translate(p.sh[0]-6,p.sh[1]-6.5); ctx.rotate(Math.PI/2-0.27+p.lean); drawSwordBlade(25,SW.elem,0.92); ctx.restore();   // hilt over the shoulder
  }
  arm(0,'#c9c2b4','#d2b092'); leg(0,'#323a46','#1b1f24');        // far-side arm and leg, a shade darker
  ctx.fillStyle='#e8e4dc';                                     // tunic: shoulders to hips, flaring a little
  ctx.save(); ctx.translate(p.hip[0],p.hip[1]); ctx.rotate(p.lean);
  ctx.beginPath(); ctx.moveTo(-5.2,-14.5); ctx.quadraticCurveTo(0,-17,5.2,-14.5); ctx.lineTo(5.8,1.5); ctx.lineTo(-5.8,1.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#c9c2b4'; ctx.fillRect(-5.8,-0.5,11.6,2);      // hem
  ctx.fillStyle='#5a4632'; ctx.fillRect(-5.5,-4.2,11,1.9);      // belt
  ctx.fillStyle='#c9a36b'; ctx.fillRect(1.5,-4.5,2.4,2.5);      // buckle
  ctx.restore();
  ctx.fillStyle=sc; ctx.beginPath(); ctx.ellipse(p.sh[0]+0.3,p.sh[1]+0.2,5.3,2.5,p.lean,0,7); ctx.fill();   // scarf wrapped at the neck
  const hx=p.head[0], hy=p.head[1];
  ctx.fillStyle='#e9c9a8'; ctx.beginPath(); ctx.arc(hx,hy,5.9,0,7); ctx.fill();                              // head
  ctx.fillStyle='#2a3038'; ctx.beginPath(); ctx.arc(hx-0.6,hy-0.9,6.3,Math.PI*0.86,Math.PI*1.93); ctx.closePath(); ctx.fill();   // hair
  ctx.beginPath(); ctx.moveTo(hx-6.4,hy-1); ctx.quadraticCurveTo(hx-8.5,hy+3.5,hx-4.2,hy+4.5); ctx.lineTo(hx-3.5,hy-1); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#16191d';                                     // eye (blinks)
  if(PA.blink<0) ctx.fillRect(hx+1.6,hy+0.7,2.4,0.8); else ctx.fillRect(hx+2,hy-0.9,1.9,2.9);
  leg(1,'#3d4654','#22272b');
  arm(1,'#e8e4dc','#e9c9a8');
  const A=p.arms[1];
  if(p.sword){ ctx.save(); ctx.translate(A[2],A[3]); ctx.rotate(Math.atan2(p.sword[1],p.sword[0])); drawSwordBlade(SW.reach-13,SW.elem); ctx.restore(); }
  if(p.held){ ctx.restore(); const wx=fx+f*sx*A[2], wy=fy+sy*A[3];         // the sphere, ready in his hand
    drawSphereBody({kind:G.sphereKind,x:wx+f*3,y:wy-1,r:4.2,layers:1,scale:1,stuck:null,frozen:false,vx:0,vy:0,spin:clock*3}); }
  else ctx.restore();
  ctx.lineCap='butt'; ctx.lineJoin='miter'; ctx.globalAlpha=a0;
}
/* the thrust: a straight lance of light along the blade's line — bright core, tinted edge, a couple of speed lines and
   a spark at the point. It hangs for an instant after the stab and fades (fire and ice swords tint it) */
function drawSlashes(){
  const cx=P.x+P.w/2, cy=P.y+P.h/2-SW_UP;
  for(const f of slashFx){
    const ext=f.live&&thrustLive()?thrustExt():f.ext, fade=f.live?1:Math.max(0,1-f.t/0.12);
    const L=(SW.reach+3)*ext; if(L<14) continue;
    const col=({none:'232,228,220',fire:'245,160,74',ice:'191,230,255'})[f.elem]||'232,228,220';
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.atan2(f.ay,f.ax));
    const lance=(w,a,c)=>{ ctx.fillStyle='rgba('+c+','+(a*fade)+')'; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(L*0.55,-w); ctx.lineTo(L+3,0); ctx.lineTo(L*0.55,w); ctx.closePath(); ctx.fill(); };
    lance(SW.width*(f.live?1:0.5+0.5*fade),0.38,col);          // the lane it cuts
    lance(2.6,0.95,'255,255,255');                             // hot core
    ctx.strokeStyle='rgba(255,255,255,'+(0.55*fade)+')'; ctx.lineWidth=1;                     // speed lines trailing the point
    for(let i=0;i<3;i++){ const o=(i-1)*5.5+Math.sin(f.seed+i)*1.5, a=L*(0.25+0.12*((f.seed*7+i*3)%3)); ctx.beginPath(); ctx.moveTo(a,o); ctx.lineTo(L*0.82,o*0.5); ctx.stroke(); }
    if(f.live&&ext>0.98){                                      // spark at the point when it lands
      ctx.fillStyle='rgba(255,255,255,'+fade+')'; ctx.beginPath();
      ctx.moveTo(L+8,0); ctx.lineTo(L+1,-1.8); ctx.lineTo(L-1,-6); ctx.lineTo(L-2.5,-1.8); ctx.lineTo(L-8,0); ctx.lineTo(L-2.5,1.8); ctx.lineTo(L-1,6); ctx.lineTo(L+1,1.8); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}
/* the player, and the teleport: he thins into a streak toward the sphere, then snaps back into shape where it was */
function drawPlayer(){
  if(dying>0) return;
  if(warp){
    const k=warp.t/warp.dur, cx=P.x+P.w/2, cy=P.y+P.h/2;
    if(!warp.moved){
      const a=Math.min(1,k*2);
      const g=ctx.createLinearGradient(cx,cy,warp.sx,warp.sy);
      g.addColorStop(0,'rgba(159,216,255,'+(0.75*a)+')'); g.addColorStop(1,'rgba(159,216,255,0.1)');
      ctx.strokeStyle=g; ctx.lineWidth=2+7*a; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+(warp.sx-cx)*a,cy+(warp.sy-cy)*a); ctx.stroke(); ctx.lineCap='butt';
      const w=P.w*(1-0.85*a), h=P.h*(1+0.35*a);

      ctx.fillStyle='#9fd8ff'; ctx.globalAlpha=a; ctx.fillRect(cx-w/2,cy-h/2,w,h); ctx.globalAlpha=1;

      ctx.strokeStyle='rgba(159,216,255,'+(0.5*(1-b))+')'; ctx.lineWidth=1;                // fading after-image where you were
      ctx.strokeRect(ox-P.w/2+.5,oy-P.h/2+.5,P.w-1,P.h-1);
      ctx.strokeStyle='rgba(159,216,255,'+(1-b)+')'; ctx.lineWidth=3*(1-b)+0.5;              // shockwave ring where you land
      ctx.beginPath(); ctx.arc(cx,cy,8+34*b,0,7); ctx.stroke();
      const w=P.w*(0.15+0.85*b), h=P.h*(1.35-0.35*b);
      ctx.fillStyle='#9fd8ff'; ctx.globalAlpha=1-b; ctx.fillRect(cx-w/2,cy-h/2,w,h); ctx.globalAlpha=1;
      ctx.save(); ctx.translate(cx,cy); ctx.scale(0.2+0.8*b,1.3-0.3*b); ctx.translate(-cx,-cy); drawPlayerBody(b); ctx.restore();
    }
    return;
  }
  drawPlayerBody(P.inv>0&&P.inv<900&&Math.floor(P.inv*14)%2?0.35:1);
}
function drawExplosion(e){
  const k=e.t/0.5, ease=1-Math.pow(1-Math.min(1,k*1.6),3);
  const g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.R*(0.35+0.65*ease));
  g.addColorStop(0,'rgba(255,241,184,'+Math.max(0,1-k*1.4)+')');
  g.addColorStop(0.45,'rgba(245,160,74,'+Math.max(0,0.85-k)+')');
  g.addColorStop(1,'rgba(216,74,47,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(e.x,e.y,e.R*(0.35+0.65*ease),0,7); ctx.fill();
  ctx.strokeStyle='rgba(255,241,184,'+Math.max(0,1-k)+')'; ctx.lineWidth=4*(1-k)+0.5;
  ctx.beginPath(); ctx.arc(e.x,e.y,e.R*(0.2+1.0*ease),0,7); ctx.stroke();
}

/* ---------- render ---------- */
function draw(backdrop){
  artW=VW;
  ctx.setTransform(RS,0,0,RS,0,0);
  ctx.fillStyle='#050607'; ctx.fillRect(0,0,VIEW_W,VIEW_H);                 // border around small rooms
  const sk0=opts.shake?shake:0, sx=sk0>0?(Math.random()-0.5)*sk0*16:0, sy=sk0>0?(Math.random()-0.5)*sk0*16:0;
  ctx.setTransform(RS*cam.z,0,0,RS*cam.z,RS*(cam.ox+sx),RS*(cam.oy+sy));
  ctx.fillStyle='#0d0f11'; ctx.fillRect(0,0,VW*TILE,VH*TILE);
  for(const [x,y,v,top] of bgList) drawBgCell(v,x,y,top);          // background blocks: behind everything, no collision

  for(let y=0;y<grid.length;y++)for(let x=0;x<grid[y].length;x++){
    const ch=grid[y][x], px=x*TILE, py=y*TILE, sk=skin[y][x];
    if(sk&&ch===baseOf(sk)){                                // an imported tile (still in its own state)
      const c=ch==='B'&&crumble[x+','+y], sh=c&&c.state==='shake'?1-Math.max(0,c.t)/T.crumbleTime:0;
      drawCustom(sk,px+(sh?(Math.random()-0.5)*4*sh:0),py+sh*2,c&&c.state==='back'?1-c.t/0.3:1);
    }
    else if(ch==='D') drawDoorTile(px,py,doorCol(doorAt[x+','+y]),keyholeAt[x+','+y]);
    else if(ch==='J'){ const d=ldoorAt[x+','+y], need=d?d.need:1;
      drawLdoorTile(px,py,need,!d||(d.mid[0]===x&&d.mid[1]===y),G.hasTPS&&!noTPS()&&maxLayers(G.sphereKind)>=need,d?d.flash:0); }
    else if(ch==='B'){
      const c=crumble[x+','+y];
      drawBreakable(px,py,hash(x,y),c&&c.state==='shake'?1-Math.max(0,c.t)/T.crumbleTime:0,c&&c.state==='back'?1-c.t/0.3:1);
    }
    else if(ch==='_'){ if(T.crumbleRespawn>0) drawBrokenSpot(px,py); }
    else drawTileBase(ch,px,py,false,y>0?grid[y-1][x]:'#',ch==='#'&&room.wallCol?room.wallCol[x+','+y]:undefined);
  }
  for(const p of planks) drawPlank(p);
  for(const f of doorFx){                   // door panels retract upward
    const k=f.t/0.45;
    ctx.globalAlpha=1-k; ctx.fillStyle=f.col;
    for(const [tx,ty] of f.tiles) ctx.fillRect(tx*TILE+3,ty*TILE,TILE-6,TILE*(1-k));
    ctx.globalAlpha=1;
  }
  for(const f of ldoorFx){                  // layer door: the vault panels shrink into the lock, a ring rolls out
    const k=f.t/0.9, mid=f.tiles[Math.floor((f.tiles.length-1)/2)], mx=mid[0]*TILE+16, my=mid[1]*TILE+16;
    ctx.globalAlpha=Math.max(0,1-k*1.8); ctx.fillStyle='#2a2148';
    for(const [tx,ty] of f.tiles){ const i=Math.min(15,k*22); ctx.fillRect(tx*TILE+i,ty*TILE+i,TILE-2*i,TILE-2*i); }
    ctx.globalAlpha=Math.max(0,1-k); ctx.strokeStyle='#a58aff'; ctx.lineWidth=3*(1-k)+0.5;
    for(let i=0;i<Math.min(5,f.need);i++){ ctx.beginPath(); ctx.arc(mx,my,8+k*(40+i*14),0,7); ctx.stroke(); }
    ctx.globalAlpha=1;
  }
  for(const l of linkFx){
    ctx.globalAlpha=1-l.t/0.7; ctx.strokeStyle=l.col; ctx.lineWidth=2; ctx.setLineDash([6,5]);
    ctx.beginPath(); ctx.moveTo(l.x1,l.y1); ctx.lineTo(l.x2,l.y2); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
  }

  for(const s of spikes){
    if(s.state==='gone') continue;
    if(s.state==='hung'){ drawDropSpike(s.x,s.y,s.w,s.h,s.x*0.013); continue; }
    ctx.fillStyle = s.state==='landed'?'#5a6169':'#7d858d';
    ctx.beginPath();
    if(s.state==='landed'){ ctx.rect(s.x-4,s.y,s.w+8,s.h); }
    else { ctx.moveTo(s.x,s.y); ctx.lineTo(s.x+s.w,s.y); ctx.lineTo(s.x+s.w/2,s.y+s.h); }
    ctx.fill();
  }

  drawWorldBack();
  for(const p of pickups){
    if(p.k==='key') drawKey(p.x+8,p.y+8,doorCol(p.id),p.x*0.1);
    else drawPickup(p.k,p.x+8,p.y+8,p.x*0.07);
  }

  for(const m of mobs){
    if(!m.alive) continue;
    if(m.t==='absorber') drawAbsorber(m.cx,m.cy,m.pull,m.gulp,m.flash,tps&&!tps.cap?0.3:0.12);
    else if(m.t==='brute') drawBrute(m);
    else if(m.t==='turret') drawTurret(m.x,m.y,m.w,m.h,Math.max(0,1-m.cd/1.5),m.flash);
    else if(m.t==='flyer') drawFlyer(m);
    else if(m.t==='guard') drawGuard(m);
    else if(m.t==='slugger'){ drawSlugger(m); continue; }
    else {
      drawEater(m.x,m.y,m.w,m.h,m.stun>0||m.fed>0,m.flash,m.x*0.05);
      if(m.stun>0){ ctx.fillStyle='#e0c04a'; ctx.fillRect(m.x+8,m.y-8,m.w-16,3); }
    }
    if(m.maxhp>1&&m.hp<m.maxhp){           // health pips once damaged
      const pw=6, gap=2, tot=m.maxhp*(pw+gap)-gap, sx2=m.x+m.w/2-tot/2;
      for(let i=0;i<m.maxhp;i++){ ctx.fillStyle=i<m.hp?'#d84a2f':'#3a3f45'; ctx.fillRect(sx2+i*(pw+gap),m.y-9,pw,3); }
    }
  }

  if(boss&&boss.hp>0&&boss.target&&boss.target.state==='hung'){   // telegraph: the column he's heading for
    const cx=boss.target.x+boss.target.w/2;
    ctx.strokeStyle= boss.state==='dash' ? '#6b7076' : '#d84a2f';
    ctx.lineWidth=1; ctx.setLineDash([5,6]);
    ctx.beginPath(); ctx.moveTo(cx,boss.target.y+26); ctx.lineTo(cx,boss.y); ctx.stroke();
    ctx.setLineDash([]);
  }
  if(boss&&(boss.hp>0||boss.dieT>0)) drawBoss(boss);
  drawWorldFront();

  for(const s of shards){
    if(s.src==='flyer'){ ctx.fillStyle='#9aa0a6'; ctx.beginPath(); ctx.arc(s.x,s.y,3.5,0,7); ctx.fill(); }
    else if(s.src==='boss'){
      ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(Math.atan2(s.vy,s.vx));
      ctx.fillStyle='#4a3526'; ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(-9,-2.6); ctx.lineTo(-9,2.6); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#d8c3a0'; ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(1,-1.3); ctx.lineTo(1,1.3); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    else if(s.src==='serve'){                                  // his serve: a stitched ball
      ctx.fillStyle='#f2efe6'; ctx.beginPath(); ctx.arc(s.x,s.y,4.5,0,7); ctx.fill();
      ctx.strokeStyle='#c8372d'; ctx.lineWidth=1; const a=clock*18;
      ctx.beginPath(); ctx.arc(s.x-2.6,s.y,3.2,a-0.9,a+0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(s.x+2.6,s.y,3.2,a+Math.PI-0.9,a+Math.PI+0.9); ctx.stroke();
    }
    else { ctx.fillStyle='#d84a2f'; ctx.fillRect(s.x-3,s.y-3,6,6); }
  }
  for(const e of explosions) drawExplosion(e);

  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);
  }
  ctx.globalAlpha=1;

  if(G.hasTPS&&M.aiming&&!warp&&!noTPS()){
    const [ax,ay]=aimVector(true), pcx=P.x+P.w/2, pcy=P.y+P.h/2, ready=!tps&&recharge<=0;
    const ac=sphCol(G.sphereKind);
    for(let i=0;i<8;i++){                                       // the 8 GDD directions
      const a=i*Math.PI/4, dx=Math.cos(a), dy=Math.sin(a), on=Math.abs(dx-ax)<0.01&&Math.abs(dy-ay)<0.01;
      ctx.fillStyle=on?(ready?ac:'#6b7076'):'rgba(154,160,166,.35)';
      ctx.beginPath(); ctx.arc(pcx+dx*34,pcy+dy*34,on?4:2,0,7); ctx.fill();
    }
    if(ready){
      ctx.globalAlpha=.4; ctx.fillStyle=ac;
      for(let i=3;i<=9;i++) ctx.fillRect(pcx+ax*i*15-2,pcy+ay*i*15-2,4,4);
      ctx.globalAlpha=1;
    }
  }

  if(backdrop!==true) drawSlashes();

  if(tps&&backdrop!==true) drawSphereBody(tps);
  if(backdrop!==true&&!(board&&board.t>0.45)&&!(travelFx&&!travelFx.moved&&travelFx.t>0.25)) drawPlayer();

  for(let y=0;y<grid.length;y++)for(let x=0;x<grid[y].length;x++)
    if(grid[y][x]==='W'){
      const sk=skin[y][x];
      if(sk&&baseOf(sk)==='W') drawCustom(sk,x*TILE,y*TILE,0.45); else drawWater(x*TILE,y*TILE,y>0?grid[y-1][x]:'#',0,true);
    }

  // ---- screen space: cursor, HUD, prompts, map, messages ----
  ctx.setTransform(RS,0,0,RS,0,0);
  if(backdrop===true) return;
  if(dying>0){                                              // death: the screen dims, then the room restarts
    const k=1-dying/DIE_T;
    ctx.fillStyle='rgba(8,9,11,'+(0.75*k*k).toFixed(3)+')'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  }
  if(M.aiming&&!noTPS()){
    ctx.strokeStyle=sphCol(G.sphereKind); ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(M.x,M.y,7,0,7); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(M.x-11,M.y); ctx.lineTo(M.x-3,M.y);
    ctx.moveTo(M.x+3,M.y); ctx.lineTo(M.x+11,M.y);
    ctx.moveTo(M.x,M.y-11); ctx.lineTo(M.x,M.y-3);
    ctx.moveTo(M.x,M.y+3); ctx.lineTo(M.x,M.y+11);
    ctx.stroke();
  }
  if(backdrop!=='hud'){ drawHUD(); if(backdrop!=='paused') drawBossBar(); }
  if(backdrop==='paused'||backdrop==='hud') return;       // under the pause menu / HUD layout: no prompts or messages
  if(!talk&&!travelUI) drawTut();
  drawPrompt(); drawTalk();
  drawToasts(toasts);
  drawTravelFx();
}
/* ---------- HUD: two pieces you can put anywhere (health; sphere + sword) and one opacity for both ----------
   The designer's layout comes with the build (BOOT.hud); players can change it from Options (saved in their browser). */
const HUD_DEF={health:[8,8],gear:[8,38],alpha:1};
const hudL=JSON.parse(JSON.stringify(HUD_DEF));
function setHud(o){
  if(!o||typeof o!=='object') return;
  for(const k of ['health','gear']) if(Array.isArray(o[k])&&o[k].length===2&&o[k].every(Number.isFinite)) hudL[k]=[o[k][0],o[k][1]];
  if(Number.isFinite(o.alpha)) hudL.alpha=Math.max(0.1,Math.min(1,o.alpha));
}
setHud(BOOT.hud);
const hudEdit={on:false,drag:null,off:[0,0],back:null};
/* where each piece is and how big it is right now (the sphere/sword piece only shows once you have one of them) */
function hudRects(all){
  const hw=G.maxHp*17+10, showGear=all||G.hasTPS||SW.elem!=='none'||showParts();
  let gw=0;
  if(showGear){
    ctx.font='11px system-ui'; gw=12;
    if(G.hasTPS||all) gw+=26+ctx.measureText(noTPS()?'off':'×'+(tps?tps.layers:maxLayers(G.sphereKind))).width;
    if(G.sphereKind!=='normal') gw+=ctx.measureText(G.sphereKind).width+8;
    if(SW.elem!=='none'||all) gw+=ctx.measureText(SW.elem==='none'?'sword':SW.elem).width+8;
    if(showParts()) gw+=24+ctx.measureText(jetHave()+'/'+jetNeed()).width;
  }
  const at=(k,w,h)=>{ const x=Math.max(0,Math.min(VIEW_W-w,hudL[k][0])), y=Math.max(0,Math.min(VIEW_H-h,hudL[k][1])); return {k,x,y,w,h}; };
  return {health:at('health',hw,24),gear:showGear?at('gear',Math.max(44,gw),24):null};
}
function drawHUD(){
  const R=hudRects(hudEdit.on), [p0x,p0y]=toScreen(P.x,P.y), [p1x,p1y]=toScreen(P.x+P.w,P.y+P.h);
  const fade=r=>hudEdit.on?1:(p1x>r.x-6&&p0x<r.x+r.w+6&&p1y>r.y-6&&p0y<r.y+r.h+6?0.3:1);   // see-through while you're behind it
  const panel=r=>{ ctx.globalAlpha=hudL.alpha*fade(r); ctx.fillStyle='rgba(13,15,17,.72)'; ctx.fillRect(r.x,r.y,r.w,r.h); };
  const h=R.health; panel(h);
  for(let i=0;i<G.maxHp;i++) drawHeart(h.x+12+i*17,h.y+12,6.5,i<P.hp?'#e05a6a':'#3a3f45');
  const g=R.gear;
  if(g){
    panel(g);
    const x=g.x+12, y=g.y+12; let lx=x-5;
    ctx.font='11px system-ui';
    if(G.hasTPS||hudEdit.on){
      const layers=maxLayers(G.sphereKind);
      ctx.fillStyle='#22272b'; ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.fill();
      if(tps){ ctx.strokeStyle=sphCol(tps.kind); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,6,0,7); ctx.stroke(); }
      else {
        const full=recharge<=0, k=full?1:1-Math.max(0,recharge)/Math.max(0.01,T.rechargeBreak);
        ctx.fillStyle=sphCol(G.sphereKind);
        ctx.beginPath(); ctx.moveTo(x,y); ctx.arc(x,y,7,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,k)); ctx.closePath(); ctx.fill();
      }
      if(noTPS()){                                             // challenge room: the sphere is switched off
        ctx.fillStyle='rgba(13,15,17,.7)'; ctx.beginPath(); ctx.arc(x,y,7.5,0,7); ctx.fill();
        ctx.strokeStyle='#a58aff'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x-6,y+6); ctx.lineTo(x+6,y-6); ctx.stroke();
      }
      const txt=noTPS()?'off':'×'+(tps?tps.layers:layers);
      ctx.fillStyle='#9aa0a6'; ctx.fillText(txt,x+11,y+4); lx=x+11+ctx.measureText(txt).width+8;
      if(G.sphereKind!=='normal'){ ctx.fillStyle=sphCol(G.sphereKind); ctx.fillText(G.sphereKind,lx,y+4); lx+=ctx.measureText(G.sphereKind).width+8; }
    }
    if(SW.elem!=='none'){ ctx.fillStyle=SW.elem==='fire'?'#f08a2a':'#9fd8ff'; ctx.fillText(SW.elem==='fire'?'fire':'ice',lx,y+4); lx+=ctx.measureText(SW.elem==='fire'?'fire':'ice').width+8; }
    else if(hudEdit.on){ ctx.fillStyle='#6b7076'; ctx.fillText('sword',lx,y+4); lx+=ctx.measureText('sword').width+8; }
    if(showParts()){ drawPartsIcon(lx+6,y); ctx.fillStyle='#e0c04a'; ctx.fillText(jetHave()+'/'+jetNeed(),lx+16,y+4); }
  }
  ctx.globalAlpha=1;
  if(roomCard&&roomCard.t<3&&!hudEdit.on){
    const a=Math.min(1,roomCard.t*3,(3-roomCard.t)/0.6);
    ctx.globalAlpha=Math.max(0,a); ctx.fillStyle='#e8e4dc'; ctx.font='600 13px system-ui'; ctx.textAlign='center';
    ctx.fillText(roomCard.text,VIEW_W/2,22); ctx.textAlign='left'; ctx.globalAlpha=1;
  }
}
/* HUD layout mode: the game holds still, the pieces get outlines and can be dragged; arrows change the opacity */
function openHudEdit(back){ hudEdit.on=true; hudEdit.drag=null; hudEdit.back=back||null; M.aiming=false; for(const k in keys) keys[k]=false; }
function closeHudEdit(){
  hudEdit.on=false; hudEdit.drag=null; cv.style.cursor='';
  if(api.onHudChange) api.onHudChange(); else if(api.menuEnabled){ opts.hud=JSON.parse(JSON.stringify(hudL)); writeJSON(OPTS_KEY,opts); }
  const b=hudEdit.back; hudEdit.back=null; if(b) b();
}
function hudAt(x,y){ const R=hudRects(true); for(const r of [R.gear,R.health]) if(r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h) return r; return null; }
function hudMouse(type){
  if(type==='down'){ const r=hudAt(M.x,M.y); if(r){ hudEdit.drag=r.k; hudEdit.off=[M.x-r.x,M.y-r.y]; } }
  else if(type==='up') hudEdit.drag=null;
  if(hudEdit.drag&&type!=='up'){
    const R=hudRects(true), r=R[hudEdit.drag];
    let x=Math.round((M.x-hudEdit.off[0])/2)*2, y=Math.round((M.y-hudEdit.off[1])/2)*2;
    const snap=(v,t)=>Math.abs(v-t)<10?t:v;                  // edges and the other piece pull a little
    x=snap(snap(x,8),VIEW_W-8-r.w); y=snap(snap(y,8),VIEW_H-8-r.h);
    const o=R[hudEdit.drag==='health'?'gear':'health']; if(o){ x=snap(x,o.x); y=snap(y,o.y+o.h+6); y=snap(y,o.y-r.h-6); }
    hudL[hudEdit.drag]=[Math.max(0,Math.min(VIEW_W-r.w,x)),Math.max(0,Math.min(VIEW_H-r.h,y))];
  }
  cv.style.cursor=hudEdit.drag?'grabbing':hudAt(M.x,M.y)?'grab':'';
}
function hudKey(e){
  e.preventDefault();
  if(e.code==='Escape'||e.code==='Enter'||e.code==='NumpadEnter') closeHudEdit();
  if(e.code==='ArrowLeft'||e.code==='ArrowDown') hudL.alpha=Math.max(0.1,Math.round((hudL.alpha-0.1)*10)/10);
  if(e.code==='ArrowRight'||e.code==='ArrowUp') hudL.alpha=Math.min(1,Math.round((hudL.alpha+0.1)*10)/10);
  if(e.code==='KeyR'){ const a=hudL.alpha; setHud(Object.assign(JSON.parse(JSON.stringify(BOOT.hud||HUD_DEF)),{alpha:a})); }
}
function drawHudEdit(){
  ctx.setTransform(RS,0,0,RS,0,0);
  ctx.fillStyle='rgba(8,9,11,.45)'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  drawHUD();
  const R=hudRects(true);
  for(const r of [R.health,R.gear]){
    if(!r) continue;
    const on=hudEdit.drag===r.k||hudAt(M.x,M.y)===r||(hudAt(M.x,M.y)&&hudAt(M.x,M.y).k===r.k);
    ctx.strokeStyle=on?'#e8e4dc':'#5aaaff'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]); ctx.lineDashOffset=-clock*20;
    ctx.strokeRect(r.x-3.5,r.y-3.5,r.w+7,r.h+7); ctx.setLineDash([]); ctx.lineDashOffset=0;
    ctx.font='10px system-ui'; ctx.fillStyle='#9fd8ff';
    const lab=r.k==='health'?'health':'sphere & sword', lw=ctx.measureText(lab).width, right=r.x+r.w+10+lw<VIEW_W;
    ctx.fillText(lab,right?r.x+r.w+10:r.x-10-lw,r.y+r.h/2+3.5);            // beside the piece, never on top of the other one
  }
  const msg='Drag the HUD pieces  ·  ← → opacity '+Math.round(hudL.alpha*100)+'%  ·  R reset  ·  Enter when done';
  ctx.font='13px system-ui'; const w=ctx.measureText(msg).width+28, bx=400-w/2, by=VIEW_H-58;
  ctx.fillStyle='rgba(13,15,17,.92)'; ctx.fillRect(bx,by,w,30); ctx.strokeStyle='#5aaaff'; ctx.lineWidth=1; ctx.strokeRect(bx+.5,by+.5,w-1,29);
  ctx.fillStyle='#e8e4dc'; ctx.textAlign='center'; ctx.fillText(msg,400,by+20); ctx.textAlign='left';
}
/* short messages across the top of the screen (also used by the editor) */
function drawToasts(list){
  list.forEach((t,i)=>{
    const a=Math.min(1,t.t*6,Math.max(0,(2.6-t.t)/0.5));
    ctx.globalAlpha=a; ctx.font='13px system-ui';
    const w=ctx.measureText(t.text).width+24, x=400-w/2, y=40+i*30-(1-Math.min(1,t.t*6))*8;

    ctx.strokeStyle=t.col; ctx.lineWidth=1; ctx.strokeRect(x+.5,y+.5,w-1,23);

function menuLayout(){
  const n=menu.items.length, gap=menu.screen==='title'?40:36;
  const y0=menu.screen==='title'?272:menu.screen==='controls'?420:menu.screen==='confirm'?262:menu.screen==='pause'?214:Math.max(190,250-n*gap/2+gap/2);
  return menu.items.map((it,i)=>({x:400-150,y:y0+i*gap-17,w:300,h:34,cy:y0+i*gap}));
}
function menuItemAt(x,y){ const L=menuLayout(); for(let i=0;i<L.length;i++){ const r=L[i]; if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h) return i; } return -1; }
function menuKey(e){
  const c=e.code;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','KeyW','KeyS','Escape','Backspace','KeyJ'].includes(c)) e.preventDefault();
  if(e.repeat&&(c==='Enter'||c==='Space')) return;
  if(c==='ArrowUp'||c==='KeyW'){ menu.sel=(menu.sel-1+menu.items.length)%menu.items.length; SFX.play('uiMove'); }
  else if(c==='ArrowDown'||c==='KeyS'){ menu.sel=(menu.sel+1)%menu.items.length; SFX.play('uiMove'); }
  else if(c==='Enter'||c==='NumpadEnter'||c==='Space'||c==='KeyJ'){ const it=menu.items[menu.sel]; if(it){ if(!it.value||it.label!=='Sound effects') SFX.play(it.label==='Back'||it.label==='Cancel'?'uiBack':'uiSelect'); it.act(); } }
  else if((c==='ArrowLeft'||c==='ArrowRight')&&menu.items[menu.sel]&&menu.items[menu.sel].value){
    const it=menu.items[menu.sel]; if(c==='ArrowLeft'&&it.left) it.left(); else if(c==='ArrowRight'&&it.right) it.right(); else it.act(); }
  else if(c==='Escape'||c==='Backspace'||(c==='KeyP'&&menu.root==='pause')){ if(!(menu.screen===menu.root&&menu.root==='pause')) SFX.play('uiBack'); back(); }
}
function menuMouse(down){
  const i=menuItemAt(M.x,M.y);
  if(i>=0&&i!==menu.sel){ menu.sel=i; SFX.play('uiMove'); }
  cv.style.cursor=i>=0?'pointer':'';
  if(down&&i>=0){ const it=menu.items[i]; if(!it.value||it.label!=='Sound effects') SFX.play(it.label==='Back'||it.label==='Cancel'?'uiBack':'uiSelect'); it.act(); }
}
function stepMenu(dt){
  menu.t+=dt;
  if(!menu.orb) menu.orb={x:150,y:360,vx:170,vy:-120,kind:0,warp:2.2};
  const o=menu.orb;                                      // the attract sphere: drifts, bounces, and every few seconds warps
  o.x+=o.vx*dt; o.y+=o.vy*dt;
  if(o.x<20||o.x>780){ o.vx*=-1; o.x=Math.max(20,Math.min(780,o.x)); }
  if(o.y<20||o.y>460){ o.vy*=-1; o.y=Math.max(20,Math.min(460,o.y)); }
  menu.trail.push([o.x,o.y]); if(menu.trail.length>16) menu.trail.shift();
  o.warp-=dt;
  if(o.warp<=0){
    const nx=40+Math.random()*720, ny=Math.random()<0.5?40+Math.random()*120:340+Math.random()*110;
    menu.rings.push({x:o.x,y:o.y,t:0,x2:nx,y2:ny}); if(menu.screen==='title') SFX.play('titleWarp',{sx:nx});
    o.x=nx; o.y=ny; const a=Math.random()*Math.PI*2; o.vx=Math.cos(a)*180; o.vy=Math.sin(a)*140;
    o.kind=(o.kind+1)%3; o.warp=2.4+Math.random()*1.4; menu.trail=[];
  }
  for(let i=menu.rings.length-1;i>=0;i--){ menu.rings[i].t+=dt; if(menu.rings[i].t>0.8) menu.rings.splice(i,1); }
  if(!menu.motes.length) for(let i=0;i<46;i++) menu.motes.push({x:Math.random()*800,y:Math.random()*480,v:6+Math.random()*16,p:Math.random()*6,s:Math.random()<0.2?2:1});
  for(const m of menu.motes){ m.y-=m.v*dt; if(m.y<-4){ m.y=484; m.x=Math.random()*800; } }
}
let logoLayers=null;                       // the title pre-drawn (calm and glitched) plus a white copy for the sheen, once per size/scale
function logoLayersFor(size,k){
  const key=size+'|'+k+'|'+GAME_TITLE;
  if(logoLayers&&logoLayers.key===key) return logoLayers;
  const font='900 '+size+'px "Segoe UI",system-ui,sans-serif', txt=GAME_TITLE.split(''), sp=size*0.14;
  const m=document.createElement('canvas').getContext('2d'); m.font=font;
  const ws=txt.map(ch=>m.measureText(ch).width), tot=ws.reduce((a,b)=>a+b,0)+sp*(txt.length-1);
  const W=Math.ceil(tot+size*0.9), H=Math.round(size*1.9);                  // cropped to the letters plus room for the glow
  const mk=()=>{ const c=document.createElement('canvas'); c.width=Math.round(W*k); c.height=Math.round(H*k); return c; };
  const paint=(g,col,dx,blur)=>{
    g.setTransform(k,0,0,k,0,0); g.font=font; g.textBaseline='middle'; g.fillStyle=col;
    if(blur){ g.shadowColor='rgba(47,122,216,.75)'; g.shadowBlur=blur*k; } else g.shadowBlur=0;
    let x=W/2-tot/2+dx; txt.forEach((ch,i)=>{ g.fillText(ch,x,H/2); x+=ws[i]+sp; });
  };
  const layer=split=>{
    const c=mk(), g=c.getContext('2d');
    g.globalCompositeOperation='lighter'; paint(g,'rgba(74,200,224,.55)',-split,0); paint(g,'rgba(216,74,47,.5)',split,0);
    g.globalCompositeOperation='source-over'; paint(g,'#e8e4dc',0,18);
    return c;
  };
  const white=mk(); paint(white.getContext('2d'),'#ffffff',0,0);
  logoLayers={key,W,H,calm:layer(1.8),glitch:layer(5),white,tot};
  return logoLayers;
}
/* the title: wide-spaced heavy letters with a blue/red split that twitches now and then, and a light sheen passing over */
function drawLogo(cx,cy,size){
  const k=RS, Lg=logoLayersFor(size,k), {W,H}=Lg, x0=cx-W/2, y0=cy-H/2, t=menu.t, glitch=(t%3.7)<0.2;
  if(glitch){                                               // a slice of the letters jumps sideways for a moment
    const im=Lg.glitch, f=((Math.floor(t*30)*0.37)%1)*0.6+0.2, sh=6, sy=Math.floor(H*f), dx=Math.sin(t*90)*6, cw=im.width, ch=im.height;
    ctx.drawImage(im,0,0,cw,sy*k,x0,y0,W,sy);
    ctx.drawImage(im,0,sy*k,cw,sh*k,x0+dx,y0+sy,W,sh);
    ctx.drawImage(im,0,(sy+sh)*k,cw,ch-(sy+sh)*k,x0,y0+sy+sh,W,H-sy-sh);
  } else ctx.drawImage(Lg.calm,x0,y0,W,H);
  const bx=((t*0.28)%1.7-0.35)*W;                           // sheen: thin white slices of the letters, brightest in the middle
  for(let i=-6;i<=6;i++){
    const sx=Math.round(bx+i*10); if(sx<0||sx+10>W) continue;
    ctx.globalAlpha=0.5*(1-Math.abs(i)/7);
    ctx.drawImage(Lg.white,sx*k,0,10*k,Lg.white.height,x0+sx,y0,10,H);
  }
  ctx.globalAlpha=1;
  return Lg.tot;
}

  edge(0,0,0,110,0,0,VIEW_W,110); edge(0,VIEW_H,0,VIEW_H-110,0,VIEW_H-110,VIEW_W,110);

}

/* =====================================================================
   THE CRASH SITE — your jet (j), the parts it's missing (p), people who need a favour (c)
   and fast-travel capsules (f). W / ↑ talks, boards the jet and opens a capsule.
   room.npc = {"x,y": {name, ask:[lines], thanks:[lines], gives:'part'|'none'}}
   An NPC's favour: the cracked (bomb) wall nearest to him in his room has to be blown up.
   ===================================================================== */
let jetSite=null, npcs=[], caps=[], talk=null, travelUI=null, travelFx=null, board=null, prompt=null, needCache=null;
const NPC_DEF={name:'Mechanic',gives:'part',
  ask:['Hey! Over here — behind the rocks!',
       'Your jet came down hard. The crash brought half the cliff down and sealed me in here.',
       'This cracked wall won’t budge. Find something that can blow it apart and I’ll give you this — a piece of your jet landed right next to me.'],
  thanks:['You did it — fresh air at last!',
          'Here, this is yours. Your jet needs it more than I do.',
          'Good luck up there. I’m getting out before anything else falls on me.']};
const plainText=s=>String(s||'').replace(/<[^>]+>/g,'');
const rawBase=c=>CUSTOM[c]?CUSTOM[c].base:c;
function npcData(r,x,y){
  const d=(r&&r.npc&&r.npc[x+','+y])||{};
  const lines=v=>{ const a=Array.isArray(v)?v.map(s=>String(s).trim()).filter(Boolean).slice(0,8):[]; return a.length?a:null; };
  return {name:String(d.name||NPC_DEF.name).slice(0,24),gives:d.gives==='none'?'none':'part',
          ask:lines(d.ask)||NPC_DEF.ask.slice(),thanks:lines(d.thanks)||NPC_DEF.thanks.slice()};
}
/* the cracked wall he wants gone: the group of touching bomb-wall tiles nearest to him, in the room as it was built */
function npcWallOf(r,x,y){
  const g=r.grid, seen={}; let best=null, bd=Infinity;
  for(let yy=0;yy<g.length;yy++) for(let xx=0;xx<g[yy].length;xx++){
    if(rawBase(g[yy][xx])!=='E'||seen[xx+','+yy]) continue;
    const cells=[], st=[[xx,yy]]; seen[xx+','+yy]=1;
    while(st.length){
      const [a,b]=st.pop(); cells.push([a,b]);
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=a+dx, ny=b+dy, k=nx+','+ny;
        if(seen[k]||!g[ny]||g[ny][nx]===undefined||rawBase(g[ny][nx])!=='E') continue;
        seen[k]=1; st.push([nx,ny]);
      }
    }
    const d=Math.min(...cells.map(([a,b])=>Math.hypot(a-x,b-y)));
    if(d<bd){ bd=d; best=cells; }
  }
  return bd<=12?best:null;                                   // a wall right across the room isn't his
}
/* how many parts the jet needs: every jet-part tile in the game plus every NPC who hands one over */
function jetNeed(){
  if(needCache!==null) return needCache;
  let n=0;
  for(const r of Object.values(ROOMS)){
    r.grid.forEach((row,y)=>{ for(let x=0;x<row.length;x++){ const c=row[x]; if(c==='p') n++; else if(c==='c'&&npcData(r,x,y).gives==='part') n++; } });
    for(const [k,c] of Object.entries(r.under||{})){
      if(c==='p') n++;
      else if(c==='c'){ const [x,y]=k.split(',').map(Number); if(npcData(r,x,y).gives==='part') n++; }
    }
  }
  return needCache=n;
}
const jetHave=()=>Math.min(G.jetParts|0,jetNeed());
const jetLanding=()=>{ const L=JET.LAND; return L&&ROOMS[L.room]?L.room:null; };
/* after the flight the wreck is gone from the crash site when you landed somewhere else */
const jetGone=()=>G.jetDone&&jetLanding()&&jetSite&&jetLanding()!==roomId;

function makeNpc(x,y,key){
  return {tx:x,ty:y,x:x*TILE+16,y:y*TILE+TILE,key,d:npcData(room,x,y),wall:npcWallOf(room,x,y),face:-1,
          state:'idle',t:Math.random()*5,alpha:1,cheer:0,dir:1,walk:0,said:false};
}
const npcFreed=n=>!n.wall||n.wall.every(([x,y])=>!grid[y]||grid[y][x]!=='E');

/* ---------- prompts: the one thing you can use right now ---------- */
const overlaps=(x0,y0,x1,y1)=>P.x+P.w>x0&&P.x<x1&&P.y+P.h>y0&&P.y<y1;
function findPrompt(){
  if(dying>0||warp||board||talk) return null;
  const cx=P.x+P.w/2, cy=P.y+P.h/2; let best=null;
  for(const c of caps){
    if(!overlaps(c.tx*TILE+4,c.ty*TILE-TILE,c.tx*TILE+TILE-4,c.ty*TILE+TILE)) continue;
    best={kind:'cap',o:c,x:c.tx*TILE+16,y:c.ty*TILE-TILE-10,ready:c.on,
          text:c.on?'Fast travel':noTPS()||!G.hasTPS?'Capsule — offline':'Capsule — throw your sphere in'};
  }
  if(!best&&jetSite&&!jetGone()){
    const j=jetSite;
    if(overlaps(j.tx*TILE-24,(j.ty-2)*TILE,j.tx*TILE+5*TILE+8,(j.ty+1)*TILE+4)){
      const need=jetNeed(), have=jetHave(), ok=G.jetDone||have>=need;
      best={kind:'jet',o:j,x:j.tx*TILE+2.3*TILE,y:(j.ty-2)*TILE-8,ready:ok,
            text:G.jetDone?'Fly again':ok?'Repair the jet & take off':'Your jet — parts '+have+' / '+need};
    }
  }
  let nd=112;                                                  // far enough to talk through a one-tile wall
  for(const n of npcs){
    if(n.state!=='idle') continue;
    const d=Math.hypot(n.x-cx,(n.y-22)-cy);
    if(d<nd){ nd=d; best={kind:'npc',o:n,x:n.x,y:n.y-58,ready:true,text:'Talk'}; }
  }
  return best;
}
function interact(){
  const p=prompt; if(!p) return false;
  if(p.kind==='npc') npcTalk(p.o);
  else if(p.kind==='jet'){
    if(p.ready) startBoard();
    else { const left=jetNeed()-jetHave(); SFX.play('deny'); toast('Your jet still needs '+left+' more part'+(left===1?'':'s'),'#e0c04a'); }
  } else if(p.kind==='cap'){
    if(p.o.on) openTravel(p.o);
    else{ SFX.play('deny'); toast(noTPS()?'Capsules run on your sphere — and it doesn’t work in here':!G.hasTPS?'This capsule runs on a sphere. You don’t have one yet':'Throw your sphere into the capsule to power it up','#5ad1e0'); }
  }
  return true;
}

/* ---------- people ---------- */
function npcTalk(n){
  n.face=Math.sign(P.x+P.w/2-n.x)||n.face;
  if(npcFreed(n)){ openTalk(n,n.d.thanks,()=>npcThank(n)); return; }
  if(G.npc[n.key]==='asked') openTalk(n,[n.d.ask[n.d.ask.length-1]]);
  else openTalk(n,n.d.ask,()=>{ G.npc[n.key]='asked'; saveProgress(); });
}
function npcThank(n){
  if(n.d.gives==='part'){
    G.jetParts=(G.jetParts|0)+1;
    const need=jetNeed(), have=jetHave();
    burst(n.x,n.y-30,'#e0c04a',16,140,0.5,0); SFX.play('pickup',{kind:'jetpart',x:n.x});
    toast('Jet part '+have+' / '+need+(have>=need?' — head back to your jet':''),'#e0c04a');
  }
  G.npc[n.key]='done'; n.state='leave'; n.t=0;
  n.dir=n.wall?Math.sign(n.wall.reduce((a,c)=>a+c[0],0)/n.wall.length*TILE+16-n.x)||1:(Math.sign(n.x-(P.x+P.w/2))||1);
  saveProgress();
}
function openTalk(n,lines,onEnd){
  if(!lines||!lines.length){ if(onEnd) onEnd(); return; }
  talk={n,lines,i:0,t:0,onEnd,said:0}; M.aiming=false; for(const k in keys) keys[k]=false;
  SFX.play('talkNext');
}
/* the words appear a letter at a time, with a little voice blip every couple of letters */
function talkTick(dt){
  talk.t+=dt;
  const L=talk.lines[talk.i]||'', shown=Math.min(L.length,Math.floor(talk.t*TALK_CPS));
  if(shown>talk.said){
    const ch=L.charAt(shown-1);
    if(shown-talk.said<6&&/[A-Za-z0-9]/.test(ch)&&shown%3===0){
      const base=talk.n&&talk.n.d&&talk.n.d.name?140+(talk.n.d.name.charCodeAt(0)%7)*14:220;
      SFX.play('blip',{f:base*(1+((ch.charCodeAt(0)*7)%5)*0.06),x:talk.n?talk.n.x:undefined});
    }
    talk.said=shown;
  }
}
const TALK_CPS=48;                                            // letters a second
function talkAdvance(){
  if(!talk) return;
  const L=talk.lines[talk.i];
  if(talk.t*TALK_CPS<L.length){ talk.t=L.length/TALK_CPS+0.01; return; }   // first press finishes the line
  talk.i++; talk.t=0; talk.said=0; SFX.play('talkNext');
  if(talk.i>=talk.lines.length){ const f=talk.onEnd; talk=null; if(f) f(); }
}
function stepNpcs(dt){
  for(const n of npcs){
    n.t+=dt;
    if(n.cheer>0) n.cheer-=dt;
    if(n.state==='idle'){
      const px=P.x+P.w/2, d=Math.hypot(n.x-px,(n.y-22)-(P.y+P.h/2));
      if(d<220) n.face=Math.sign(px-n.x)||n.face;
      if(npcFreed(n)&&G.npc[n.key]!=='done'){
        if(!n.said){ n.said=true; n.cheer=1.2; burst(n.x,n.y-50,'#e8e4dc',8,90,0.4,0); SFX.play('cheer',{x:n.x}); }
        if(d<150&&!talk&&dying<=0&&!warp) npcTalk(n);           // he calls you over the moment you're close
      }
    } else if(n.state==='leave'){                                // off he goes, through the hole you made
      n.face=n.dir; n.walk+=dt*9;
      const ax=n.x+n.dir*12, blocked=blocksPlayer(tileAt(ax,n.y-12))||blocksPlayer(tileAt(ax,n.y-36)), floor=blocksPlayer(tileAt(ax,n.y+4))||tileAt(ax,n.y+4)==='Q';
      if(!blocked&&floor&&n.t<4) n.x+=n.dir*72*dt;
      if(blocked||!floor||n.t>1.8||n.x<-10||n.x>VW*TILE+10) n.alpha-=dt*2;
      if(n.alpha<=0) n.state='gone';
    }
  }
  npcs=npcs.filter(n=>n.state!=='gone');
}

/* ---------- capsules ---------- */
/* a sphere flying (or rolling) into an offline capsule powers it up */
function capTouch(){
  if(!tps||tps.frozen||tps.cap||tps.onBat) return false;
  for(const c of caps){
    if(c.on) continue;
    const x0=c.tx*TILE+5, x1=c.tx*TILE+TILE-5, y0=c.ty*TILE-TILE+6, y1=c.ty*TILE+TILE-4, r=tps.r;
    if(tps.x>x0-r&&tps.x<x1+r&&tps.y>y0-r&&tps.y<y1+r){
      c.on=true; c.flash=1; G.caps[c.key]=true;
      const cx=c.tx*TILE+16, cy=c.ty*TILE;
      burst(cx,cy,'#5ad1e0',22,170,0.6,0); burst(cx,cy,sphCol(tps.kind),10,120,0.4,0); SFX.play('capOn',{x:cx});
      toast('Capsule online — stand in front of one and press W to travel','#5ad1e0');
      endTPS('break',null); recharge=0.15; saveProgress();
      return true;
    }
  }
  return false;
}
function capIsReal(rid,x,y){ const r=ROOMS[rid]; return !!r&&((r.grid[y]&&r.grid[y][x]==='f')||(r.under||{})[x+','+y]==='f'); }
function capList(){
  const out=[];
  for(const k of Object.keys(G.caps||{})){
    if(!G.caps[k]) continue;
    const i=k.lastIndexOf(':'), rid=k.slice(0,i), [x,y]=k.slice(i+1).split(',').map(Number);
    if(capIsReal(rid,x,y)) out.push({key:k,rid,x,y});
  }
  out.sort((a,b)=>(ORDER.indexOf(a.rid)-ORDER.indexOf(b.rid))||(a.y-b.y)||(a.x-b.x));
  for(const c of out){                                           // "Room name", or "Room name 2" when a room has several
    const same=out.filter(o=>o.rid===c.rid);
    c.name=plainText((ROOMS[c.rid]&&ROOMS[c.rid].name)||c.rid)+(same.length>1?' · '+(same.indexOf(c)+1):'');
  }
  return out;
}
function openTravel(c){
  const list=capList(), here=list.findIndex(o=>o.key===c.key);
  if(list.length<2){ SFX.play('deny'); toast('No other capsule is online yet — power one up with your sphere','#5ad1e0'); return; }
  travelUI={list,here,sel:here>=0?(here+1)%list.length:0,t:0,rects:[]};
  M.aiming=false; for(const k in keys) keys[k]=false; mapOpen=false;
  SFX.play('travelOpen');
}
function travelKey(e){
  const c=e.code, U=travelUI, n=U.list.length;
  e.preventDefault();
  if(c==='ArrowLeft'||c==='ArrowUp'||c==='KeyA'||c==='KeyW'){ U.sel=(U.sel-1+n)%n; SFX.play('uiMove'); }
  else if(c==='ArrowRight'||c==='ArrowDown'||c==='KeyD'||c==='KeyS'){ U.sel=(U.sel+1)%n; SFX.play('uiMove'); }
  else if((c==='Enter'||c==='Space'||c==='KeyJ'||c==='NumpadEnter')&&!e.repeat) travelGo(U.sel);
  else if(c==='Escape'||c==='Backspace'||c==='KeyM'||c==='Tab'){ travelUI=null; SFX.play('uiBack'); }
}
function travelMouse(down){
  const U=travelUI; if(!U) return;
  const i=U.rects.findIndex(r=>Math.hypot(M.x-r.x,M.y-r.y)<=14||(r.lx!==undefined&&M.x>=r.lx&&M.x<=r.lx+r.lw&&M.y>=r.ly&&M.y<=r.ly+r.lh));
  cv.style.cursor=i>=0?'pointer':'';
  if(i>=0&&i!==U.sel){ U.sel=i; SFX.play('uiMove'); }
  if(down){ if(i>=0) travelGo(i); else if(M.y>VIEW_H-40){ travelUI=null; SFX.play('uiBack'); } }
}
function travelGo(i){
  const U=travelUI, t=U.list[i]; if(!t) return;
  if(i===U.here){ travelUI=null; SFX.play('uiBack'); return; }
  travelUI=null; cv.style.cursor='';
  travelFx={t:0,dest:t,moved:false}; SFX.play('travelGo',{x:P.x+P.w/2});
  burst(P.x+P.w/2,P.y+P.h/2,'#5ad1e0',18,150,0.5,0);
}
function stepTravelFx(dt){
  const f=travelFx; f.t+=dt; stepParts(dt);
  if(!f.moved&&f.t>=0.42){
    f.moved=true; load(f.dest.rid,{capsule:f.dest.x+','+f.dest.y}); SFX.play('travelArrive',{x:P.x+P.w/2});
    burst(P.x+P.w/2,P.y+P.h/2,'#5ad1e0',20,160,0.55,0); burst(P.x+P.w/2,P.y+P.h/2,'#ffffff',8,90,0.3,0);
    const c=caps.find(o=>o.tx===f.dest.x&&o.ty===f.dest.y); if(c) c.flash=1;
  }
  if(f.t>=0.9) travelFx=null;
}
function capSpot(at){
  const [x,y]=at.split(',').map(Number);
  return {x:x*TILE+(TILE-P.w)/2,y:y*TILE+TILE-P.h,face:1};
}

/* ---------- boarding the jet ---------- */
const BOARD_T=3.1;
function startBoard(){
  board={t:0,repair:!G.jetDone,sx:P.x,sy:P.y,sparkT:0};
  M.aiming=false; for(const k in keys) keys[k]=false; P.vx=0;
  if(tps) endTPS('break',null);
  SFX.play('jump',{x:P.x+P.w/2});
}
function stepBoard(dt){
  const b=board, j=jetSite; b.t+=dt; stepParts(dt);
  const cx=j.tx*TILE+2.3*TILE, cy=j.ty*TILE+TILE-20;
  if(b.t<0.45){ const k=b.t/0.45; P.x=b.sx+(cx-10-b.sx)*k; P.y=b.sy+((cy-40)-b.sy)*k*k; }   // hop up into the cockpit
  if(b.repair&&b.t>0.5&&b.t<1.4){                                 // the parts go in
    b.sparkT-=dt;
    if(b.sparkT<=0){ b.sparkT=0.09; SFX.play('repairSpark',{x:cx}); burst(cx+(Math.random()-0.5)*110,cy-10+(Math.random()-0.5)*30,Math.random()<0.5?'#e0c04a':'#fff1b8',5,130,0.3,200); }
  }
  if(b.repair&&!b.r1&&b.t>0.62){ b.r1=1; SFX.play('ratchet',{x:cx}); }
  if(b.repair&&!b.r2&&b.t>1.05){ b.r2=1; SFX.play('ratchet',{x:cx,k:1.2}); }
  if(!b.eng&&b.t>1.3){ b.eng=1; SFX.play('engineStart',{x:cx}); }
  if(!b.off&&b.t>1.9){ b.off=1; SFX.play('takeoff',{x:cx}); }
  if(b.t>1.4&&b.t<1.9) shake=Math.max(shake,0.08);
  if(b.t>1.9){ const [x,y]=boardShip(); parts.push({x:x-60,y:y+(Math.random()-0.5)*8,vx:-200-Math.random()*120,vy:(Math.random()-0.5)*40,life:0.4,max:0.4,col:Math.random()<0.5?'#ffb36b':'#fff1d6',s:3,g:0}); }
  if(b.t>=BOARD_T){ board=null; JET.start({wave:G.jetDone?0:(G.jetWave|0),x:b.sx,y:b.sy}); }
}
/* where the jet is and how it sits during the boarding sequence: [x, y, rotation, wreck 0..1, flame 0..1] */
function boardShip(){
  const j=jetSite, b=board, cx=j.tx*TILE+2.3*TILE, cy=j.ty*TILE+TILE-20;
  const crashed=!G.jetDone, rot0=crashed?0.2:0;
  if(!b) return [cx,cy,rot0,crashed?1:0,0];
  const t=b.t, wreck=b.repair?Math.max(0,1-Math.max(0,t-0.5)/0.9):0;
  const lev=Math.min(1,Math.max(0,(t-1.4)/0.5)), fly=Math.max(0,(t-1.9)/(BOARD_T-1.9));
  const rot=rot0*(1-lev)-fly*0.25;
  return [cx+fly*fly*820,cy-lev*14-fly*fly*170,rot,wreck,lev*0.6+fly*0.4];
}

/* ---------- each frame (only while you can move) ---------- */
function stepWorld(dt){
  if(!npcs.length&&!caps.length&&!jetSite){ prompt=null; return; }
  stepNpcs(dt);
  for(const c of caps) if(c.flash>0) c.flash-=dt;
  if(jetSite&&!G.jetDone){                                     // the wreck smokes
    jetSite.smokeT-=dt;
    if(jetSite.smokeT<=0){
      jetSite.smokeT=0.12;
      const x=jetSite.tx*TILE+0.5*TILE, y=jetSite.ty*TILE-6;
      parts.push({x:x+(Math.random()-0.5)*10,y,vx:(Math.random()-0.3)*18,vy:-30-Math.random()*25,life:1.6,max:1.6,col:Math.random()<0.5?'#3a3f45':'#4a5058',s:5+Math.random()*4,g:-6});
    }
  }
  prompt=findPrompt();
}

/* ---------- drawing (world space) ---------- */
function drawCapsule(px,py,on,flash,t){
  const x=px, top=py-TILE+4, bot=py+TILE;
  ctx.fillStyle='#2c3238'; ctx.fillRect(x+2,bot-8,TILE-4,8);                   // plinth
  ctx.fillStyle='#3a4148'; ctx.fillRect(x+2,bot-8,TILE-4,2);
  ctx.fillStyle='#1a1f24'; ctx.fillRect(x+5,top+4,TILE-10,bot-top-12);          // the tube
  if(on){
    const g=ctx.createLinearGradient(x+5,0,x+TILE-5,0);
    g.addColorStop(0,'rgba(90,209,224,.15)'); g.addColorStop(0.5,'rgba(90,209,224,'+(0.35+0.15*Math.sin(t*3))+')'); g.addColorStop(1,'rgba(90,209,224,.15)');
    ctx.fillStyle=g; ctx.fillRect(x+5,top+4,TILE-10,bot-top-12);
    for(let i=0;i<5;i++){                                                       // light rising in the glass
      const k=((t*0.7+i/5)%1), yy=bot-10-k*(bot-top-16);
      ctx.fillStyle='rgba(200,246,255,'+(0.7*(1-k))+')'; ctx.fillRect(x+9+((i*7)%14),yy,2,4);
    }
  }
  ctx.strokeStyle=on?'#5ad1e0':'#4a5058'; ctx.lineWidth=1.5; ctx.strokeRect(x+5.5,top+4.5,TILE-11,bot-top-13);
  ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(x+7,top+6,2,bot-top-18);  // glass shine
  ctx.fillStyle='#2c3238'; ctx.fillRect(x+3,top,TILE-6,6);                      // cap
  ctx.fillStyle=on?'#5ad1e0':'#4a5058'; ctx.fillRect(x+12,top-2,TILE-24,3);
  const sx=x+16, sy=py+8;                                                       // the socket the sphere goes into
  ctx.fillStyle='#0d0f11'; ctx.beginPath(); ctx.arc(sx,sy,5.5,0,7); ctx.fill();
  if(on){ ctx.fillStyle='#c8f6ff'; ctx.beginPath(); ctx.arc(sx,sy,3,0,7); ctx.fill(); }
  else { ctx.strokeStyle='rgba(242,194,48,'+(0.35+0.35*Math.sin(t*4))+')'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(sx,sy,5,0,7); ctx.stroke(); }
  if(flash>0){ ctx.globalAlpha=Math.min(1,flash); ctx.strokeStyle='#c8f6ff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(sx,sy-10,10+(1-flash)*40,0,7); ctx.stroke(); ctx.globalAlpha=1; }
}
/* a stranded person: overalls, cap, a wrench; bobs when idle, waves when cheering, walks when leaving */
function drawNpc(x,y,face,t,o){
  o=o||{}; const f=face||1, walk=o.walk||0, cheer=o.cheer||0;
  ctx.save(); ctx.translate(x,y); ctx.globalAlpha=o.alpha===undefined?1:Math.max(0,o.alpha);
  const bob=walk?Math.abs(Math.sin(walk))*2:Math.sin(t*2.2)*0.8, hop=cheer>0?Math.abs(Math.sin(cheer*9))*6:0;
  ctx.translate(0,-hop);
  const l1=walk?Math.sin(walk)*5:0;

function pathAt(p,s){

  if(s>=p.total){ const k=p.close>0?Math.min(1,(s-p.total)/p.close):0,a=Q[n-1],b=Q[0]; return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]; }

  let lo=0,hi=n-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(p.cum[m]<=s) lo=m; else hi=m; }
  const seg=(p.cum[hi]-p.cum[lo])||1,k=(s-p.cum[lo])/seg,a=Q[lo],b=Q[hi];
  return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];
}
function presetPts(p){
  if(!p||!p.kind) return null;
  const w=+p.w||0,h=+p.h||0,n=Math.max(1,Math.min(8,Math.round(+p.n||1))),N=Math.max(48,n*48),out=[],k=p.kind;
  for(let i=0;i<=N;i++){
    const u=i/N; let x=0,y=0;
    if(k==='updown') y=-Math.sin(u*TAU*n)*h/2;
    else if(k==='zigzag'){ x=-w*u; y=-(2/Math.PI)*Math.asin(Math.sin(u*TAU*n))*h/2; }
    else if(k==='sine'){ x=-w*u; y=-Math.sin(u*TAU*n)*h/2; }
    else if(k==='circle'){ const a=u*TAU*n; x=-(1-Math.cos(a))*w/2; y=-Math.sin(a)*h/2; }
    else if(k==='figure8'){ const a=u*TAU*n; x=-Math.sin(a)*w/2; y=-Math.sin(2*a)*h/2; }
    else if(k==='swoop'){ x=-Math.sin(u*Math.PI)*w; y=Math.sin(u*TAU)*h/2; }
    if(p.fx) x=-x; if(p.fy) y=-y;
    out.push([Math.round(x*10)/10,Math.round(y*10)/10]);
  }
  return out;
}
const validPath=p=>Array.isArray(p)&&p.length>1;

/* ---------- waves ---------- */
function queueWave(i){
  if(i>=WAVES.length||i<0){ finish(); return; }
  waveNo=i; const w=WAVES[i]; curTok++;
  queue=(w.enemies||[]).slice().sort((a,b)=>(+a.delay||0)-(+b.delay||0));
  waveTotal=queue.length; waveTime=0; waveActive=true;
  waveRules=(w.rules||[]).map(r=>({r,fired:0,cd:0}));
  loadTiles(w,i);
  card={title:w.name||('Wave '+(i+1)),sub:'WAVE '+(i+1)+' / '+WAVES.length,t:0}; SFX.play('waveCard');
  if(!test){ G.jetWave=i; }
}
function updateWaves(dt){
  if(waveNo<0) return;
  waveTime+=dt;
  while(queue.length&&waveTime>=(+queue[0].delay||0)) spawnEnemy(queue.shift());
  updateRules(dt);
  if(waveActive&&!queue.length&&!enemies.length){ waveActive=false; const w=WAVES[waveNo]; spawnT=w?Math.max(0.2,+w.after||1):1; say('Wave cleared',0.9); SFX.play('waveClear'); }
  if(!waveActive&&!queue.length&&!enemies.length){ spawnT-=dt; if(spawnT<=0) queueWave(waveNo+1); }
}

/* ---------- enemies ---------- */
function makeEnemy(d,tok){
  const type=TYPES[d.type]?d.type:'normal', t=TYPES[type];
  const sx=clamp(+d.x||W*0.72,16,W-16), sy=clamp(+d.y||H*0.5,20,H-20);
  const hp=Math.max(0.5,t.hp*(+d.hp||1)), shot=SHOTS[d.shot]?d.shot:t.shot;
  const e={def:d,tok,x:0,y:0,slotX:sx,slotY:sy,startX:sx,startY:sy,state:'enter',s:0,dir:1,
    speedMult:+d.speed||1,fireMult:+d.fire||1,age:rand(0,9),r:t.r,type,shot,hp,maxHp:hp,wave:rand(0,TAU),
    shootCd:rand(0.7,t.fire),angry:0,charge:0,chargeMax:1,aimX:0,aimY:sy,floatY:0,enraged:false,diveT:-1,fx:0,hurtT:0,immT:0,vx:0,vy:0,
    later:d.later&&d.later.move?d.later:null,laterOn:false};
  setStage(e,d);
  const ent=d.entry||'right';
  if(ent==='left'){ e.x=-40-rand(0,30); e.y=e.startY+rand(-16,16); }
  else if(ent==='top'){ e.x=e.startX+rand(-16,16); e.y=-40-rand(0,30); }
  else if(ent==='bottom'){ e.x=e.startX+rand(-16,16); e.y=H+40+rand(0,30); }
  else { e.x=W+50+rand(0,60); e.y=e.startY+rand(-16,16); }
  return e;
}
function setStage(e,S){
  e.move=S.move||'slot'; e.guard=+S.guard||0; e.guardSeen=false;
  e.path=e.move==='path'?compilePath(validPath(S.path)?S.path:presetPts(S.preset)):null;
  if(e.move==='path'&&!e.path) e.move='slot';
  if(e.move==='protect'&&!e.guard) e.move='slot';
  e.pathMode=S.pathMode||'loop'; e.pathSpeed=+S.pathSpeed||140;
  e.diveEvery=clamp(+S.diveEvery||3,0.8,20); e.diveTimer=e.diveEvery*0.6;
  e.startX=e.path?e.slotX+e.path.pts[0][0]:e.slotX; e.startY=e.path?e.slotY+e.path.pts[0][1]:e.slotY; e.s=0; e.dir=1;
}
function checkLater(list,remaining,tok){
  for(const e of list){
    if(!e.later||e.laterOn||e.hp<=0||e.state==='retreat'||(tok!==undefined&&e.tok!==tok)) continue;
    if(remaining<=(+e.later.n||0)){
      e.laterOn=true; setStage(e,e.later); e.fx=0.6;
      if(e.state==='move'&&(e.move==='path'||e.move==='slot')) e.state='enter';
    }
  }
}
function spawnEnemy(d){ const e=makeEnemy(d,curTok); enemies.push(e); return e; }
function advancePath(e,dt){
  const p=e.path, v=e.pathSpeed*e.speedMult*dt;
  if(e.pathMode==='pingpong'){ e.s+=v*e.dir; if(e.s>p.total){ e.s=Math.max(0,2*p.total-e.s); e.dir=-1; } if(e.s<0){ e.s=Math.min(p.total,-e.s); e.dir=1; } }
  else if(e.pathMode==='once') e.s=Math.min(p.total,e.s+v);
  else { const L=p.total+p.close; e.s=(e.s+v)%L; }
  const o=pathAt(p,e.s); e.x=e.slotX+o[0]; e.y=e.slotY+o[1];
}
function startDive(e,px,py){ SFX.play('dive',{sx:e.x}); const dx=px-e.x,dy=py-e.y,d=Math.hypot(dx,dy)||1,v=DIVE_SPEED*Math.min(1.6,e.speedMult); e.vx=dx/d*v; e.vy=dy/d*v; e.state='dive'; e.diveT=-1; }
function protectStep(e,dt,px,py,list,sp){
  const ward=list?list.find(o=>o!==e&&o.def&&o.def.id===e.guard&&o.tok===e.tok&&o.hp>0):null;
  if(ward){
    e.guardSeen=true;
    const mates=list.filter(o=>o.move==='protect'&&o.guard===e.guard&&o.tok===e.tok&&o.state==='move'&&o.hp>0),i=Math.max(0,mates.indexOf(e)),n=mates.length||1;
    const a=Math.atan2(py-ward.y,px-ward.x)+(i-(n-1)/2)*0.6,D=ward.r+e.r+16;
    const tx=ward.x+Math.cos(a)*D,ty=ward.y+(ward.floatY||0)+Math.sin(a)*D,dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);
    if(d>0.5){ const v=Math.min(d,sp*1.4*dt); e.x+=dx/d*v; e.y+=dy/d*v; }
  } else if(e.guardSeen){ e.move='slot'; e.slotX=e.x; e.slotY=e.y; }
  else { e.x+=(e.slotX-e.x)*Math.min(1,dt*6); e.y+=(e.slotY-e.y)*Math.min(1,dt*6); }
}
function moveEnemy(e,dt,px,py,list){
  const sp=TU.entrySpeed*e.speedMult; e.age+=dt; if(e.fx>0) e.fx-=dt;
  if(e.diveT>=0&&e.state==='move'){ e.diveT-=dt; if(e.diveT<0) startDive(e,px,py); }
  if(e.state==='dive'){
    e.x+=e.vx*dt; e.y+=e.vy*dt;
    if(e.x<-60||e.y<-70||e.y>H+70||e.x>W+90){ e.x=W+50+rand(0,30); e.y=clamp(e.startY+rand(-30,30),30,H-30); e.state='enter'; e.s=0; e.dir=1; }
  } else if(e.state==='retreat') e.x+=Math.max(280,sp*1.3)*dt;
  else if(e.move==='track'){
    if(e.x>e.slotX){ e.x-=sp*dt; if(e.x<e.slotX) e.x=e.slotX; } else e.x+=(e.slotX-e.x)*Math.min(1,dt*4);
    const ty=clamp(py,50,H-50), d=ty-e.y; e.y+=Math.sign(d)*Math.min(Math.abs(d),TU.laserTrack*e.speedMult*dt);
    if(e.state==='enter'&&Math.abs(e.x-e.slotX)<10&&e.y>30&&e.y<H-30) e.state='move';
    if(e.state==='move') e.y=clamp(e.y,40,H-40);
  } else if(e.state==='enter'){
    const dx=e.startX-e.x, dy=e.startY-e.y, d=Math.hypot(dx,dy);
    if(d<=SNAP){ e.x=e.startX; e.y=e.startY; e.state='move'; e.s=0; e.dir=1; }
    else { const m=Math.min(sp*dt,d); e.x+=dx/d*m; e.y+=dy/d*m; }
  } else if(e.move==='path'&&e.path) advancePath(e,dt);
  else if(e.move==='chase'){ const dx=px-e.x,dy=py-e.y,d=Math.hypot(dx,dy)||1,v=Math.min(CHASE_SPEED*e.speedMult*dt,d); e.x+=dx/d*v; e.y+=dy/d*v; }
  else if(e.move==='protect') protectStep(e,dt,px,py,list,sp);
  else {
    e.x+=(e.slotX-e.x)*Math.min(1,dt*12); e.y+=(e.slotY-e.y)*Math.min(1,dt*12);
    if(e.move==='dive'&&e.diveT<0){ e.diveTimer-=dt; if(e.diveTimer<=0){ e.diveT=0.55; e.diveTimer=e.diveEvery; } }
  }
  e.floatY=((e.move==='slot'||e.move==='track'||e.move==='dive')&&e.state==='move'&&e.diveT<0)?Math.sin(e.age*2.1+e.wave)*6:0;
}
const chargeFor=shot=>shot==='laser'?Math.max(TU.chargeTime,LASER_CHARGE):TU.chargeTime;
const noseOf=e=>[e.x-e.r*0.95,e.y+(e.floatY||0)];
function updateEnemies(dt){
  const rem=enemies.filter(e=>e.tok===curTok&&e.state!=='retreat').length+queue.length;
  checkLater(enemies,rem,curTok);
  const w=WAVES[waveNo], crowd=w?(+w.crowd||0):0, cm=waveTotal>0?1+crowd*Math.max(0,1-rem/waveTotal):1;
  for(const e of enemies){
    moveEnemy(e,dt,pl.x,pl.y,enemies);
    if(e.hurtT>0) e.hurtT-=dt; if(e.immT>0) e.immT-=dt;
    const fm=(1+e.angry*0.55)*e.fireMult*(e.tok===curTok?cm:1);
    const canFire=st==='play'&&e.shot!=='none'&&e.state!=='retreat'&&e.diveT<0&&e.x<W-16&&e.x>16&&e.y>16&&e.y<H-16;
    if(e.charge>0){
      e.charge-=dt;
      if(e.shot==='laser'){ const d=Math.hypot(pl.x-e.aimX,pl.y-e.aimY),v=TU.laserTrack*1.6*dt; if(d>v){ e.aimX+=(pl.x-e.aimX)/d*v; e.aimY+=(pl.y-e.aimY)/d*v; } else { e.aimX=pl.x; e.aimY=pl.y; } }
      if(e.charge<=0){ if(canFire) fireAt(e); e.shootCd=TYPES[e.type].fire+rand(-0.2,0.45); }
    } else if(e.shot!=='none'){
      e.shootCd-=dt*fm;
      if(e.shootCd<=0&&canFire&&e.x>pl.x+30){ e.charge=e.chargeMax=chargeFor(e.shot); e.aimX=pl.x; e.aimY=pl.y; if(e.shot==='laser') SFX.play('laserCharge',{sx:e.x,id:e.def&&e.def.id}); }
    }
    if(st==='play'&&pl.inv<=0&&Math.hypot(pl.x-e.x,pl.y-(e.y+e.floatY))<pl.r+e.r*0.8){ hurtJet(); e.hp-=1; e.hurtT=0.2; }
    if(e.x<W-10&&!G.jetTips['t_'+e.type]) tip('t_'+e.type);
  }
  for(const e of enemies) if(e.hp<=0&&!e.dead){ e.dead=true; SFX.play('jetBoom',{elem:e.type,sx:e.x,k:0.9+Math.random()*0.2}); burst(e.x,e.y+e.floatY,TYPES[e.type].col,18); burst(e.x,e.y+e.floatY,'#ffffff',6); jshake=Math.max(jshake,0.06); }
  enemies=enemies.filter(e=>!e.dead&&e.x>-90&&!(e.state==='retreat'&&e.x>W+80));
}
function fireAt(e){
  const [nx,ny]=noseOf(e), m=TU.bulletSpeed;
  SFX.play(e.shot==='laser'?'laserFire':'eShot',{kind:e.shot,elem:e.type,sx:nx});
  if(e.shot==='laser'){ ebeams.push({e,ang:Math.atan2(e.aimY-ny,e.aimX-nx),life:BEAM_T,sx:nx,sy:ny,ex:nx,ey:ny,hit:false,elem:e.type}); return; }
  for(const o of e.shot==='spread'?[-0.32,0,0.32]:[0]){
    const a=e.shot==='straight'?Math.PI+o:Math.atan2(pl.y-ny,pl.x-nx)+o;
    const sp=(e.shot==='straight'?300:e.shot==='homing'?185:225)*m;
    ebul.push({x:nx,y:ny,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,sp,elem:e.type,kind:e.shot,r:e.shot==='homing'?6:5,home:e.shot==='homing'?2.4:0,t:0});
  }
}

/* ---------- rules: how the whole wave reacts as it thins out ---------- */
const RULE_DEF={fire:1.6,speed:1.5,zigzag:160,spawn:3};
function updateRules(dt){
  if(!waveRules.length) return;
  const alive=enemies.filter(e=>e.tok===curTok&&e.state!=='retreat'), remaining=alive.length+queue.length;
  for(const rs of waveRules){
    const r=rs.r;
    if(rs.fired>=Math.max(1,r.times|0)) continue;
    if(rs.cd>0){ rs.cd-=dt; continue; }
    if(!ruleMet(r,remaining,alive)) continue;
    if(r.effect!=='spawn'&&!alive.length) continue;
    applyRule(r,alive); rs.fired++; rs.cd=Math.max(0.2,+r.every||2);
  }
}
function ruleMet(r,remaining,alive){
  const n=+r.n||0;
  if(r.when==='time') return waveTime>=n;
  if(r.when==='pct') return waveTotal>0&&remaining<=waveTotal*n/100;
  if(r.when==='type') return alive.filter(e=>e.type===r.of).length+queue.filter(d=>d.type===r.of).length<=n;
  return remaining<=n;
}
function applyRule(r,alive){
  const v=+r.v||RULE_DEF[r.effect]||1, typed=r.target&&r.target!=='all'&&TYPES[r.target];
  if(r.msg) say(r.msg,1.6);
  SFX.play(r.effect==='enrage'?'enrage':r.effect==='retreat'?'retreat':'alert');
  if(r.effect==='spawn'){
    const n=clamp(Math.round(v),1,12);
    for(let i=0;i<n;i++){ SFX.play('spawnIn',{gap:0}); const type=typed?r.target:BEAMS[Math.floor(Math.random()*3)]; spawnEnemy({type,x:rand(W*0.55,W*0.88),y:rand(70,H-80),entry:'right',move:'slot'}); }
    waveTotal+=n; return;
  }
  const tg=typed?alive.filter(e=>e.type===r.target):alive;
  tg.forEach((e,i)=>{
    switch(r.effect){
      case 'fire': e.fireMult*=v; break;
      case 'speed': e.speedMult*=v; break;
      case 'enrage': e.fireMult*=1.6; e.speedMult*=1.3; e.enraged=true; e.angry=1; break;
      case 'dive': if(e.state!=='dive') e.diveT=i*0.35; break;
      case 'chase': e.move='chase'; break;
      case 'hold': e.move='slot'; e.slotX=e.x; e.slotY=e.y; break;
      case 'retreat': e.state='retreat'; break;
      case 'zigzag': { const p=compilePath(presetPts({kind:'zigzag',w:200,h:v,n:3})); if(!p) break;
        e.move='path'; e.path=p; e.pathMode='pingpong'; e.pathSpeed=Math.max(e.pathSpeed,170); e.slotX=e.startX=e.x; e.slotY=e.startY=e.y; e.s=0; e.dir=1;
        if(e.state==='enter') e.state='move'; break; }
    }
  });
}

/* ---------- your jet ---------- */
function stepPlayer(dt){
  let dx=0,dy=0;
  if(keys.KeyA||keys.ArrowLeft) dx--; if(keys.KeyD||keys.ArrowRight) dx++;
  if(keys.KeyW||keys.ArrowUp) dy--; if(keys.KeyS||keys.ArrowDown) dy++;
  const len=Math.hypot(dx,dy)||1, v=TU.jetSpeed*dt, ox=pl.x, oy=pl.y;
  const nx=clamp(pl.x+dx/len*v,30,W-40); if(!circleSolid(nx,pl.y,pl.r)) pl.x=nx;
  const ny=clamp(pl.y+dy/len*v,22,H-22); if(!circleSolid(pl.x,ny,pl.r)) pl.y=ny;
  if(hasMover&&circleMover(pl.x,pl.y,pl.r-2)){                  // a pillar shoves you along (and it hurts)
    if(pl.inv<=0) hurtJet();
    const px=clamp(pl.x-mvSpeed*dt,30,W-40); if(!circleSolid(px,pl.y,pl.r)) pl.x=px;
  }
  pl.vx=(pl.x-ox)/Math.max(dt,1e-4); pl.vy=(pl.y-oy)/Math.max(dt,1e-4);
  pl.moved+=Math.hypot(pl.x-ox,pl.y-oy);
  pl.tilt+=(clamp(pl.vy/TU.jetSpeed,-1,1)*0.2-pl.tilt)*Math.min(1,dt*8);
  pl.inv=Math.max(0,pl.inv-dt);
  if(keyItems.length) pickKeys();
  pl.fire=!!(keys.KeyJ||keys.Space||mouse.down);
  if(pl.fire){ pl.fired+=dt; stepBeam(dt); SFX.hold('beam_'+BEAMS[pl.beam]); } else beamHit=null;
  if(Math.hypot(pl.vx,pl.vy)>60&&Math.random()<0.5) fx.push({x:pl.x-30,y:pl.y+rand(-2,2),vx:rand(-160,-90),vy:rand(-12,12),life:0.35,max:0.35,col:Math.random()<0.5?'#ffb36b':'#fff1d6',s:2.5});
}
/* the beam: straight ahead from the nose, stops at the first enemy or block it meets */
function stepBeam(dt){
  const bx=pl.x+30, by=pl.y+1.5;
  let end=rayEnd(bx,by,W+20), hit=null;
  for(const e of enemies){
    const ey=e.y+e.floatY, dyy=Math.abs(ey-by);
    if(dyy>=e.r+3||e.x+e.r<bx) continue;
    const hx=e.x-Math.sqrt(Math.max(0,(e.r+3)*(e.r+3)-dyy*dyy));
    if(hx<end){ end=Math.max(bx,hx); hit=e; }
  }
  beamHit={x0:bx,y:by,x1:end,e:hit};
  const mode=BEAMS[pl.beam], col=ELEM[mode].col;
  if(hit){
    if(hurts(mode,hit.type)){ hit.hp-=TU.beamDps*dt; hit.hurtT=0.06; if(Math.random()<0.6) spark(end,by,col,-1); SFX.play('beamHit',{m:mode,sx:end}); }
    else { hit.immT=0.3; if(Math.random()<0.5) spark(end,by,'#c9ced4',-1); SFX.play('beamImmune',{sx:end}); if(!G.jetTips['w_'+hit.type]) tip('w_'+hit.type); }
  } else if(end<W&&Math.random()<0.4) spark(end,by,col,-1);
}
function setBeam(i){
  i=((i%3)+3)%3; if(i===pl.beam) return;
  pl.beam=i; say('Beam: '+ELEM[BEAMS[i]].name,0.6); SFX.play('beamSwap',{m:BEAMS[i]});
  burst(pl.x+30,pl.y+1.5,ELEM[BEAMS[i]].col,8);
  tipDone('switch');
}
function hurtJet(){
  if(st!=='play'||pl.inv>0) return;
  pl.hp--; pl.inv=1.1; jshake=Math.max(jshake,0.3);
  burst(pl.x,pl.y,'#e05a6a',18); burst(pl.x,pl.y,'#ffffff',6);
  if(pl.hp<=0){ st='dead'; deadT=0; burst(pl.x,pl.y,'#ffb36b',30); burst(pl.x,pl.y,'#3a3f45',20); pl.vy=-120; SFX.play('jetCrash',{sx:pl.x}); }
  else SFX.play('jetHurt',{sx:pl.x});
}
function updateBullets(dt){
  for(const b of ebul){
    b.t+=dt;
    if(b.home>0){
      b.home-=dt; const cur=Math.atan2(b.vy,b.vx), want=Math.atan2(pl.y-b.y,pl.x-b.x); let d=want-cur; while(d>Math.PI) d-=TAU; while(d<-Math.PI) d+=TAU;
      const na=cur+clamp(d,-1.7*dt,1.7*dt); b.vx=Math.cos(na)*b.sp; b.vy=Math.sin(na)*b.sp;
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(solidAt(b.x,b.y)){ b.dead=true; burst(b.x,b.y,ELEM[b.elem].col,4); continue; }
    if(st==='play'&&Math.hypot(pl.x-b.x,pl.y-b.y)<pl.r+b.r*0.8&&pl.inv<=0){ b.dead=true; hurtJet(); }
  }
  ebul=ebul.filter(b=>!b.dead&&b.x>-60&&b.x<W+60&&b.y>-60&&b.y<H+60);
  for(const bm of ebeams){
    bm.life-=dt;
    if(bm.e&&enemies.includes(bm.e)){ const n=noseOf(bm.e); bm.sx=n[0]; bm.sy=n[1]; }
    [bm.ex,bm.ey]=beamEnd(bm.sx,bm.sy,bm.ang);
    if(st==='play'&&!bm.hit&&pl.inv<=0&&segDist(pl.x,pl.y,bm.sx,bm.sy,bm.ex,bm.ey)<pl.r+5){ bm.hit=true; hurtJet(); }
  }
  ebeams=ebeams.filter(b=>b.life>0);
}

/* ---------- tips: the first time each thing comes up (only with tutorial hints on) ---------- */
const TIPS={

  beam:{title:'Fire the beam',sub:'hold J, Space or the left mouse button',keys:['J']},
  t_normal:{title:'Drones — only the NORMAL beam hurts them',sub:'Q switches the beam (or press 1)',keys:['Q','1'],elem:'normal'},
  t_ice:{title:'Frost wings — only the FIRE beam hurts them',sub:'Q switches the beam (or press 3)',keys:['Q','3'],elem:'fire'},
  t_fire:{title:'Ember wings — only the ICE beam hurts them',sub:'Q switches the beam (or press 2)',keys:['Q','2'],elem:'ice'},
  w_normal:{title:'That beam does nothing to a drone',sub:'switch to the NORMAL beam — Q or 1',keys:['Q','1'],elem:'normal'},
  w_ice:{title:'Ice shrugs that off — melt it with the FIRE beam',sub:'Q or 3',keys:['Q','3'],elem:'fire'},
  w_fire:{title:'Fire shrugs that off — freeze it with the ICE beam',sub:'Q or 2',keys:['Q','2'],elem:'ice'}
};
function tip(id){
  if(!tut.on||G.jetTips[id]) return;
  if(id.startsWith('t_')){ const t2='w_'+id.slice(2); if(tipCur&&tipCur.id===t2) return; }
  if(tipQ.includes(id)||(tipCur&&tipCur.id===id)) return;
  tipQ.push(id);
}
function tipDone(id){ if(tipCur&&tipDoneT<=0&&(tipCur.id===id||(id==='switch'&&tipCur.elem&&BEAMS[pl.beam]===tipCur.elem))) tipDoneT=0.6; }
function stepTips(dt){
  if(!tut.on){ tipCur=null; return; }
  if(!tipCur){
    while(tipQ.length){ const id=tipQ.shift(); if(!G.jetTips[id]){ tipCur=Object.assign({id},TIPS[id]); tipT=0; tipDoneT=0; break; } }
    return;
  }
  tipT+=dt;
  if(tipDoneT>0){ tipDoneT-=dt; if(tipDoneT<=0){ G.jetTips[tipCur.id]=true; tipCur=null; } return; }
  const c=tipCur, done=c.id==='move'?pl.moved>260:c.id==='beam'?pl.fired>0.6:c.elem?BEAMS[pl.beam]===c.elem&&tipT>1.2:false;
  if(done||tipT>(c.elem?6.5:9)) tipDoneT=0.6;
}

/* ---------- flow: take-off · waves · crash / retry · landing ---------- */
function start(o){
  o=o||{};
  on=true; test=!!o.test; st='intro'; introT=0; outroT=0;
  from={room:roomId,x:o.x!==undefined?o.x:P.x,y:o.y!==undefined?o.y:P.y};
  pl.max=Math.max(1,G.maxHp|0||3); pl.hp=pl.max; pl.x=-50; pl.y=H/2; pl.inv=0; pl.tilt=0; pl.vx=0; pl.vy=0; pl.moved=0; pl.fired=0;
  if(!o.keepBeam) pl.beam=0;
  enemies=[]; ebul=[]; ebeams=[]; fx=[]; card=null; msg=''; msgT=0; jshake=0; beamHit=null; tipCur=null; tipQ=[];
  mouse.down=false; M.aiming=false; for(const k in keys) keys[k]=false;
  waveNo=-1; queue=[]; waveActive=false; enemies=[];
  startWave=clamp(o.wave|0,0,Math.max(0,WAVES.length-1));
  G.jetTips=G.jetTips||{};
  if(test) opened={};                                         // doors opened with keys stay open if you leave and come back
  else { if(!startWave||!G.jetOpened) G.jetOpened={}; opened=G.jetOpened; }
  loadTiles(null);
  tip('move'); tip('beam');
  SFX.play('retreat');
}
function retry(){
  pl.hp=pl.max; pl.x=110; pl.y=H/2; pl.inv=1.2; pl.vy=0; st='play'; SFX.play('uiSelect');
  enemies=[]; ebul=[]; ebeams=[]; beamHit=null;
  queueWave(waveNo<0?startWave:waveNo);
}
function finish(){ SFX.play('flightDone'); st='outro'; outroT=0; enemies=[]; ebul=[]; ebeams=[]; card={title:'Flight complete',sub:test?'TEST FLIGHT':'THE SKY IS CLEAR',t:0,long:true}; }
function end(why){
  on=false; st='off'; mouse.down=false; for(const k in keys) keys[k]=false;
  if(test){ test=false; if(api2.onTestEnd) api2.onTestEnd(why); return; }
  if(why==='done'){
    G.jetDone=true; G.jetWave=0; G.jetOpened={}; P.hp=G.maxHp;
    const rid=ROOMS[LAND.room]?LAND.room:from.room, sps=(ROOMS[rid]&&ROOMS[rid].spawns)||{};
    load(rid,sps[LAND.spawn]?LAND.spawn:(sps.start?'start':'left'));
    toast('You landed safely','#9fd8ff'); SFX.play('jetLand');
    saveProgress();
  } else {                                                    // back on the ground, next to the jet
    load(from.room,'restart'); P.x=from.x; P.y=from.y; P.vx=P.vy=0; P.hp=G.maxHp;
    toast('Back on the ground — the jet’s ready when you are','#9fd8ff');
  }
}
function step(dt){
  scroll+=dt; jshake=Math.max(0,jshake-dt); msgT=Math.max(0,msgT-dt); if(card) card.t+=dt;
  for(const f of doorFx) f.t+=dt; doorFx=doorFx.filter(f=>f.t<0.45);
  for(const f of linkFx) f.t+=dt; linkFx=linkFx.filter(f=>f.t<0.5);
  moverT+=dt; mvS=mvSpeed*moverT;
  if(st==='intro'||st==='play'||st==='outro') SFX.hold('engine',{s:st==='outro'?1:clamp(Math.hypot(pl.vx,pl.vy)/TU.jetSpeed,0,1)});
  if(st==='intro'){
    introT+=dt; const k=Math.min(1,introT/0.9);
    pl.x=-50+(160)*(1-(1-k)*(1-k)); pl.y=H/2;
    if(introT>=0.9){ st='play'; queueWave(startWave); }
  } else if(st==='play'){
    stepPlayer(dt); updateWaves(dt);
  } else if(st==='dead'){
    deadT+=dt; pl.vy+=520*dt; pl.y+=pl.vy*dt; pl.x+=40*dt; pl.tilt+=dt*2.5; beamHit=null;
    if(Math.random()<0.6) fx.push({x:pl.x-10,y:pl.y,vx:rand(-30,30),vy:rand(-60,-20),life:0.8,max:0.8,col:Math.random()<0.5?'#3a3f45':'#ffb36b',s:4});
  } else if(st==='outro'){
    outroT+=dt; beamHit=null; pl.x+=(120+outroT*outroT*260)*dt; pl.tilt+=(-0.12-pl.tilt)*Math.min(1,dt*3);
    if(outroT>=2.6){ end('done'); return; }
  }
  updateEnemies(dt); updateBullets(dt); stepFx(dt); stepTips(dt);
}

/* ---------- input (the game's key handler hands everything here while you fly) ---------- */
function key(e){
  const c=e.code;
  if(['Space','KeyW','KeyA','KeyS','KeyD','KeyJ','KeyQ','KeyE','Tab','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(c)) e.preventDefault();
  if(e.repeat) return;
  if(st==='dead'){
    if(deadT<0.8) return;
    if(c==='KeyR'||c==='Enter'||c==='Space'||c==='KeyJ') retry();
    else if(c==='Escape') end('quit');
    return;
  }
  if(c==='Escape'||c==='KeyP'){ if(test) end('quit'); else openMenu('pause',{preview:menu.preview}); return; }
  if(c==='KeyQ'||c==='KeyE') setBeam(pl.beam+1);
  if(c==='Digit1') setBeam(0); if(c==='Digit2') setBeam(1); if(c==='Digit3') setBeam(2);
  if(c==='Enter'&&tipCur){ G.jetTips[tipCur.id]=true; tipCur=null; }
}
function mouseDown(e){ if(e.button===0) mouse.down=true; if(e.button===2&&st==='play') setBeam(pl.beam+1); }
function mouseUp(e){ if(e.button===0) mouse.down=false; }
function wheel(e){ if(st==='play'){ setBeam(pl.beam+(e.deltaY>0?1:-1)); } }

      try{ if(JET.on) JET.restartWave(); else load(roomId,'restart'); toast('Something went wrong — restarted','#e05a6a'); }catch(e2){ console.error(e2); }
    }
  }
}

Object.assign(api,{TILE,VW,VH,T,SW,G,P,M,ROOMS,ORDER,DOOR_COLS,
  load,mpos,doorCol,drawTileBase,drawDoorTile,drawKey,drawAbsorber,drawBrute,
  drawDropSpike,drawPickup,drawTurret,drawEater,drawFlyer,drawGuard,drawPlank,makePlank,drawMap,mapLayout,
  closeMap:()=>{mapOpen=false;}, drawWall, camFor, drawSphereBody, footOf, ROOM_SIZES,
  setArtW:w=>{ artW=w; }, dims:()=>[VW,VH], cam:()=>cam, rs:()=>RS, VIEW_W, VIEW_H,
  setRenderScale:k=>{ RS=k; cv.width=Math.round(VIEW_W*k); cv.height=Math.round(VIEW_H*k); },
  setTutorial:on=>{ tut.on=on; if(!on) tut.i=-1; }, resetTutorial:()=>{ tut.done={}; tut.i=-1; }, tut,
  layerCap, SPH, miniHits, drawSlugger, SLG, CUSTOM, drawCustom, drawBgCell, drawLdoorTile, ldoorGroups, maxLayers, baseOf, exitGrid, EXIT_CH, customImg,
  roomId:()=>roomId, exitGroups, linkOf, wallOf, drawToasts, travel,
  _reveal:(x,y)=>reveal(x,y,'.'),
  JET, SFX, drawNpc, drawCapsule, npcData, npcWallOf, NPC_DEF, jetNeed:()=>{ needCache=null; return jetNeed(); },
  startJet:o=>{ if(api.menu.on) closeMenu(); JET.start(o||{}); },
  _world:()=>({jetSite,npcs,caps,talk,travelUI,travelFx,board,prompt}), _interact:()=>{ prompt=findPrompt(); return interact(); }, _talkAdvance:()=>talkAdvance(),
  setSfxVolume:v=>{ opts.sfx=Math.max(0,Math.min(1,v)); SFX.setVolume(opts.sfx); writeJSON(OPTS_KEY,Object.assign(readJSON(OPTS_KEY)||{},{sfx:opts.sfx})); },
  openMenu, closeMenu, startMenu, menu, opts, hudL, setHud, HUD_DEF, openHudEdit, hudEdit, resetProgress, saveProgress, readSave, GAME_TITLE,
  _debug:()=>({dying,skin,bgList,ldoors,tps,mobs,spikes,pickups,grid,P,G,boss,recharge,gates,exitAt,toasts,crumble,planks,shards,mapOpen,SW,warp,hidden,explosions,cam})});
window.TPS=api;

load(BOOT.start&&ROOMS[BOOT.start]?BOOT.start:ORDER[0],'left');
requestAnimationFrame(frame);
})();
</script>
<script>(function exportLauncher(){
  const api=window.TPS, cv=document.getElementById('c'), $=id=>document.getElementById(id);
  function fit(){
    const k=Math.min(innerWidth/800,innerHeight/480);
    cv.style.width=Math.floor(800*k)+'px'; cv.style.height=Math.floor(480*k)+'px';
    api.setRenderScale(Math.min(4,k*(window.devicePixelRatio||1)));          // draw at screen resolution, not stretched
  }
  addEventListener('resize',fit); fit();
  const isFull=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  function enter(){
    const el=document.documentElement, rq=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!isFull()&&rq) try{ const p=rq.call(el); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  }
  function exit(){ if(isFull()) try{ const p=(document.exitFullscreen||document.webkitExitFullscreen).call(document); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
  api.fullscreen={enter,exit,is:isFull};
  addEventListener('keydown',e=>{
    if(e.code==='KeyF'){ if(isFull()) exit(); else enter(); }
    if(e.code==='KeyN'&&$('note')&&!api.menu.on) $('note').hidden=!$('note').hidden;
  });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&!api.menu.on) api.openMenu('pause'); });
  addEventListener('pagehide',()=>api.saveProgress());
  api.startMenu();
  cv.focus();
})();</script>
