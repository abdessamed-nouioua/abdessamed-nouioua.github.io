/* ---------- the scanner: a resonant beam that repeats "bwee-bwee-bwee" sweeps, faster and higher as the hypnosis ring fills ---------- */
function makeScan(ctx,dest){
  const car=ctx.createOscillator(),sh=ctx.createOscillator(),lfo=ctx.createOscillator(),pd=ctx.createGain(),pd2=ctx.createGain(),fd=ctx.createGain(),
        fl=ctx.createBiquadFilter(),mixSh=ctx.createGain(),g=ctx.createGain();
  car.type='square';sh.type='sine';lfo.type='sawtooth';
  car.frequency.value=240;sh.frequency.value=480;lfo.frequency.value=4;pd.gain.value=110;pd2.gain.value=220;fd.gain.value=900;
  fl.type='lowpass';fl.frequency.value=1300;fl.Q.value=6;mixSh.gain.value=.35;g.gain.value=0;
  lfo.connect(pd);pd.connect(car.frequency);lfo.connect(pd2);pd2.connect(sh.frequency);lfo.connect(fd);fd.connect(fl.frequency);
  car.connect(fl);sh.connect(mixSh);mixSh.connect(fl);fl.connect(g);g.connect(dest);
  car.start();sh.start();lfo.start();
  return {car,sh,lfo,pd,pd2,fl,g};
}
function setScan(N,t,on,pct,target){
  const f=240+pct*360;
  N.car.frequency.setTargetAtTime(f,t,.05);N.sh.frequency.setTargetAtTime(f*2,t,.05);
  N.pd.gain.setTargetAtTime(f*.45,t,.05);N.pd2.gain.setTargetAtTime(f*.9,t,.05);
  N.lfo.frequency.setTargetAtTime(4+pct*10,t,.08);N.fl.frequency.setTargetAtTime(1200+pct*1500,t,.08);
  N.g.gain.setTargetAtTime(on?(target?.026:.012):0,t,on?.03:.06);
}

A.unlock=function(){
  if(!ac){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{ac=new AC()}catch(e){return}
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.2;
    master=ac.createGain();master.connect(comp);comp.connect(ac.destination);
    sfxBus=ac.createGain();sfxBus.connect(master);
    noise=makeNoise(ac);scanN=makeScan(ac,sfxBus);applyVolumes();A.ready=true;
    document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else ac.resume()});
  }
  if(ac.state==='suspended'&&!document.hidden)ac.resume();
};
function applyVolumes(){if(!ac)return;const t=ac.currentTime;sfxBus.gain.setTargetAtTime(volS*volS,t,.02);master.gain.setTargetAtTime(muted?0:1,t,.03)}
A.play=function(name,p){
  p=p||{};A.stats[name]=(A.stats[name]||0)+1;
  if(!ac||!R[name]||muted||volS<=0||ac.state!=='running')return null;
  const now=ac.currentTime,gap=GAP[name]||0;
  if(gap&&last[name]!=null&&now-last[name]<gap)return null;
  if(now-budgetT>.05){budgetT=now;budget=0}
  if(++budget>10)return null;                                            // never more than 10 new sounds in 50 ms
  last[name]=now;
  const vg=ac.createGain();
  if(p.x!=null&&ac.createStereoPanner){const pan=ac.createStereoPanner();pan.pan.value=Math.max(-1,Math.min(1,(p.x/SCREEN_W*2-1)*.55));vg.connect(pan);pan.connect(sfxBus)}
  else vg.connect(sfxBus);
  R[name](kit(ac,vg,noise,VARY[name]?rnd(.95,1.06):1),p);
  setTimeout(()=>{try{vg.disconnect()}catch(e){}},(p.dur||0)*1000+3000);
  return {stop(){try{vg.gain.setTargetAtTime(0,ac.currentTime,.03)}catch(e){}}};
};
A.scan=function(on,pct,target){
  if(!scanN)return;
  if(on===scanLast.on&&target===scanLast.target&&Math.abs(pct-scanLast.pct)<.02)return;
  scanLast={on,pct,target};setScan(scanN,ac.currentTime,on,pct,target);
};
A.setVolume=function(s){volS=Math.max(0,Math.min(1,s));applyVolumes()};
A.setMuted=function(b){muted=!!b;applyVolumes()};
/* test helpers: render one sound (or the scanner) offline and report its loudness */
function measure(oc){return oc.startRendering().then(b=>{let pk=0,ss=0,n=0;for(let c=0;c<b.numberOfChannels;c++){const d=b.getChannelData(c);for(let i=0;i<d.length;i++){const v=Math.abs(d[i]);if(v>pk)pk=v;ss+=v*v;n++}}return {peak:+pk.toFixed(3),rms:+Math.sqrt(ss/n).toFixed(4)}})}
A._render=function(name,p){const oc=new OfflineAudioContext(2,44100*3,44100),g=oc.createGain();g.connect(oc.destination);R[name](kit(oc,g,makeNoise(oc),1),p||{});return measure(oc)};
A._renderScan=function(pct){const oc=new OfflineAudioContext(2,44100*2,44100),N=makeScan(oc,oc.destination);setScan(N,0,true,pct,true);return measure(oc)};
A.names=()=>Object.keys(R);
window.CQW_AUDIO=A;
})();

function fusePair(t1,t2){const q=[t1,t2].sort((x,y)=>baseOf(x)<baseOf(y)?-1:baseOf(x)>baseOf(y)?1:0);return {key:baseOf(q[0])+'+'+baseOf(q[1]),a:q[0],b:q[1]}}

const widOf=(w,i)=>w&&w.wid!=null?w.wid:'i'+i;
function loadTiles(w,i){

  if(w){
    const me=widOf(w,i);
    for(const d of w.doors||[]){if(opened[me+':'+d.id]||!d.tiles.length)continue;const mid=d.tiles[Math.floor((d.tiles.length-1)/2)];for(const t of d.tiles)doorAt[t[0]+','+t[1]]={id:d.id,keyhole:t===mid}}

  if(ward){

function moveEnemy(e,dt,px,py,list){

}
/* how much hypnosis it takes right now: the lower its health, the easier */

/* ---------- rules ---------- */
const RULE_DEF={fire:1.6,speed:1.5,resist:1.6,zigzag:160,spawn:3};
function updateRules(dt){
  if(!waveRules.length)return;
  const alive=enemies.filter(e=>e.tok===curTok&&e.state!=='retreat'),remaining=alive.length+queue.length;
  for(const rs of waveRules){
    const r=rs.r;
    if(rs.fired>=Math.max(1,r.times|0))continue;
    if(rs.cd>0){rs.cd-=dt;continue}
    if(!ruleMet(r,remaining,alive))continue;
    if(r.effect!=='spawn'&&!alive.length)continue;
    applyRule(r,alive);rs.fired++;rs.cd=Math.max(.2,+r.every||2);
  }
}
function ruleMet(r,remaining,alive){
  const n=+r.n||0;
  if(r.when==='time')return waveTime>=n;
  if(r.when==='pct')return waveTotal>0&&remaining<=waveTotal*n/100;
  if(r.when==='type')return alive.filter(e=>e.type===r.of).length+queue.filter(d=>d.type===r.of).length<=n;
  return remaining<=n;
}
function applyRule(r,alive){
  const v=+r.v||RULE_DEF[r.effect]||1,typed=r.target&&r.target!=='all'&&TYPES[r.target];
  if(r.msg){setMessage(r.msg,1.6);sfx('alert')}
  if(r.effect==='spawn'){
    const n=clamp(Math.round(v),1,12);
    for(let i=0;i<n;i++){const type=typed?r.target:pickType();spawnEnemy({type,x:rand(W*.55,W*.88),y:rand(100,H-110),entry:'right',move:type==='laser'?'track':'slot'})}
    waveTotal+=n;return;
  }
  const tg=(typed?alive.filter(e=>e.type===r.target):alive).filter(e=>e.state!=='fusing');
  tg.forEach((e,i)=>{
    switch(r.effect){
      case 'fire':e.fireMult*=v;break;
      case 'speed':e.speedMult*=v;break;
      case 'enrage':e.fireMult*=1.6;e.speedMult*=1.3;e.enraged=true;e.angry=1;break;
      case 'resist':e.resist*=v;break;
      case 'dive':if(e.state!=='dive')e.diveT=i*.35;break;
      case 'chase':e.move='chase';break;
      case 'hold':e.move='slot';e.slotX=e.x;e.slotY=e.y;break;
      case 'retreat':e.state='retreat';break;
      case 'zigzag':{const p=compilePath(presetPts({kind:'zigzag',w:260,h:v,n:3}));if(!p)break;
        e.move='path';e.path=p;e.pathMode='pingpong';e.pathSpeed=Math.max(e.pathSpeed,170);e.slotX=e.startX=e.x;e.slotY=e.startY=e.y;e.s=0;e.dir=1;
        if(e.state==='enter')e.state='move';break}
    }
  });
}

const PAD_MAP=[[0,'Space'],[7,'Space'],[2,'KeyJ'],[1,'KeyK'],[3,'KeyO'],[5,'ShiftLeft'],[4,'Tab'],[6,'KeyQ'],[9,'Escape'],[8,'Enter']];

  ctx.strokeStyle='rgba(158,252,255,.6)';ctx.lineWidth=1.5;const tw=Math.min(W*.6,ctx.measureText(card.title).width+80)*Math.min(1,card.t/.5);ctx.beginPath();ctx.moveTo(W/2-tw/2,H*.36+84);ctx.lineTo(W/2+tw/2,H*.36+84);ctx.stroke();
  if(card.obj){ctx.fillStyle='#ffe98a';ctx.font='16px Arial';ctx.fillText('◆  '+card.obj,W/2,H*.36+108)}

}
function drawObjective(){
  if(waveNo<0||gameOver||(!waveActive&&!goalWon))return;
  const left=enemies.filter(e=>e.tok===curTok&&e.state!=='retreat').length+queue.length;
  let txt,sub='',k=-1,col='#9efcff';
  if(goal.type==='survive'){const r=Math.max(0,Math.ceil(goal.time-goalT));txt=goalWon?'Survived ✓':'Survive  '+Math.floor(r/60)+':'+String(r%60).padStart(2,'0');k=goalWon?1:clamp(goalT/goal.time,0,1);if(!goalWon&&r<=5)col=Math.floor(clock*4)%2?'#fff27a':'#9efcff'}
  else if(goal.type==='capture'){txt='Capture only — destroy none';sub=left+' left';col='#ffe98a'}
  else{txt='Clear all enemies';sub=left+' left'}
  ctx.save();ctx.font='bold 13px Arial';const tw=ctx.measureText(txt).width;ctx.font='12px Arial';const sw=sub?ctx.measureText(sub).width+16:0;
  const w=Math.max(150,tw+sw+40),h=k>=0?36:28;
  ctx.fillStyle='rgba(5,8,20,.55)';ctx.fillRect(14,14,w,h);ctx.strokeStyle='rgba(158,252,255,.18)';ctx.strokeRect(14.5,14.5,w-1,h-1);
  ctx.save();ctx.translate(27,28);ctx.rotate(Math.PI/4);ctx.fillStyle=col;ctx.fillRect(-3.5,-3.5,7,7);ctx.restore();
  ctx.fillStyle=col;ctx.font='bold 13px Arial';ctx.fillText(txt,38,33);
  if(sub){ctx.fillStyle='#8a93c0';ctx.font='12px Arial';ctx.textAlign='right';ctx.fillText(sub,14+w-10,33);ctx.textAlign='left'}
  if(k>=0){ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(38,40,w-50,3);ctx.fillStyle=col;ctx.fillRect(38,40,(w-50)*k,3)}
  ctx.restore();
}
function drawEndScreen(){

/* =====================================================================
   MAIN MENU · PAUSE · HOW TO PLAY · OPTIONS · MISSION SELECT
   ===================================================================== */
const menu={on:false,screen:'title',root:'title',sel:0,page:0,items:[],rects:[],note:'',noteT:0,demo:[]};
function openMenu(s){menu.on=true;menu.screen=menu.root=s;menu.sel=0;menu.page=0;keys.clear();pressed.clear();mouseDown=false;buildMenu()}
function go(s){menu.screen=s;menu.sel=s==='missions'?Math.max(0,waveNo):0;menu.page=0;buildMenu()}
function closeMenu(){menu.on=false;keys.clear();pressed.clear();mouseDown=false;canvas.style.cursor=''}
function startGame(w){closeMenu();resetGame(w|0)}
function back(){if(menu.screen!==menu.root)go(menu.root);else if(menu.root==='pause')closeMenu()}
function saveOpts(){writeJSON(OPTS_KEY,opts);if(api.onTune)api.onTune()}
function note(t){menu.note=t;menu.noteT=2}
function resetTips(){tut.seen.clear();writeJSON(SEEN_KEY,[]);tut.stat={moved:0,scanT:0,fired:0,lineT:0}}
function buildMenu(){
  const I=[],s=menu.screen;
  if(s==='title'){
    I.push({label:'Start game',act:()=>startGame(0)});
    I.push({label:'Tutorial',sub:'learn every control and mechanic as you play',act:()=>{resetTips();opts.tips=true;saveOpts();startGame(0)}});
    I.push({label:'Choose mission',act:()=>go('missions')},{label:'How to play',act:()=>go('howto')},{label:'Options',act:()=>go('options')});
  }else if(s==='pause'){
    I.push({label:'Resume',act:closeMenu},{label:'Restart mission',act:()=>startGame(Math.max(0,waveNo))},{label:'How to play',act:()=>go('howto')},{label:'Options',act:()=>go('options')},{label:'Main menu',act:()=>openMenu('title')});
  }else if(s==='options'){
    const q=v=>{T.quartzTime=clamp(Math.round(T.quartzTime+v),3,30);opts.quartzTime=T.quartzTime;saveOpts()};
    I.push({label:'Cracked crystal lasts',value:()=>T.quartzTime+' s',left:()=>q(-1),right:()=>q(1),act:()=>q(1)});
    I.push({label:'Tutorial tips',value:()=>opts.tips?'On':'Off',act:()=>{opts.tips=!opts.tips;if(!opts.tips){tut.cur=null;tut.queue=[]}saveOpts()}});
    const vol=(k,v)=>{opts[k]=clamp(opts[k]+v,0,10);if(opts.muted&&v>0)opts.muted=false;saveOpts();applyAudio();if(k==='sfxVol')sfx('capture')};
    const pct=k=>opts.muted?'Muted':opts[k]*10+'%';
    I.push({label:'Sound effects',value:()=>pct('sfxVol'),left:()=>vol('sfxVol',-1),right:()=>vol('sfxVol',1),act:()=>vol('sfxVol',opts.sfxVol>=10?-10:1)});
    I.push({label:'Mute all sound  (M)',value:()=>opts.muted?'On':'Off',act:()=>{opts.muted=!opts.muted;saveOpts();applyAudio()}});
    I.push({label:'Weakened enemies fuse',value:()=>T.fuseAt>0?'On':'Off',act:()=>{T.fuseAt=T.fuseAt>0?0:.5;opts.fuseAt=T.fuseAt;saveOpts()}});
    I.push({label:'Show all tutorial tips again',act:()=>{resetTips();note('Tips will show again')}});
    I.push({label:'Back',act:back});
  }else if(s==='missions'){
    WAVES.forEach((w,i)=>{const g=goalOf(w);I.push({label:(i+1)+'.  '+waveName(w,i),meta:g.type==='survive'?'survive '+g.time+' s':g.type==='capture'?'capture only':(w.enemies||[]).length+((w.enemies||[]).length===1?' enemy':' enemies'),act:()=>startGame(i)})});I.push({label:'Back',act:back});
  }else if(s==='howto'){
    I.push({label:'‹  Page '+(menu.page+1)+' of 2  ›',act:()=>{menu.page=1-menu.page;buildMenu()},left:()=>{menu.page=0;buildMenu()},right:()=>{menu.page=1;buildMenu()}},{label:'Back',act:back});
  }
  menu.items=I;menu.sel=clamp(menu.sel,0,I.length-1);
}
function menuKey(e){
  const c=e.code,it=menu.items[menu.sel];
  if(c==='ArrowUp'||c==='KeyW'){menu.sel=(menu.sel-1+menu.items.length)%menu.items.length;sfx('menu_move')}
  else if(c==='ArrowDown'||c==='KeyS'){menu.sel=(menu.sel+1)%menu.items.length;sfx('menu_move')}
  else if(c==='ArrowLeft'||c==='KeyA'){if(it&&it.left){it.left();sfx('menu_move')}else if(menu.screen==='howto'){menu.page=0;buildMenu();sfx('menu_move')}}
  else if(c==='ArrowRight'||c==='KeyD'){if(it&&it.right){it.right();sfx('menu_move')}else if(menu.screen==='howto'){menu.page=1;buildMenu();sfx('menu_move')}}
  else if((c==='Enter'||c==='Space'||c==='KeyJ')&&!e.repeat){if(it){sfx(it.label==='Back'?'menu_back':'menu_select');it.act()}}
  else if(c==='Escape'||c==='Backspace'||(c==='KeyP'&&menu.root==='pause')){sfx('menu_back');back()}
}
function menuItemAt(x,y){for(const r of menu.rects)if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return r.i;return -1}

  drawBackground(dt);

  for(const d of menu.demo){d.x-=d.sp*dt;if(d.x<W*.45){d.x=W+80;d.y=rand(90,H-90);if(d.t==='fused')d.k=Object.keys(FUSION)[Math.floor(rand(0,10))]}

  if(Math.random()<.5)particles.push({x:wx-58,y:wy+22,vx:rand(-120,-60),vy:rand(-15,15),life:.6,max:.6,color:Math.random()<.5?'#bffcff':'#fff3b0',spark:true});
  updateParticles(dt);drawParticles(true);

function drawMenu(dt){
  const s=menu.screen,pause=menu.root==='pause';menu.rects=[];

  else if(s!=='title'){ctx.fillStyle='rgba(5,7,16,.72)';ctx.fillRect(0,0,W,H)}

    ctx.fillStyle='#fff';ctx.font='bold 78px Arial';ctx.fillText('WIZARD',W/2+150,228);ctx.restore();
    ctx.save();ctx.translate(W/2+150,92);ctx.rotate(Math.PI/4+Math.sin(clock)*.1);ctx.fillStyle='#bffcff';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.fillRect(-10,-10,20,20);ctx.strokeRect(-10,-10,20,20);ctx.restore();
    ctx.fillStyle='#8a93c0';ctx.font='14px Arial';ctx.fillText('hypnotise  ·  capture  ·  fuse',W/2+150,256);

    if(sel){const g=ctx.createLinearGradient(r.x,0,r.x+r.w,0);g.addColorStop(0,'rgba(110,250,255,0)');g.addColorStop(.5,'rgba(110,250,255,.2)');g.addColorStop(1,'rgba(110,250,255,0)');ctx.fillStyle=g;ctx.fillRect(r.x,r.y,r.w,r.h);
      ctx.save();ctx.translate(r.x+(it.value||it.meta?14:r.w/2-ctx.measureText(it.label).width/2-28),r.y+r.h/2);ctx.rotate(Math.PI/4+clock*2);ctx.fillStyle='#bffcff';ctx.fillRect(-5,-5,10,10);ctx.restore()}
    ctx.font=(sel?'bold ':'')+(r.small?'16px':'20px')+' Arial';ctx.fillStyle=sel?'#fff':'#9aa3d8';
    if(it.value||it.meta){ctx.textAlign='left';ctx.fillText(it.label,r.x+30,r.y+r.h/2+6);ctx.textAlign='right';ctx.fillStyle=sel?'#9efcff':'#6a73a0';const v=it.value?it.value():it.meta;ctx.fillText(it.left&&sel?'‹ '+v+' ›':v,r.x+r.w-16,r.y+r.h/2+6);ctx.textAlign='center'}
    else ctx.fillText(it.label,r.x+r.w/2,r.y+r.h/2+7);
    if(sel&&it.sub){ctx.font='12px Arial';ctx.fillStyle='#6a73a0';ctx.fillText(it.sub,r.x+r.w/2,r.y+r.h+12)}
  });
  if(menu.noteT>0){menu.noteT-=dt;ctx.fillStyle='#7dff9a';ctx.font='14px Arial';ctx.fillText(menu.note,W/2,H-60)}
  ctx.fillStyle='#4f5885';ctx.font='12px Arial';ctx.fillText(lastInput==='pad'?'stick / d-pad choose  ·  A select  ·  ← → change  ·  B back':'↑ ↓ choose  ·  Enter select  ·  ← → change  ·  Esc back',W/2,H-22);
  if(BOOT.build&&s==='title'){ctx.textAlign='left';ctx.fillText(String(BOOT.build),16,H-22)}
  ctx.textAlign='left';
}
function menuLayout(){
  const s=menu.screen,n=menu.items.length;
  if(s==='title')return menu.items.map((it,i)=>({x:W/2+150-160,y:300+i*52,w:320,h:40}));
  if(s==='howto')return [{x:W/2-170,y:H-112,w:340,h:34},{x:W/2-100,y:H-74,w:200,h:34}];
  if(s==='missions'){const rows=11,start=clamp(menu.sel-5,0,Math.max(0,n-rows));return menu.items.map((it,i)=>i<start||i>=start+rows?null:{x:W/2-260,y:150+(i-start)*38,w:520,h:34,small:true})}
  const w=s==='options'?520:320,y0=s==='pause'?180:170;
  return menu.items.map((it,i)=>({x:W/2-w/2,y:y0+i*54,w,h:42}));
}
function drawHowTo(){
  ctx.save();ctx.textAlign='left';

    const rows=[['W A S D / arrows','Fly','L-stick / d-pad'],['hold Space / mouse','Scan — hypnotise the enemy in front of you','hold A / RT'],['J  ·  K  ·  L','Fire ally 1 · ally 2 · both','X  ·  B  ·  X+B'],['hold Shift','Line your allies up in front of you','hold RB'],
      ['Tab','Merge your two allies (fusion meter full)','LB'],['Q','Switch the weapon of a fused ally','LT'],['O','Ultimate beam — spends the fused ally','Y'],['Space / W (asleep)','Flap while the crystal is cracked','A'],['Esc  /  P','Pause','Start'],['Enter','Skip a tutorial tip','Back / View'],['M','Mute / unmute sound','—']];
    ctx.fillStyle='#6a73a0';ctx.font='bold 12px Arial';ctx.fillText('KEYBOARD',W/2-400,100);ctx.fillText('ACTION',W/2-195,100);ctx.fillText('GAMEPAD',W/2+235,100);
    rows.forEach(([k,v,p],i)=>{const y=110+i*38;ctx.fillStyle='rgba(28,36,80,.7)';ctx.fillRect(W/2-420,y,840,32);

    box(620,94,'Bullets',['Green — chases you','Red — flies straight ahead','Blue plasma — long charge, big hit','Pink laser — a line shows its aim, then it fires'],()=>{let y=-42;for(const k of Object.keys(BULLETS)){drawBulletIcon(k,0,y,1.6);y+=28}});
    box(40,262,'Enemies fuse',['A weakened enemy flies to another enemy and fuses with it','into a tougher form that uses both of their attacks.','Stop it on the way — or scan the fusion to break it','apart again, then capture or destroy the halves.'],()=>{ctx.scale(-1,1);drawFused('drone+spread',34,'#ffcf6a','#ff875a',false,clock);ctx.scale(-1,1)});

    box(40,430,'The crystal cracks',['Lose every heart and you fall asleep for '+T.quartzTime+' s.','Tap Space to flap — any hit, wall or edge is fatal.','Your allies turn on you and fly back to their posts','(they hold fire until they get there).'],()=>{ctx.scale(.8,.8);drawWizard({x:0,y:10,time:clock,sleep:true})});
    box(620,430,'Blocks, pillars, doors',['Blocks stop bullets, lasers and your scan.','Pillars scroll past — fly through the gap.','A key opens the door of its colour.','⚠ on the right edge = sprinter: shoot it for +1 ally bullet.'],()=>{drawBlock(-36,-36,'#3f8f7a',0,1,0,0,1);drawBlock(-36,-12,'#3f8f7a',1,0,0,0,2);drawBlock(-36,28,'#3f8f7a',0,0,0,0,3);drawDoorTile(4,-30,doorCol(1),false);drawDoorTile(4,-6,doorCol(1),true);drawKey(18,34,doorCol(1),1)});
  }
  ctx.restore();
}

/* =====================================================================

/* the scanner sound follows the game state: only while actually scanning in play */
function syncAudio(){
  const a=AUD();if(!a)return;
  const playing=!api.editMode&&!menu.on&&!gameOver;
  const on=playing&&!quartzDamaged&&isScanning()&&!scanLocked();
  a.scan(on,on?scanPct:0,on&&scanTarget);
}
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.033,(now-last)/1000);last=now;clock+=dt;frameDt=dt;
  try{
    pollPad(dt);
    if(api.editMode){if(api.onEditFrame)api.onEditFrame(dt)}
    else if(menu.on){ctx.setTransform(1,0,0,1,0,0);if(menu.root==='pause'){draw();ctx.setTransform(1,0,0,1,0,0)}else titleBackdrop(dt);drawMenu(dt)}
    else{update(dt);draw()}
    syncAudio();
  }catch(err){console.error(err)}
}

  makeEnemy,moveEnemy,checkLater,compilePath,pathAt,presetPts,validPath,
  drawEnemy,drawShape,drawFused,drawBulletIcon,drawBackground,drawPlayer,drawTileLayer,shade,
  info:()=>({waveNo,waveCount,wavesCleared,name:WAVES[waveNo]?WAVES[waveNo].name:'',left:enemies.filter(e=>e.tok===curTok).length+queue.length,loop:loopCount,score,converted,gameOver,menu:menu.on?menu.screen:''}),
  _debug:()=>({get goal(){return {goal,goalT,goalWon,waveActive,deathTitle}},die,allies,player,solid,beams,enemyBullets,tut,keyItems,doorAt,opened,get ult(){return ultFx},get mv(){return {mvS,mvLead,mvP,moverT,hasMover}},moverAt,get merging(){return merging},crack:()=>damageQuartz(),get enemiesNow(){return enemies},convert:e=>{convertEnemy(e);enemies=enemies.filter(q=>q!==e)}})});
window.SQ=api;
applyAudio();initStars();resetGame(BOOT.start|0);openMenu('title');requestAnimationFrame(loop);
})();
